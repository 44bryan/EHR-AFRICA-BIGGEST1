{% extends "layouts/base_authenticated.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-white">
        <h5 class="mb-0 fw-semibold">{{ title }}</h5>
      </div>
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">First Name <span class="text-danger">*</span></label>
              <input type="text" name="first_name" class="form-control" required value="{{ lead.first_name|default:'' }}">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Last Name <span class="text-danger">*</span></label>
              <input type="text" name="last_name" class="form-control" required value="{{ lead.last_name|default:'' }}">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Phone <span class="text-danger">*</span></label>
              <input type="tel" name="phone" class="form-control" required value="{{ lead.phone|default:'' }}">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Email</label>
              <input type="email" name="email" class="form-control" value="{{ lead.email|default:'' }}">
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Age</label>
              <input type="number" name="age" class="form-control" min="0" max="120" value="{{ lead.age|default:'' }}">
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Source <span class="text-danger">*</span></label>
              <select name="source" class="form-select" required>
                <option value="">-- Select --</option>
                {% for code, label in sources %}
                <option value="{{ code }}" {% if lead.source == code %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Priority</label>
              <select name="priority" class="form-select">
                <option value="0" {% if lead.priority == 0 %}selected{% endif %}>Normal</option>
                <option value="1" {% if lead.priority == 1 %}selected{% endif %}>High</option>
                <option value="2" {% if lead.priority == 2 %}selected{% endif %}>Urgent</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label fw-semibold">Inquiry / Reason for Interest <span class="text-danger">*</span></label>
              <textarea name="inquiry" class="form-control" rows="3" required>{{ lead.inquiry|default:'' }}</textarea>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Next Follow-up Date</label>
              <input type="date" name="next_follow_up" class="form-control" value="{{ lead.next_follow_up|date:'Y-m-d'|default:'' }}">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Assign To</label>
              <select name="assigned_to" class="form-select">
                <option value="">-- Unassigned --</option>
                {% for s in staff %}
                <option value="{{ s.id }}" {% if lead.assigned_to_id == s.id %}selected{% endif %}>{{ s.full_name }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-12 d-flex gap-2 justify-content-end">
              <a href="{% url 'leads:lead_list' %}" class="btn btn-secondary">Cancel</a>
              <button type="submit" class="btn btn-primary">Save Lead</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
