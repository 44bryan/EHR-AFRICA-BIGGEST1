{% extends "layouts/base_authenticated.html" %}
{% block title %}Log Activity — {{ lead.full_name }}{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7"><div class="card mb-3 border-0 shadow-sm"><div class="card-header bg-white"><h5 class="mb-0 fw-semibold">Log Activity: {{ lead.full_name }}</h5></div><div class="card-body"><form method="post">{% csrf_token %}<div class="row g-3 mb-3"><div class="col-md-6"><label class="form-label fw-semibold">Activity Type</label><select name="activity_type" class="form-select"><option value="CALL">Phone Call</option><option value="SMS">SMS</option><option value="WHATSAPP">WhatsApp</option><option value="EMAIL">Email</option><option value="MEETING">Meeting</option><option value="NOTE">Note</option></select></div><div class="col-md-6"><label class="form-label fw-semibold">Update Status</label><select name="new_status" class="form-select"><option value="">-- No Change --</option>{% for code, label in statuses %}<option value="{{ code }}">{{ label }}</option>{% endfor %}</select></div></div><div class="mb-3"><label class="form-label fw-semibold">Summary <span class="text-danger">*</span></label><textarea name="summary" class="form-control" rows="3" required placeholder="What was discussed?"></textarea></div><div class="mb-3"><label class="form-label fw-semibold">Outcome</label><textarea name="outcome" class="form-control" rows="2" placeholder="What was the result?"></textarea></div><div class="mb-3"><label class="form-label fw-semibold">Next Action</label><input type="text" name="next_action" class="form-control" placeholder="What should happen next?"></div><div class="mb-4"><label class="form-label fw-semibold">Next Follow-up Date</label><input type="date" name="next_follow_up" class="form-control"></div><div class="d-grid"><button type="submit" class="btn btn-primary">Save Activity</button></div></form></div></div><div class="text-center mt-3"><a href="{% url 'leads:lead_detail' lead.id %}" class="text-muted"><i class="bi bi-arrow-left me-1"></i>Back</a></div></div></div>
{% endblock %}
