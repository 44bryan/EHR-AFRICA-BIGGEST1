<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{ title }}</title>
<style>
  @page {
    size: A4;
    margin: 20mm 18mm 20mm 18mm;
    @bottom-center {
      content: "EHR Africa — Dry Run Workflow Guide · Page " counter(page) " of " counter(pages);
      font-size: 8pt; color: #94a3b8;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10pt; color: #1e293b; line-height: 1.5; }

  /* ── Header ── */
  .doc-header { background: {{ accent }}; color: #fff; padding: 16px 20px 14px; border-radius: 8px; margin-bottom: 18px; }
  .doc-header .flow-label { font-size: 8pt; text-transform: uppercase; letter-spacing: .12em; opacity: .8; margin-bottom: 3px; }
  .doc-header h1 { font-size: 18pt; font-weight: 800; margin-bottom: 4px; }
  .doc-header .subtitle { font-size: 9pt; opacity: .85; }

  /* ── Meta strip ── */
  .meta-strip { display: flex; gap: 24px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 8px 14px; margin-bottom: 18px; font-size: 8.5pt; }
  .meta-strip .m-item { display: flex; flex-direction: column; }
  .meta-strip .m-label { color: #64748b; font-size: 7.5pt; text-transform: uppercase; letter-spacing: .06em; }
  .meta-strip .m-val { font-weight: 700; }

  /* ── Steps ── */
  .steps { list-style: none; }
  .step { display: flex; gap: 12px; margin-bottom: 14px; page-break-inside: avoid; }
  .step-num { flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%; background: {{ accent }}; color: #fff; font-weight: 800; font-size: 10pt; display: flex; align-items: center; justify-content: center; margin-top: 2px; }
  .step-body { flex: 1; }
  .step-title { font-weight: 700; font-size: 10.5pt; margin-bottom: 3px; }
  .step-role { display: inline-block; font-size: 7.5pt; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; background: {{ accent_light }}; color: {{ accent }}; border-radius: 20px; padding: 1px 8px; margin-bottom: 5px; }
  .step-screen { font-size: 8pt; color: #64748b; font-style: italic; margin-bottom: 4px; }
  .step-screen strong { color: #334155; font-style: normal; }
  .step-desc { font-size: 9pt; color: #374151; }
  .step-desc ul { padding-left: 14px; margin-top: 3px; }
  .step-desc li { margin-bottom: 2px; }

  /* ── Note boxes ── */
  .note { border-left: 3px solid {{ accent }}; background: {{ accent_light }}; padding: 7px 10px; border-radius: 0 5px 5px 0; margin-bottom: 14px; font-size: 8.5pt; page-break-inside: avoid; }
  .note strong { color: {{ accent }}; }
  .warn { border-left: 3px solid #f59e0b; background: #fffbeb; padding: 7px 10px; border-radius: 0 5px 5px 0; margin-bottom: 14px; font-size: 8.5pt; page-break-inside: avoid; }
  .warn strong { color: #b45309; }

  /* ── Flow diagram strip ── */
  .flow-bar { display: flex; align-items: center; gap: 0; margin-bottom: 18px; flex-wrap: wrap; row-gap: 6px; }
  .flow-node { background: {{ accent }}; color: #fff; font-size: 7.5pt; font-weight: 700; padding: 5px 8px; border-radius: 4px; text-align: center; min-width: 60px; }
  .flow-arrow { color: #94a3b8; font-size: 12pt; padding: 0 3px; font-weight: 300; }

  /* ── Section heading ── */
  h2 { font-size: 11pt; font-weight: 700; color: {{ accent }}; border-bottom: 1.5px solid {{ accent_border }}; padding-bottom: 4px; margin-bottom: 12px; margin-top: 18px; }

  /* ── Footer note ── */
  .doc-footer { margin-top: 24px; border-top: 1px solid #e2e8f0; padding-top: 10px; font-size: 8pt; color: #94a3b8; display: flex; justify-content: space-between; }
</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
