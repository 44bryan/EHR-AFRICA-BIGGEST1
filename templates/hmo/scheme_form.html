{% extends "layouts/base_authenticated.html" %}
{% block title %}{{ action }} Insurance Scheme{% endblock %}
{% block page_header %}<h5 class="mb-0 fw-bold">{{ action }} Insurance Scheme</h5>{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <form method="post" class="card border-0 shadow-sm">
      {% csrf_token %}
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-8">
            <label class="form-label fw-semibold">Scheme Name <span class="text-danger">*</span></label>
            <input type="text" name="name" class="form-control" required value="{{ scheme.name|default:'' }}">
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">Code <span class="text-danger">*</span></label>
            <input type="text" name="code" class="form-control" required value="{{ scheme.code|default:'' }}" placeholder="e.g. CNPS01">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Type</label>
            <select name="scheme_type" class="form-select">
              {% for val, label in scheme_types %}
              <option value="{{ val }}" {% if scheme.scheme_type == val %}selected{% endif %}>{{ label }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Coverage % <span class="text-danger">*</span></label>
            <input type="number" name="coverage_pct" class="form-control" min="0" max="100" step="0.01"
                   value="{{ scheme.coverage_pct|default:'80' }}" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Max Annual Claim (FCFA)</label>
            <input type="number" name="max_annual_claim" class="form-control" min="0"
                   value="{{ scheme.max_annual_claim|default:'' }}" placeholder="Blank = unlimited">
          </div>
          <div class="col-12">
            <div class="form-check">
              <input type="checkbox" name="pre_auth_required" class="form-check-input" id="pa"
                     {% if scheme.pre_auth_required %}checked{% endif %}>
              <label class="form-check-label" for="pa">Pre-authorisation required before rendering service</label>
            </div>
            {% if scheme %}
            <div class="form-check mt-1">
              <input type="checkbox" name="is_active" class="form-check-input" id="ia"
                     {% if scheme.is_active %}checked{% endif %}>
              <label class="form-check-label" for="ia">Scheme is active</label>
            </div>
            {% endif %}
          </div>
          <div class="col-md-6">
            <label class="form-label">Contact Phone</label>
            <input type="text" name="contact_phone" class="form-control" value="{{ scheme.contact_phone|default:'' }}">
          </div>
          <div class="col-md-6">
            <label class="form-label">Contact Email</label>
            <input type="email" name="contact_email" class="form-control" value="{{ scheme.contact_email|default:'' }}">
          </div>
          <div class="col-12">
            <label class="form-label">Address</label>
            <textarea name="address" class="form-control" rows="2">{{ scheme.address|default:'' }}</textarea>
          </div>
          <div class="col-12">
            <label class="form-label">Notes</label>
            <textarea name="notes" class="form-control" rows="2">{{ scheme.notes|default:'' }}</textarea>
          </div>
        </div>
      </div>
      <div class="card-footer bg-transparent d-flex gap-2">
        <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i>Save</button>
        <a href="{% url 'hmo:scheme_list' %}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
