{% extends "layouts/base_authenticated.html" %}
{% block title %}New Claim Batch{% endblock %}
{% block page_header %}<h5 class="mb-0 fw-bold">Create New Claim Batch</h5>{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <form method="post" class="card border-0 shadow-sm">
      {% csrf_token %}
      <div class="card-body">
        <div class="mb-3">
          <label class="form-label fw-semibold">Insurance Scheme <span class="text-danger">*</span></label>
          <select name="scheme" class="form-select" required>
            <option value="">— Select scheme —</option>
            {% for s in schemes %}
            <option value="{{ s.pk }}">{{ s.name }} ({{ s.code }})</option>
            {% endfor %}
          </select>
          <small class="text-muted">Batch number will be auto-generated.</small>
        </div>
        <div class="mb-3">
          <label class="form-label">Notes</label>
          <textarea name="notes" class="form-control" rows="2"></textarea>
        </div>
      </div>
      <div class="card-footer bg-transparent d-flex gap-2">
        <button type="submit" class="btn btn-success">Create Batch</button>
        <a href="{% url 'hmo:batch_list' %}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
