{% comment %}Shared PDF styles — include inside <head> of every PDF template{% endcomment %}
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 10pt; color: #1a1a1a; }

  /* ── Professional Letterhead ── */
  .letterhead {
    border-bottom: 3px solid #0d6efd;
    padding-bottom: 12px;
    margin-bottom: 16px;
  }
  .lh-inner {
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }
  .lh-logo {
    width: 60px;
    height: 60px;
    object-fit: contain;
    flex-shrink: 0;
    border-radius: 8px;
  }
  .lh-info { flex: 1; }
  .lh-name { font-size: 16pt; font-weight: 800; color: #0d6efd; line-height: 1.1; }
  .lh-sub  { font-size: 9pt; color: #0d6efd; font-style: italic; margin-bottom: 2px; }
  .lh-detail { font-size: 8pt; color: #555; }
  .lh-seal { text-align: right; flex-shrink: 0; }

  /* ── Accreditation bar ── */
  .accred-bar {
    background: #0d6efd;
    color: #fff;
    font-size: 7pt;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: 3px 10px;
    margin-bottom: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-radius: 3px;
  }

  /* ── Report title band ── */
  .report-title {
    background: #0d6efd;
    color: white;
    padding: 7px 12px;
    font-size: 11pt;
    font-weight: 700;
    margin-bottom: 14px;
    border-radius: 3px;
  }

  /* ── Patient bar ── */
  .patient-bar {
    background: #f0f7ff;
    border-left: 4px solid #0d6efd;
    padding: 8px 12px;
    margin-bottom: 14px;
    border-radius: 0 4px 4px 0;
    font-size: 9pt;
  }
  .patient-bar strong { color: #0d6efd; }

  /* ── Sections ── */
  .section { margin-bottom: 12px; }
  .section-title {
    font-size: 8.5pt;
    font-weight: 700;
    text-transform: uppercase;
    color: #0d6efd;
    border-bottom: 1px solid #dee2e6;
    padding-bottom: 3px;
    margin-bottom: 7px;
    letter-spacing: .05em;
  }
  .field-row { display: flex; margin-bottom: 4px; font-size: 9.5pt; }
  .field-label { font-weight: 600; width: 180px; flex-shrink: 0; color: #444; }
  .field-value { flex-grow: 1; }

  /* ── Data tables ── */
  .data-table { width: 100%; border-collapse: collapse; font-size: 9pt; margin-top: 4px; }
  .data-table th { background: #e9ecef; padding: 4px 8px; text-align: left; font-weight: 600; border: 1px solid #dee2e6; }
  .data-table td { padding: 4px 8px; border: 1px solid #dee2e6; }
  .data-table tbody tr:nth-child(even) { background: #f8f9fa; }

  /* ── Diagnosis / content boxes ── */
  .diagnosis-box { background: #e8f4f8; border: 1px solid #bee5eb; border-radius: 4px; padding: 8px 10px; }
  .primary-dx    { font-weight: bold; color: #0c5460; }
  .info-box      { background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 4px; padding: 8px 10px; }
  .warning-box   { background: #fff3cd; border: 1px solid #ffc107; border-radius: 4px; padding: 8px 10px; }

  /* ── Signature ── */
  .signature-block { margin-top: 24px; }
  .signature-line { border-top: 1.5px solid #1a1a1a; width: 220px; margin-top: 28px; padding-top: 4px; font-size: 8.5pt; }

  /* ── Footer ── */
  .pdf-footer {
    border-top: 1.5px solid #dee2e6;
    margin-top: 20px;
    padding-top: 6px;
    font-size: 7.5pt;
    color: #888;
    display: flex;
    justify-content: space-between;
  }

  /* ── Authorization / Signature block (stats reports) ── */
  .auth-block { margin-top: 20px; page-break-inside: avoid; }
  .auth-row { display: flex; gap: 24px; margin-top: 18px; }
  .auth-col { flex: 1; border-top: 1.5px solid #333; padding-top: 5px; }
  .auth-role { font-size: 8.5pt; font-weight: 700; }
  .auth-title { font-size: 8pt; color: #555; margin-top: 2px; }
  .auth-sig { font-size: 8pt; color: #888; margin-top: 10px; }
  .auth-date { font-size: 8pt; color: #888; margin-top: 3px; }
  .data-note { background:#f8f9fa; border:1px solid #dee2e6; border-radius:4px;
               padding:6px 10px; font-size: 7.5pt; color:#6c757d; margin-top:16px; line-height:1.5; }

  /* Orientation is set per-template via {{ orientation }} — do not set size here */
  @page {
    margin: 1.4cm 1.8cm;
    @bottom-right {
      content: "Page " counter(page) " of " counter(pages);
      font-size: 7pt;
      color: #aaa;
      font-family: "Helvetica Neue", Arial, sans-serif;
    }
  }
  @media print { body { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }

  /* ── Page-break rules — keep headings with their content ── */
  .section-title { page-break-after: avoid; break-after: avoid; }
  table { page-break-inside: auto; break-inside: auto; }
  tr { page-break-inside: avoid; break-inside: avoid; }
  thead { display: table-header-group; }
  .kpi-row { page-break-inside: avoid; break-inside: avoid; }
  .two-col { page-break-inside: avoid; break-inside: avoid; }
  .report-title { page-break-after: avoid; break-after: avoid; }
  .kpi-box { page-break-inside: avoid; break-inside: avoid; }
</style>
