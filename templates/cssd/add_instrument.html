{% extends "layouts/base_authenticated.html" %}
{% block title %}Add Instrument{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-white d-flex align-items-center justify-content-between">
        <h5 class="mb-0 fw-semibold"><i class="bi bi-tools me-2 text-primary"></i>Add Instrument</h5>
        <a href="{% url 'cssd:instrument_list' %}" class="btn btn-outline-secondary btn-sm">
          <i class="bi bi-arrow-left me-1"></i>Back
        </a>
      </div>
      <div class="card-body">
        {% if messages %}{% for msg in messages %}
        <div class="alert alert-{{ msg.tags }}">{{ msg }}</div>
        {% endfor %}{% endif %}
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold small">Instrument Code <span class="text-danger">*</span></label>
            <input type="text" name="instrument_code" class="form-control" placeholder="e.g. CSSD-001" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold small">Instrument Name <span class="text-danger">*</span></label>
            <input type="text" name="name" class="form-control" placeholder="e.g. Slit Lamp Instrument Set" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold small">Department / Theatre</label>
            <select name="department" class="form-select">
              <option value="">— None —</option>
              {% for dept in departments %}
              <option value="{{ dept.id }}">{{ dept.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold small">Description</label>
            <textarea name="description" class="form-control" rows="2"></textarea>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold small">Notes</label>
            <textarea name="notes" class="form-control" rows="2"></textarea>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-plus-circle me-1"></i>Add Instrument
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
