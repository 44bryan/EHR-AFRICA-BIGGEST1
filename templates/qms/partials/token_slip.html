<div class="card border-2 border-primary text-center p-3" style="max-width:300px;margin:0 auto;">
  <div class="fw-bold text-muted small text-uppercase mb-1">{{ token.get_service_type_display }}</div>
  <div class="display-4 fw-bold text-primary mb-1">{{ token.token_number }}</div>
  <div class="fw-semibold mb-1">{{ token.display_name }}</div>
  <div class="text-muted small mb-2">{{ token.issued_at|date:"d M Y — H:i" }}</div>
  {% if token.priority == 2 %}
    <span class="badge bg-danger">EMERGENCY</span>
  {% elif token.priority == 1 %}
    <span class="badge bg-warning text-dark">PRIORITY</span>
  {% else %}
    <span class="badge bg-secondary">REGULAR</span>
  {% endif %}
  <div class="mt-3 border-top pt-2 text-muted" style="font-size:0.7rem;">Please wait for your number to be called</div>
</div>
