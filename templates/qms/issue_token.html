{% extends "layouts/base_authenticated.html" %}
{% block title %}Issue Queue Token{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-white">
        <h5 class="mb-0 fw-semibold"><i class="bi bi-ticket-perforated me-2"></i>Issue Queue Token</h5>
      </div>
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold">Service Type <span class="text-danger">*</span></label>
            <select name="service_type" class="form-select" required>
              {% for code, label in service_types %}
              <option value="{{ code }}">{{ label }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Patient (optional)</label>
            <select name="patient_id" class="form-select">
              <option value="">-- Walk-in / No patient ID --</option>
              {% for patient in patients %}
              <option value="{{ patient.id }}">{{ patient.full_name }} ({{ patient.patient_id }})</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Patient Name (if walk-in)</label>
            <input type="text" name="patient_name" class="form-control" placeholder="Enter name if not registered">
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Priority</label>
            <select name="priority" class="form-select">
              <option value="0">Normal</option>
              <option value="1">Priority</option>
              <option value="2">Emergency</option>
            </select>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg">
              <i class="bi bi-ticket-perforated me-2"></i>Issue Token
            </button>
          </div>
        </form>
      </div>
    </div>
    <div class="text-center mt-3">
      <a href="{% url 'qms:dashboard' %}" class="text-muted"><i class="bi bi-arrow-left me-1"></i>Back to Queue</a>
    </div>
  </div>
</div>
{% endblock %}
