{% extends "layouts/base_authenticated.html" %}
{% block title %}Add Nursing Note{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7"><div class="card border-0 shadow-sm"><div class="card-header bg-white"><h5 class="mb-0 fw-semibold">Nursing Note — {{ admission.patient.full_name }}</h5></div><div class="card-body"><form method="post">{% csrf_token %}<div class="mb-3"><label class="form-label fw-semibold">Note Type</label><select name="note_type" class="form-select"><option value="ASSESSMENT">Nursing Assessment</option><option value="OBSERVATION" selected>Observation</option><option value="MEDICATION">Medication Note</option><option value="PROCEDURE">Procedure Note</option><option value="HANDOVER">Handover</option><option value="OTHER">Other</option></select></div><div class="row g-2 mb-3"><div class="col-md-4"><label class="form-label small fw-semibold">BP</label><input type="text" name="bp" class="form-control form-control-sm" placeholder="e.g. 120/80"></div><div class="col-md-4"><label class="form-label small fw-semibold">Pulse</label><input type="text" name="pulse" class="form-control form-control-sm" placeholder="bpm"></div><div class="col-md-4"><label class="form-label small fw-semibold">Temp (°C)</label><input type="text" name="temp" class="form-control form-control-sm" placeholder="36.5"></div><div class="col-md-4"><label class="form-label small fw-semibold">SpO2 (%)</label><input type="text" name="spo2" class="form-control form-control-sm" placeholder="98%"></div><div class="col-md-4"><label class="form-label small fw-semibold">RR</label><input type="text" name="rr" class="form-control form-control-sm" placeholder="breaths/min"></div></div><div class="mb-4"><label class="form-label fw-semibold">Note Content <span class="text-danger">*</span></label><textarea name="content" class="form-control" rows="5" required></textarea></div><div class="d-grid"><button type="submit" class="btn btn-primary">Save Note</button></div></form></div></div><div class="text-center mt-3"><a href="{% url 'ipd:admission_detail' admission.id %}" class="text-muted"><i class="bi bi-arrow-left me-1"></i>Back to Admission</a></div></div></div>
{% endblock %}
