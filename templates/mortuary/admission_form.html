{% extends "base.html" %}

{% block title %}Receive Body{% endblock %}

{% block content %}
<div class="d-flex align-items-center mb-4">
  <a href="{% url 'mortuary:admission_list' %}" class="btn btn-sm btn-outline-secondary me-3">
    <i class="fas fa-arrow-left"></i>
  </a>
  <h4 class="mb-0">Receive Body</h4>
</div>

<div class="card border-0 shadow-sm" style="max-width:750px;">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="row g-3 mb-3">
        <div class="col-md-8">
          <label class="form-label fw-semibold">Full Name of Deceased</label>
          <input type="text" name="full_name" class="form-control" placeholder="As on ID document" required>
        </div>
        <div class="col-md-2">
          <label class="form-label fw-semibold">Age (yrs)</label>
          <input type="number" name="age_years" class="form-control" min="0" max="150">
        </div>
        <div class="col-md-2">
          <label class="form-label fw-semibold">Gender</label>
          <select name="gender" class="form-select">
            <option value="M">Male</option>
            <option value="F">Female</option>
            <option value="U">Unknown</option>
          </select>
        </div>
      </div>
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold">Date & Time of Death</label>
          <input type="datetime-local" name="date_of_death" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Place of Death</label>
          <input type="text" name="place_of_death" class="form-control" placeholder="e.g. Ward 3, Home, Road">
        </div>
      </div>
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold">Cause of Death</label>
          <select name="cause_of_death" class="form-select">
            {% for val, label in cause_choices %}
            <option value="{{ val }}" {% if val == 'PENDING' %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Body Condition</label>
          <select name="body_condition" class="form-select">
            <option value="GOOD">Good</option>
            <option value="DECOMPOSED">Decomposed</option>
            <option value="BURNED">Burned</option>
            <option value="TRAUMATIC">Traumatic Injuries</option>
            <option value="OTHER">Other</option>
          </select>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Provisional Cause / Clinical Summary</label>
        <textarea name="provisional_cause_text" class="form-control" rows="2"
          placeholder="Brief clinical summary of cause of death…"></textarea>
      </div>
      <div class="mb-3">
        <label class="form-label">Identifying Marks</label>
        <textarea name="identifying_marks" class="form-control" rows="2"
          placeholder="Scars, tattoos, birthmarks, prosthetics…"></textarea>
      </div>
      <hr>
      <h6 class="mb-3">Next of Kin</h6>
      <div class="row g-3 mb-3">
        <div class="col-md-5">
          <label class="form-label">Name</label>
          <input type="text" name="next_of_kin_name" class="form-control">
        </div>
        <div class="col-md-4">
          <label class="form-label">Phone</label>
          <input type="tel" name="next_of_kin_phone" class="form-control">
        </div>
        <div class="col-md-3">
          <label class="form-label">Relationship</label>
          <input type="text" name="next_of_kin_relationship" class="form-control" placeholder="e.g. Spouse">
        </div>
      </div>
      <hr>
      <h6 class="mb-3">Legal / Administrative</h6>
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label">Police Case Number</label>
          <input type="text" name="police_case_number" class="form-control" placeholder="If applicable">
        </div>
        <div class="col-md-6">
          <label class="form-label">Doctor Who Certified Death</label>
          <input type="text" name="doctor_who_certified" class="form-control">
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label">Additional Notes</label>
        <textarea name="notes" class="form-control" rows="2"></textarea>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-secondary">Receive Body</button>
        <a href="{% url 'mortuary:dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
