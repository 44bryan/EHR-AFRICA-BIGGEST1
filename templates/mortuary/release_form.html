{% extends "base.html" %}

{% block title %}Release Body{% endblock %}

{% block content %}
<div class="d-flex align-items-center mb-4">
  <a href="{% url 'mortuary:admission_detail' adm.pk %}" class="btn btn-sm btn-outline-secondary me-3">
    <i class="fas fa-arrow-left"></i>
  </a>
  <h4 class="mb-0">Release Body</h4>
</div>

<div class="alert alert-warning">
  <i class="fas fa-exclamation-triangle me-2"></i>
  <strong>Confirm:</strong> You are releasing <strong>{{ adm.full_name }}</strong> ({{ adm.body_number }}).
  This action cannot be undone.
</div>

<div class="card border-0 shadow-sm" style="max-width:700px;">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <h6 class="mb-3">Released To</h6>
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold">Name</label>
          <input type="text" name="released_to_name" class="form-control" required>
        </div>
        <div class="col-md-3">
          <label class="form-label fw-semibold">Relationship</label>
          <input type="text" name="relationship" class="form-control" placeholder="e.g. Son">
        </div>
        <div class="col-md-3">
          <label class="form-label">Phone</label>
          <input type="tel" name="released_to_phone" class="form-control">
        </div>
      </div>
      <div class="row g-3 mb-3">
        <div class="col-md-4">
          <label class="form-label">ID Type</label>
          <input type="text" name="released_to_id_type" class="form-control" placeholder="NIC / Passport…">
        </div>
        <div class="col-md-8">
          <label class="form-label">ID Number</label>
          <input type="text" name="released_to_id_number" class="form-control">
        </div>
      </div>
      <hr>
      <h6 class="mb-3">Transport</h6>
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label">Funeral Home</label>
          <input type="text" name="funeral_home" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label">Transport Provider</label>
          <input type="text" name="transport_provider" class="form-control" placeholder="Ambulance / Hearse">
        </div>
      </div>
      <hr>
      <h6 class="mb-3">Death Certificate</h6>
      <div class="row g-3 mb-3">
        <div class="col-auto">
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="checkbox" name="death_certificate_issued"
              id="cert_issued" value="1" onchange="toggleCertNum()">
            <label class="form-check-label" for="cert_issued">Death Certificate Issued</label>
          </div>
        </div>
        <div class="col-md-5 d-none" id="certNumRow">
          <input type="text" name="certificate_number" class="form-control form-control-sm"
            placeholder="Certificate number">
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label">Notes</label>
        <textarea name="notes" class="form-control" rows="2"></textarea>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-success">Confirm Release</button>
        <a href="{% url 'mortuary:admission_detail' adm.pk %}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>

<script>
function toggleCertNum() {
  const checked = document.getElementById('cert_issued').checked;
  document.getElementById('certNumRow').classList.toggle('d-none', !checked);
}
</script>
{% endblock %}
