{% extends "layouts/base_authenticated.html" %}

{% block title %}Request Post-Mortem{% endblock %}

{% block content %}
<div class="d-flex align-items-center mb-4">
  <a href="{% url 'mortuary:admission_detail' adm.pk %}" class="btn btn-sm btn-outline-secondary me-3">
    <i class="fas fa-arrow-left"></i>
  </a>
  <h4 class="mb-0">Request Post-Mortem</h4>
</div>

<div class="card border-0 shadow-sm" style="max-width:600px;">
  <div class="card-header bg-white">
    <strong>{{ adm.full_name }}</strong>
    <span class="text-muted ms-2 small">{{ adm.body_number }}</span>
  </div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label fw-semibold">Post-Mortem Type</label>
        <select name="pm_type" class="form-select" required>
          {% for val, label in pm_type_choices %}
          <option value="{{ val }}">{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Reason / Indication</label>
        <textarea name="reason" class="form-control" rows="3"
          placeholder="Why is this post-mortem being requested?" required></textarea>
      </div>
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label">Pathologist (if known)</label>
          <input type="text" name="pathologist" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label">Scheduled Date & Time</label>
          <input type="datetime-local" name="scheduled_at" class="form-control">
        </div>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-warning">Submit Request</button>
        <a href="{% url 'mortuary:admission_detail' adm.pk %}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
