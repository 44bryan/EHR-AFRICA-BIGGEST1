{% extends 'layouts/base_authenticated.html' %}
{% load humanize ehr_tags %}

{% block title %}Register New Cheque Book{% endblock %}

{% block content %}
<div class="d-flex align-items-center mb-3">
  <h4 class="mb-0 fw-bold">
    <i class="bi bi-journal-text me-2"></i>Register New Cheque Book
  </h4>
</div>

<div class="card border-0 shadow-sm">
  <div class="card-body">
    <form method="post" action="{% url 'billing:chequebook_create' %}">
      {% csrf_token %}

      <div class="row g-3">
        <div class="col-md-6">
          <label for="id_bank_account" class="form-label fw-semibold">Bank Account <span class="text-danger">*</span></label>
          <select name="bank_account" id="id_bank_account" class="form-select form-select-sm" required>
            <option value="">-- Select Bank Account --</option>
            {% for ba in bank_accounts %}
              <option value="{{ ba.pk }}">{{ ba.bank_name }} &mdash; {{ ba.account_number }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-md-6">
          <label for="id_series_prefix" class="form-label fw-semibold">Series Prefix</label>
          <input type="text" name="series_prefix" id="id_series_prefix" class="form-control form-control-sm"
                 placeholder="e.g. CHQ-A">
        </div>

        <div class="col-md-4">
          <label for="id_start_number" class="form-label fw-semibold">Start Number <span class="text-danger">*</span></label>
          <input type="number" name="start_number" id="id_start_number" class="form-control form-control-sm"
                 min="1" required>
        </div>

        <div class="col-md-4">
          <label for="id_end_number" class="form-label fw-semibold">End Number <span class="text-danger">*</span></label>
          <input type="number" name="end_number" id="id_end_number" class="form-control form-control-sm"
                 min="1" required>
        </div>

        <div class="col-md-4">
          <label for="id_received_date" class="form-label fw-semibold">Received Date <span class="text-danger">*</span></label>
          <input type="date" name="received_date" id="id_received_date" class="form-control form-control-sm"
                 value="{{ today }}" required>
        </div>

        <div class="col-12">
          <label for="id_notes" class="form-label fw-semibold">Notes</label>
          <textarea name="notes" id="id_notes" rows="2" class="form-control form-control-sm"></textarea>
        </div>
      </div>

      <div class="mt-4 d-flex gap-2">
        <button type="submit" class="btn btn-primary btn-sm">
          <i class="bi bi-check-lg me-1"></i>Register Cheque Book
        </button>
        <a href="{% url 'billing:chequebook_list' %}" class="btn btn-outline-secondary btn-sm">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
