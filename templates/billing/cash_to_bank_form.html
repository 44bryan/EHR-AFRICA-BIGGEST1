{% extends 'layouts/base_authenticated.html' %}
{% load humanize ehr_tags %}

{% block title %}Record Cash-to-Bank Deposit{% endblock %}

{% block content %}
<nav aria-label="breadcrumb" class="mb-3">
  <ol class="breadcrumb mb-0 small">
    <li class="breadcrumb-item"><a href="{% url 'billing:dashboard' %}">Billing</a></li>
    <li class="breadcrumb-item"><a href="{% url 'billing:cash_to_bank_list' %}">Cash-to-Bank</a></li>
    <li class="breadcrumb-item active">New Deposit</li>
  </ol>
</nav>

<div class="d-flex align-items-center mb-3">
  <h4 class="mb-0 fw-bold">
    <i class="bi bi-cash-coin me-2"></i>Record Cash-to-Bank Deposit
  </h4>
</div>

<div class="card border-0 shadow-sm">
  <div class="card-body">
    <form method="post" action="{% url 'billing:cash_to_bank_create' %}">
      {% csrf_token %}

      <div class="row g-3">
        <div class="col-md-6">
          <label for="id_bank_account" class="form-label fw-semibold">Bank Account <span class="text-danger">*</span></label>
          <select name="bank_account" id="id_bank_account" class="form-select form-select-sm" required>
            <option value="">-- Select Bank Account --</option>
            {% for ba in bank_accounts %}
              <option value="{{ ba.pk }}">{{ ba.bank_name }} &mdash; {{ ba.account_number }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-md-3">
          <label for="id_deposit_date" class="form-label fw-semibold">Deposit Date <span class="text-danger">*</span></label>
          <input type="date" name="deposit_date" id="id_deposit_date" class="form-control form-control-sm"
                 value="{{ today }}" required>
        </div>

        <div class="col-md-3">
          <label for="id_amount" class="form-label fw-semibold">Amount (XAF) <span class="text-danger">*</span></label>
          <input type="number" name="amount" id="id_amount" class="form-control form-control-sm"
                 step="1" min="1" required>
        </div>

        <div class="col-md-6">
          <label for="id_reference" class="form-label fw-semibold">Reference (Deposit Slip #)</label>
          <input type="text" name="reference" id="id_reference" class="form-control form-control-sm"
                 placeholder="e.g. DEP-20260920-001">
        </div>

        <div class="col-md-6">
          <label for="id_notes" class="form-label fw-semibold">Notes</label>
          <textarea name="notes" id="id_notes" rows="2" class="form-control form-control-sm"></textarea>
        </div>
      </div>

      <div class="mt-4 d-flex gap-2">
        <button type="submit" class="btn btn-primary btn-sm">
          <i class="bi bi-check-lg me-1"></i>Record Deposit
        </button>
        <a href="{% url 'billing:cash_to_bank_list' %}" class="btn btn-outline-secondary btn-sm">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
