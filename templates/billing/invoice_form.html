{% extends "layouts/base_authenticated.html" %}
{% block title %}Direct Bill — Select Patient{% endblock %}

{% block content %}
<style>
  .pick-card {
    max-width: 780px;
    margin: 1.5rem auto;
    background: #fff;
    border-radius: 12px;
    border: 1px solid #dee2e6;
    box-shadow: 0 2px 12px rgba(0,0,0,.07);
    overflow: hidden;
  }
  .pick-header {
    background: #0d6efd;
    color: #fff;
    padding: 1.25rem 1.75rem;
  }
  .pick-body { padding: 1.5rem 1.75rem; }
  .search-box .input-group-text { background: #fff; border-right: 0; }
  .search-box .form-control { border-left: 0; font-size: 1rem; padding: .6rem .75rem; }
  .search-box .form-control:focus { box-shadow: none; }
  #ptDrop {
    position: absolute; top: 100%; left: 0; right: 0;
    background: #fff;
    border: 1px solid #dee2e6; border-radius: 8px;
    max-height: 440px; overflow-y: auto;
    box-shadow: 0 6px 20px rgba(0,0,0,.12);
    z-index: 1055; display: none;
  }
  .pt-row {
    padding: .4rem 1rem; cursor: pointer;
    border-bottom: 1px solid #f0f0f0; font-size: .88rem;
  }
  .pt-row:last-child { border-bottom: 0; }
  .pt-row:hover { background: #f0f7ff; }
  .selected-banner {
    background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 10px;
    padding: .85rem 1rem; display: none; align-items: center; gap: .75rem;
    margin-top: .75rem;
  }
  .btn-open-pos {
    background: #0d6efd;
    border: none; color: white; border-radius: 8px;
    padding: .75rem 1.5rem; font-size: 1rem; font-weight: 600;
    width: 100%; cursor: pointer; margin-top: 1.25rem;
    display: none; transition: all .15s;
  }
  .btn-open-pos:hover { background: #0b5ed7; }
</style>

<div class="pick-card">
  <div class="pick-header">
    <div class="d-flex align-items-center gap-2">
      <i class="bi bi-cash-coin fs-3"></i>
      <div>
        <h5 class="mb-0 fw-bold">Direct Billing</h5>
        <div class="opacity-75 small">Search for a patient to open the billing workstation</div>
      </div>
    </div>
  </div>

  <div class="pick-body">
    <label class="form-label fw-semibold text-muted small text-uppercase">Patient</label>
    <div class="position-relative search-box">
      <div class="input-group border rounded-3 overflow-hidden" style="border-color:#dee2e6 !important;">
        <span class="input-group-text border-0 ps-3"><i class="bi bi-search text-muted"></i></span>
        <input type="text" id="ptSearch" class="form-control border-0"
               placeholder="Name, Patient ID or phone…" autocomplete="off">
      </div>
      <div id="ptDrop"></div>
    </div>

    <div class="selected-banner" id="selBanner">
      <div class="rounded-circle d-flex align-items-center justify-content-center flex-shrink-0"
           style="width:40px;height:40px;background:#dcfce7;font-size:1.2rem;font-weight:900;color:#16a34a;"
           id="selInitial">?</div>
      <div class="flex-grow-1">
        <div class="fw-semibold" id="selName"></div>
        <small class="text-muted" id="selId"></small>
      </div>
      <button type="button" class="btn btn-sm btn-outline-secondary" onclick="clearSel()">
        <i class="bi bi-x"></i>
      </button>
    </div>

    <button class="btn-open-pos" id="openPosBtn" onclick="openPOS()">
      <i class="bi bi-receipt me-2"></i>Open Billing Workstation
    </button>

    <div class="text-center mt-3">
      <a href="{% url 'billing:invoice_list' %}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i>Back to Invoices
      </a>
    </div>
  </div>
</div>

<script>
var _selPatientId = null;
var _timer;

var ptSearch = document.getElementById('ptSearch');
var ptDrop   = document.getElementById('ptDrop');

ptSearch.addEventListener('input', function() {
  clearTimeout(_timer);
  var q = this.value.trim();
  if (q.length < 2) { ptDrop.style.display = 'none'; return; }
  _timer = setTimeout(function() { doSearch(q); }, 280);
});

ptSearch.addEventListener('blur', function() {
  setTimeout(function() { ptDrop.style.display = 'none'; }, 200);
});

ptSearch.addEventListener('focus', function() {
  if (this.value.trim().length >= 2) doSearch(this.value.trim());
});

function doSearch(q) {
  fetch('/patients/search/?q=' + encodeURIComponent(q))
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var results = data.results || data.patients || [];
      ptDrop.innerHTML = '';
      if (!results.length) {
        ptDrop.innerHTML = '<div class="pt-row text-muted"><i class="bi bi-search me-1"></i>No patients found</div>';
      } else {
        results.forEach(function(p) {
          var d = document.createElement('div');
          d.className = 'pt-row';
          d.innerHTML = '<strong>' + (p.full_name || p.name) + '</strong>'
            + ' <span class="text-primary small ms-1">' + p.patient_id + '</span>'
            + ' <span class="text-muted small ms-1">' + (p.phone || p.phone_number || '') + '</span>';
          d.addEventListener('mousedown', function(e) { e.preventDefault(); selectPatient(p); });
          ptDrop.appendChild(d);
        });
      }
      ptDrop.style.display = 'block';
    })
    .catch(function() {
      ptDrop.innerHTML = '<div class="pt-row text-danger small"><i class="bi bi-exclamation-triangle me-1"></i>Search error</div>';
      ptDrop.style.display = 'block';
    });
}

function selectPatient(p) {
  _selPatientId = p.patient_id;
  ptSearch.value = '';
  ptDrop.style.display = 'none';

  var name = p.full_name || p.name || '';
  document.getElementById('selName').textContent = name;
  document.getElementById('selId').textContent = p.patient_id;
  document.getElementById('selInitial').textContent = name.charAt(0).toUpperCase() || '?';

  var banner = document.getElementById('selBanner');
  banner.style.display = 'flex';

  var btn = document.getElementById('openPosBtn');
  btn.style.display = 'block';
  btn.focus();
}

function clearSel() {
  _selPatientId = null;
  document.getElementById('selBanner').style.display = 'none';
  document.getElementById('openPosBtn').style.display = 'none';
  ptSearch.value = '';
  ptSearch.focus();
}

function openPOS() {
  if (!_selPatientId) return;
  window.location.href = '/billing/pos/patient/' + _selPatientId + '/';
}
</script>
{% endblock %}
