{% extends "layouts/base_authenticated.html" %}
{% block title %}New Invoice{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-9">
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-white">
        <h5 class="mb-0 fw-semibold">New Invoice</h5>
      </div>
      <div class="card-body">
        <form method="post" id="invoiceForm">
          {% csrf_token %}
          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Patient <span class="text-danger">*</span></label>
              <select name="patient_id" class="form-select" required>
                <option value="">-- Select Patient --</option>
                {% for patient in patients %}
                <option value="{{ patient.patient_id }}">{{ patient.full_name }} ({{ patient.patient_id }})</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label fw-semibold">Due Date</label>
              <input type="date" name="due_date" class="form-control">
            </div>
            <div class="col-md-3">
              <label class="form-label fw-semibold">Discount (FCFA)</label>
              <input type="number" name="discount_amount" class="form-control" min="0" step="0.01" value="0" id="discountInput" oninput="updateTotals()">
            </div>
            <div class="col-12">
              <label class="form-label fw-semibold">Discount Reason</label>
              <input type="text" name="discount_reason" class="form-control" placeholder="Optional — staff discount, waiver, etc.">
            </div>
          </div>

          <!-- Line Items -->
          <h6 class="fw-semibold mb-3">Services / Items</h6>
          <div id="lineItems">
            <div class="row g-2 mb-2 line-item">
              <div class="col-md-4">
                <input type="text" name="description" class="form-control form-control-sm" placeholder="Description" required oninput="updateTotals()">
              </div>
              <div class="col-md-3">
                <select name="category" class="form-select form-select-sm">
                  {% for code, label in categories %}
                  <option value="{{ code }}">{{ label }}</option>
                  {% endfor %}
                </select>
              </div>
              <div class="col-md-1">
                <input type="number" name="quantity" class="form-control form-control-sm text-center" value="1" min="1" oninput="updateTotals()">
              </div>
              <div class="col-md-3">
                <div class="input-group input-group-sm">
                  <span class="input-group-text">FCFA</span>
                  <input type="number" name="unit_price" class="form-control" placeholder="0.00" step="0.01" min="0" oninput="updateTotals()">
                </div>
              </div>
              <div class="col-md-1">
                <button type="button" class="btn btn-outline-danger btn-sm w-100" onclick="removeLine(this)"><i class="bi bi-trash"></i></button>
              </div>
            </div>
          </div>
          <button type="button" class="btn btn-outline-secondary btn-sm mb-4" onclick="addLine()">
            <i class="bi bi-plus me-1"></i>Add Line
          </button>

          <!-- Totals -->
          <div class="card bg-light border-0 p-3 mb-4">
            <div class="row text-end">
              <div class="col-md-9 fw-semibold">Subtotal:</div>
              <div class="col-md-3 fw-semibold" id="subtotalDisplay">0 FCFA</div>
              <div class="col-md-9 text-success">Discount:</div>
              <div class="col-md-3 text-success" id="discountDisplay">0 FCFA</div>
              <div class="col-md-9 fw-bold fs-5">Total:</div>
              <div class="col-md-3 fw-bold fs-5" id="totalDisplay">0 FCFA</div>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Notes</label>
            <textarea name="notes" class="form-control" rows="2"></textarea>
          </div>

          <div class="d-flex gap-2 justify-content-end">
            <a href="{% url 'billing:dashboard' %}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Create Invoice</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
function addLine() {
  const first = document.querySelector('.line-item');
  const clone = first.cloneNode(true);
  clone.querySelectorAll('input').forEach(i => { i.value = i.type === 'number' && i.name === 'quantity' ? 1 : (i.name === 'unit_price' ? '' : ''); });
  clone.querySelectorAll('input').forEach(i => i.addEventListener('input', updateTotals));
  document.getElementById('lineItems').appendChild(clone);
}

function removeLine(btn) {
  const items = document.querySelectorAll('.line-item');
  if (items.length > 1) { btn.closest('.line-item').remove(); updateTotals(); }
}

function updateTotals() {
  let subtotal = 0;
  document.querySelectorAll('.line-item').forEach(row => {
    const qty = parseFloat(row.querySelector('[name=quantity]').value) || 0;
    const price = parseFloat(row.querySelector('[name=unit_price]').value) || 0;
    subtotal += qty * price;
  });
  const discount = parseFloat(document.getElementById('discountInput').value) || 0;
  const total = Math.max(subtotal - discount, 0);
  document.getElementById('subtotalDisplay').textContent = subtotal.toLocaleString() + ' FCFA';
  document.getElementById('discountDisplay').textContent = '- ' + discount.toLocaleString() + ' FCFA';
  document.getElementById('totalDisplay').textContent = total.toLocaleString() + ' FCFA';
}

document.querySelectorAll('.line-item input').forEach(i => i.addEventListener('input', updateTotals));
</script>
{% endblock %}
