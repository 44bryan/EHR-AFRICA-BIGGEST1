{% extends "layouts/base_authenticated.html" %}
{% block title %}Add Maintenance Schedule — {{ asset.asset_name }}{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-5 col-md-7">
<div class="card border-0 shadow-sm">
  <div class="card-header bg-white border-bottom">
    <h5 class="mb-0 fw-bold">Add Maintenance Schedule</h5>
    <small class="text-muted">{{ asset.asset_name }}</small>
  </div>
  <div class="card-body">
    <form method="post">{% csrf_token %}
      <div class="mb-3">
        <label class="form-label fw-semibold">Frequency</label>
        <select name="frequency" class="form-select">
          {% for val, lbl in frequencies %}<option value="{{ val }}">{{ lbl }}</option>{% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Next Due Date <span class="text-danger">*</span></label>
        <input type="date" name="next_due" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Description</label>
        <textarea name="description" class="form-control" rows="2" placeholder="What maintenance is required?"></textarea>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Assigned To</label>
        <select name="assigned_to" class="form-select">
          <option value="">-- Not assigned --</option>
          {% for s in staff %}<option value="{{ s.pk }}">{{ s.get_full_name }}</option>{% endfor %}
        </select>
      </div>
      <div class="d-flex gap-2 justify-content-end">
        <a href="{% url 'billing:maintenance_schedule_list' %}" class="btn btn-outline-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary">Save Schedule</button>
      </div>
    </form>
  </div>
</div>
</div></div>
{% endblock %}
