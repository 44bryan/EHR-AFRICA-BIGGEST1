{% extends "layouts/base_authenticated.html" %}
{% block title %}New Work Order — {{ asset.asset_name }}{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6 col-md-8">
<div class="card mb-3 border-0 shadow-sm">
  <div class="card-header bg-white border-bottom">
    <h5 class="mb-0 fw-bold">New Maintenance Work Order</h5>
    <small class="text-muted">Asset: {{ asset.asset_name }}</small>
  </div>
  <div class="card-body">
    <form method="post">{% csrf_token %}
      <div class="mb-3">
        <label class="form-label fw-semibold">Maintenance Type</label>
        <select name="maintenance_type" class="form-select">
          {% for val, lbl in maintenance_types %}<option value="{{ val }}">{{ lbl }}</option>{% endfor %}
        </select>
      </div>
      {% if schedules %}
      <div class="mb-3">
        <label class="form-label fw-semibold">Linked Schedule</label>
        <select name="schedule_id" class="form-select">
          <option value="">-- Unscheduled --</option>
          {% for s in schedules %}<option value="{{ s.pk }}">{{ s.get_frequency_display }} — due {{ s.next_due|date:"d M Y" }}</option>{% endfor %}
        </select>
      </div>
      {% endif %}
      <div class="mb-3">
        <label class="form-label fw-semibold">Description <span class="text-danger">*</span></label>
        <textarea name="description" class="form-control" rows="3" required
                  placeholder="Describe work to be done..."></textarea>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Estimated Cost (FCFA)</label>
        <input type="number" name="estimated_cost" class="form-control" value="0" min="0" step="1">
      </div>
      <div class="d-flex gap-2 justify-content-end">
        <a href="{% url 'billing:maintenance_list' %}" class="btn btn-outline-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary">Create Work Order</button>
      </div>
    </form>
  </div>
</div>
</div></div>
{% endblock %}
