{% extends 'layouts/base_authenticated.html' %}
{% load humanize ehr_tags %}

{% block title %}New Bank Reconciliation{% endblock %}

{% block content %}
<div class="d-flex align-items-center mb-3">
  <h4 class="mb-0 fw-bold">
    <i class="bi bi-clipboard-check me-2"></i>New Bank Reconciliation
  </h4>
</div>

<div class="card border-0 shadow-sm">
  <div class="card-body">
    <form method="post" action="{% url 'billing:bank_reconciliation_create' %}">
      {% csrf_token %}

      <div class="row g-3">
        <div class="col-md-6">
          <label for="id_bank_account" class="form-label fw-semibold">Bank Account <span class="text-danger">*</span></label>
          <select name="bank_account" id="id_bank_account" class="form-select form-select-sm" required>
            <option value="">-- Select Bank Account --</option>
            {% for ba in bank_accounts %}
              <option value="{{ ba.pk }}">{{ ba.bank_name }} — {{ ba.account_number }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-md-3">
          <label for="id_period_start" class="form-label fw-semibold">Period Start <span class="text-danger">*</span></label>
          <input type="date" name="period_start" id="id_period_start" class="form-control form-control-sm" required>
        </div>

        <div class="col-md-3">
          <label for="id_period_end" class="form-label fw-semibold">Period End <span class="text-danger">*</span></label>
          <input type="date" name="period_end" id="id_period_end" class="form-control form-control-sm" required>
        </div>

        <div class="col-md-6">
          <label for="id_bank_statement_balance" class="form-label fw-semibold">Bank Statement Balance (XAF) <span class="text-danger">*</span></label>
          <input type="number" name="bank_statement_balance" id="id_bank_statement_balance"
                 class="form-control form-control-sm" step="1" required>
        </div>

        <div class="col-md-6">
          <label for="id_book_balance" class="form-label fw-semibold">Book Balance (XAF) <span class="text-danger">*</span></label>
          <input type="number" name="book_balance" id="id_book_balance"
                 class="form-control form-control-sm" step="1" required>
        </div>

        <div class="col-12">
          <label for="id_notes" class="form-label fw-semibold">Notes</label>
          <textarea name="notes" id="id_notes" rows="3" class="form-control form-control-sm"></textarea>
        </div>
      </div>

      <div class="mt-4 d-flex gap-2">
        <button type="submit" class="btn btn-primary btn-sm">
          <i class="bi bi-check-lg me-1"></i>Create Reconciliation
        </button>
        <a href="{% url 'billing:bank_reconciliation_list' %}" class="btn btn-outline-secondary btn-sm">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
