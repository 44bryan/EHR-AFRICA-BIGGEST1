{% extends 'layouts/base_authenticated.html' %}
{% load humanize ehr_tags %}

{% block title %}New Cash Transfer{% endblock %}

{% block page_header %}
<nav aria-label="breadcrumb">
  <ol class="breadcrumb mb-0 small">
    <li class="breadcrumb-item"><a href="{% url 'billing:dashboard' %}">Billing</a></li>
    <li class="breadcrumb-item"><a href="{% url 'billing:cash_transfer_list' %}">Cash Transfers</a></li>
    <li class="breadcrumb-item active">New Transfer</li>
  </ol>
</nav>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6 col-md-8">
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-white border-bottom">
        <h5 class="mb-0 fw-bold"><i class="bi bi-arrow-left-right me-2"></i>New Cash Transfer</h5>
      </div>
      <div class="card-body">
        <form method="post" action="{% url 'billing:cash_transfer_create' %}">
          {% csrf_token %}

          <div class="mb-3">
            <label for="id_transfer_type" class="form-label fw-semibold">Transfer Type <span class="text-danger">*</span></label>
            <select name="transfer_type" id="id_transfer_type" class="form-select" required>
              <option value="">-- Select type --</option>
              {% for value, label in transfer_types %}
              <option value="{{ value }}">{{ label }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="mb-3">
            <label for="id_from_desk" class="form-label fw-semibold">From Desk</label>
            <select name="from_desk" id="id_from_desk" class="form-select">
              <option value="">-- None (e.g. external) --</option>
              {% for desk in desks %}
              <option value="{{ desk.pk }}">{{ desk }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="mb-3">
            <label for="id_to_desk" class="form-label fw-semibold">To Desk</label>
            <select name="to_desk" id="id_to_desk" class="form-select">
              <option value="">-- None (e.g. safe / bank) --</option>
              {% for desk in desks %}
              <option value="{{ desk.pk }}">{{ desk }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="mb-3">
            <label for="id_amount" class="form-label fw-semibold">Amount (XAF) <span class="text-danger">*</span></label>
            <div class="input-group">
              <input type="number" name="amount" id="id_amount" class="form-control"
                     min="1" step="1" required placeholder="0">
              <span class="input-group-text">XAF</span>
            </div>
          </div>

          <div class="mb-3">
            <label for="id_reference" class="form-label fw-semibold">Reference</label>
            <input type="text" name="reference" id="id_reference" class="form-control"
                   placeholder="Optional reference number...">
          </div>

          <div class="mb-3">
            <label for="id_notes" class="form-label fw-semibold">Notes</label>
            <textarea name="notes" id="id_notes" class="form-control" rows="2"
                      placeholder="Additional notes..."></textarea>
          </div>

          <div class="d-flex justify-content-end gap-2">
            <a href="{% url 'billing:cash_transfer_list' %}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-send me-1"></i>Create Transfer
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
