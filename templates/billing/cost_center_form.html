{% extends 'layouts/base_authenticated.html' %}
{% block title %}{{ action }}{% endblock %}
{% block page_header %}
<div class="mb-3">
  <a href="{% url 'billing:cost_center_list' %}" class="btn btn-sm btn-outline-secondary mb-2">Back</a>
  <h4 class="fw-bold mb-0">{{ action }}</h4>
</div>
{% endblock %}
{% block content %}
<div class="card shadow-sm" style="max-width:600px">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label fw-semibold">Code <span class="text-danger">*</span></label>
        <input type="text" name="code" class="form-control" value="{{ center.code|default:'' }}" placeholder="e.g. CC-OPD" required {% if center %}readonly{% endif %}>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Name <span class="text-danger">*</span></label>
        <input type="text" name="name" class="form-control" value="{{ center.name|default:'' }}" placeholder="e.g. Outpatient Department" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Parent</label>
        <select name="parent" class="form-select">
          <option value="">— None —</option>
          {% for cc in centers %}
          <option value="{{ cc.pk }}" {% if center.parent_id == cc.pk %}selected{% endif %}>{{ cc.code }} — {{ cc.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Description</label>
        <textarea name="description" class="form-control" rows="2">{{ center.description|default:'' }}</textarea>
      </div>
      {% if center %}
      <div class="mb-3">
        <div class="form-check">
          <input type="checkbox" name="is_active" class="form-check-input" id="isActive" {% if center.is_active %}checked{% endif %}>
          <label class="form-check-label" for="isActive">Active</label>
        </div>
      </div>
      {% endif %}
      <button type="submit" class="btn btn-primary">Save</button>
      <a href="{% url 'billing:cost_center_list' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
