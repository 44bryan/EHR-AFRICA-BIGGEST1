{% extends 'layouts/base_authenticated.html' %}
{% load humanize ehr_tags %}

{% block title %}Issue Cheque{% endblock %}

{% block content %}
<div class="d-flex align-items-center mb-3">
  <h4 class="mb-0 fw-bold">
    <i class="bi bi-card-checklist me-2"></i>Issue Cheque
  </h4>
</div>

<div class="card border-0 shadow-sm">
  <div class="card-body">
    <form method="post" action="{% url 'billing:cheque_issue' %}">
      {% csrf_token %}

      <div class="row g-3">
        <div class="col-md-6">
          <label for="id_cheque_book" class="form-label fw-semibold">Cheque Book <span class="text-danger">*</span></label>
          <select name="cheque_book" id="id_cheque_book" class="form-select form-select-sm" required>
            <option value="">-- Select Cheque Book --</option>
            {% for book in books %}
              <option value="{{ book.pk }}">
                {{ book.bank_account.bank_name }} &mdash; {{ book.series_prefix|default:"" }} {{ book.start_number }}-{{ book.end_number }}
              </option>
            {% endfor %}
          </select>
        </div>

        <div class="col-md-6">
          <label for="id_payee" class="form-label fw-semibold">Payee <span class="text-danger">*</span></label>
          <input type="text" name="payee" id="id_payee" class="form-control form-control-sm" required>
        </div>

        <div class="col-md-4">
          <label for="id_amount" class="form-label fw-semibold">Amount (XAF) <span class="text-danger">*</span></label>
          <input type="number" name="amount" id="id_amount" class="form-control form-control-sm"
                 step="1" min="1" required>
        </div>

        <div class="col-md-4">
          <label for="id_issue_date" class="form-label fw-semibold">Issue Date <span class="text-danger">*</span></label>
          <input type="date" name="issue_date" id="id_issue_date" class="form-control form-control-sm"
                 value="{{ today }}" required>
        </div>

        <div class="col-md-4">
          <label for="id_reason" class="form-label fw-semibold">Reason</label>
          <input type="text" name="reason" id="id_reason" class="form-control form-control-sm"
                 placeholder="e.g. Supplier payment">
        </div>
      </div>

      <div class="mt-4 d-flex gap-2">
        <button type="submit" class="btn btn-primary btn-sm">
          <i class="bi bi-check-lg me-1"></i>Issue Cheque
        </button>
        <a href="{% url 'billing:cheque_register' %}" class="btn btn-outline-secondary btn-sm">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
