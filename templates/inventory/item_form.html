{% extends "layouts/base_authenticated.html" %}
{% block title %}{{ action }} Inventory Item{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h1 class="h3 mb-0"><i class="bi bi-box-seam me-2 text-primary"></i>{{ action }} Item</h1>
  <a href="{% url 'inventory:item_list' %}" class="btn btn-outline-secondary btn-sm">Back</a>
</div>

<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card border-0 shadow-sm">
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold">Item Name <span class="text-danger">*</span></label>
            <input type="text" name="name" class="form-control" required value="{{ item.name|default:'' }}" />
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Item Code <span class="text-danger">*</span>
              {% if action == 'Edit' %}<small class="text-muted">(read-only)</small>{% endif %}
            </label>
            <input type="text" name="item_code" class="form-control"
                   value="{{ item.item_code|default:'' }}"
                   {% if action == 'Edit' %}readonly{% else %}required{% endif %} />
          </div>
          <div class="row g-3 mb-3">
            <div class="col-sm-6">
              <label class="form-label fw-semibold">Category <span class="text-danger">*</span></label>
              <select name="category" class="form-select" required>
                {% for val, label in categories %}
                <option value="{{ val }}" {% if item.category == val %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-sm-6">
              <label class="form-label fw-semibold">Unit</label>
              <input type="text" name="unit" class="form-control" value="{{ item.unit|default:'unit' }}" placeholder="e.g. box, piece, kg" />
            </div>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-sm-4">
              <label class="form-label fw-semibold">Unit Cost (FCFA)</label>
              <input type="number" name="unit_cost" class="form-control" step="0.01" min="0"
                     value="{{ item.unit_cost|default:'0' }}" />
            </div>
            <div class="col-sm-4">
              <label class="form-label fw-semibold">Reorder Level</label>
              <input type="number" name="reorder_level" class="form-control" min="0"
                     value="{{ item.reorder_level|default:'5' }}" />
            </div>
            {% if action == 'Create' %}
            <div class="col-sm-4">
              <label class="form-label fw-semibold">Opening Stock</label>
              <input type="number" name="current_stock" class="form-control" min="0" value="0" />
            </div>
            {% endif %}
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Storage Location</label>
            <input type="text" name="location" class="form-control" value="{{ item.location|default:'' }}"
                   placeholder="e.g. Storeroom A, Shelf 3" />
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Description</label>
            <textarea name="description" class="form-control" rows="2">{{ item.description|default:'' }}</textarea>
          </div>
          <div class="d-flex justify-content-end gap-2">
            <a href="{% url 'inventory:item_list' %}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-save me-1"></i>{{ action }} Item
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
