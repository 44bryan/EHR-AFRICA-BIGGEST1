{% extends "layouts/base_authenticated.html" %}
{% block title %}{{ action }} Vendor{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h1 class="h3 mb-0"><i class="bi bi-truck me-2 text-primary"></i>{{ action }} Vendor</h1>
  <a href="{% url 'inventory:vendor_list' %}" class="btn btn-outline-secondary btn-sm">Back</a>
</div>

<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card border-0 shadow-sm">
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold">Vendor Name <span class="text-danger">*</span></label>
            <input type="text" name="name" class="form-control" required value="{{ vendor.name|default:'' }}" />
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Contact Person</label>
            <input type="text" name="contact_person" class="form-control" value="{{ vendor.contact_person|default:'' }}" />
          </div>
          <div class="row g-3 mb-3">
            <div class="col-sm-6">
              <label class="form-label fw-semibold">Phone</label>
              <input type="text" name="phone" class="form-control" value="{{ vendor.phone|default:'' }}" />
            </div>
            <div class="col-sm-6">
              <label class="form-label fw-semibold">Email</label>
              <input type="email" name="email" class="form-control" value="{{ vendor.email|default:'' }}" />
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Address</label>
            <textarea name="address" class="form-control" rows="2">{{ vendor.address|default:'' }}</textarea>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Notes</label>
            <textarea name="notes" class="form-control" rows="2"
                      placeholder="Quality history, special terms, account number…">{{ vendor.notes|default:'' }}</textarea>
          </div>
          <div class="d-flex justify-content-end gap-2">
            <a href="{% url 'inventory:vendor_list' %}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i>{{ action }} Vendor</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
