{% extends "layouts/base_authenticated.html" %}
{% block title %}Stock Adjustment - {{ item.name }}{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-5"><div class="card mb-3 border-0 shadow-sm"><div class="card-header bg-white"><h5 class="mb-0 fw-semibold">Stock Adjustment: {{ item.name }}</h5></div><div class="card-body"><p class="text-muted">Current stock: <strong>{{ item.current_stock }} {{ item.unit }}s</strong></p><form method="post">{% csrf_token %}<div class="mb-3"><label class="form-label fw-semibold">Movement Type *</label><select name="movement_type" class="form-select" required><option value="IN">Stock In</option><option value="OUT">Stock Out</option><option value="ADJUST">Adjustment</option><option value="RETURN">Return</option></select></div><div class="mb-3"><label class="form-label fw-semibold">Quantity *</label><input type="number" name="quantity" class="form-control" min="1" required></div><div class="mb-4"><label class="form-label fw-semibold">Notes</label><textarea name="notes" class="form-control" rows="2"></textarea></div><div class="d-grid"><button type="submit" class="btn btn-primary">Apply Adjustment</button></div></form></div></div><div class="text-center mt-3"><a href="{% url 'inventory:item_detail' item.id %}" class="text-muted"><i class="bi bi-arrow-left me-1"></i>Back</a></div></div></div>
{% endblock %}
