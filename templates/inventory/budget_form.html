{% extends "layouts/base_authenticated.html" %}
{% load ehr_tags %}
{% block title %}{{ action }} Budget{% endblock %}
{% block content %}
<div class="container-fluid py-3">
  <h5 class="fw-bold mb-3"><i class="bi bi-wallet2 me-2"></i>{{ action }} Store Budget</h5>

  <form method="post">
    {% csrf_token %}
    <div class="row g-3">
      <div class="col-md-5">
        <label class="form-label small fw-semibold">Budget Name</label>
        <input type="text" name="name" value="{{ budget.name|default:'' }}" class="form-control form-control-sm" required placeholder="e.g. Surgical Supplies Q3">
      </div>
      <div class="col-md-3">
        <label class="form-label small fw-semibold">Fiscal Year</label>
        <input type="number" name="fiscal_year" value="{{ budget.fiscal_year|default:current_year }}" class="form-control form-control-sm" required>
      </div>
      <div class="col-md-4">
        <label class="form-label small fw-semibold">Category (optional)</label>
        <select name="category" class="form-select form-select-sm">
          <option value="">All Categories</option>
          {% for code, label in categories %}
          <option value="{{ code }}" {% if budget.category == code %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label small fw-semibold">Allocated Amount (FCFA)</label>
        <input type="number" name="allocated" value="{{ budget.allocated|default:0 }}" class="form-control form-control-sm" step="1" min="0" required>
      </div>
      <div class="col-md-8">
        <label class="form-label small fw-semibold">Notes</label>
        <input type="text" name="notes" value="{{ budget.notes|default:'' }}" class="form-control form-control-sm" placeholder="Optional notes...">
      </div>
    </div>
    <div class="mt-3">
      <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Save Budget</button>
      <a href="{% url 'inventory:budget_list' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
