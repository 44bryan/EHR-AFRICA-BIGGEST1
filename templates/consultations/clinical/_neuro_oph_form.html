{% load ehr_tags %}
{% with d=consultation.department_specific_data %}
<!-- NEURO-OPHTHALMOLOGY — editable form -->

<div class="mb-3">
  <div class="fw-bold text-uppercase text-secondary cfm-hdr collapsed" style="font-size:.72rem;letter-spacing:.07em;"
       data-bs-toggle="collapse" data-bs-target="#cfm_neuro_s1" aria-expanded="false">
    <span><i class="bi bi-eye me-1"></i>1. Visual Acuity &amp; IOP</span>
    <i class="bi bi-chevron-up cfm-chev"></i>
  </div>
  <div class="collapse mt-2" id="cfm_neuro_s1">
    <div class="row g-2">
      <div class="col-md-2">
        <label class="form-label small">VA OD (unaided)</label>
        <select name="dept_va_od_un" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "6/6,6/9,6/12,6/18,6/24,6/36,6/60,CF (Counting Fingers),HM (Hand Motion),PL (Perception of Light),NPL (No Perception of Light)"|split:"," %}
  <option value="{{ v }}" {% if d.va_od_un == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-2">
        <label class="form-label small">VA OS (unaided)</label>
        <select name="dept_va_os_un" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "6/6,6/9,6/12,6/18,6/24,6/36,6/60,CF (Counting Fingers),HM (Hand Motion),PL (Perception of Light),NPL (No Perception of Light)"|split:"," %}
  <option value="{{ v }}" {% if d.va_os_un == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-2">
        <label class="form-label small">BCVA OD</label>
        <select name="dept_neuro_bcva_od" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "6/6,6/9,6/12,6/18,6/24,6/36,6/60,CF,HM,PL,NPL"|split:"," %}
  <option value="{{ v }}" {% if d.neuro_bcva_od == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-2">
        <label class="form-label small">BCVA OS</label>
        <select name="dept_neuro_bcva_os" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "6/6,6/9,6/12,6/18,6/24,6/36,6/60,CF,HM,PL,NPL"|split:"," %}
  <option value="{{ v }}" {% if d.neuro_bcva_os == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-2"><label class="form-label small">IOP OD (mmHg)</label><input type="number" name="dept_iop_od" class="form-control form-control-sm" step="0.5" value="{{ d.iop_od|default:'' }}"></div>
      <div class="col-md-2"><label class="form-label small">IOP OS (mmHg)</label><input type="number" name="dept_iop_os" class="form-control form-control-sm" step="0.5" value="{{ d.iop_os|default:'' }}"></div>
    </div>
  </div>
</div>

<div class="mb-3">
  <div class="fw-bold text-uppercase text-secondary cfm-hdr collapsed" style="font-size:.72rem;letter-spacing:.07em;"
       data-bs-toggle="collapse" data-bs-target="#cfm_neuro_s2" aria-expanded="false">
    <span><i class="bi bi-circle me-1"></i>2. Pupils</span>
    <i class="bi bi-chevron-up cfm-chev"></i>
  </div>
  <div class="collapse mt-2" id="cfm_neuro_s2">
    <div class="row g-2">
      <div class="col-md-2"><label class="form-label small">Pupil Size OD (mm)</label><input type="number" step="0.5" name="dept_pupil_size_od" class="form-control form-control-sm" placeholder="4" value="{{ d.pupil_size_od|default:'' }}"></div>
      <div class="col-md-2"><label class="form-label small">Pupil Size OS (mm)</label><input type="number" step="0.5" name="dept_pupil_size_os" class="form-control form-control-sm" placeholder="4" value="{{ d.pupil_size_os|default:'' }}"></div>
      <div class="col-md-2">
        <label class="form-label small">Direct Reflex OD</label>
        <select name="dept_pupil_reflex_od" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "Brisk,Sluggish,Absent"|split:"," %}
  <option value="{{ v }}" {% if d.pupil_reflex_od == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-2">
        <label class="form-label small">Direct Reflex OS</label>
        <select name="dept_pupil_reflex_os" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "Brisk,Sluggish,Absent"|split:"," %}
  <option value="{{ v }}" {% if d.pupil_reflex_os == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-4">
        <label class="form-label small">RAPD</label>
        <select name="dept_rapd" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "None,RAPD OD — Grade 1,RAPD OD — Grade 2,RAPD OD — Grade 3,RAPD OS — Grade 1,RAPD OS — Grade 2,RAPD OS — Grade 3,Bilateral (inconclusive)"|split:"," %}
  <option value="{{ v }}" {% if d.rapd == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-6"><label class="form-label small">Pupil OD (narrative)</label><input type="text" name="dept_pupil_od" value="{{ d.pupil_od|default:'' }}" class="form-control form-control-sm" placeholder="e.g. 4mm reactive, round, regular"></div>
      <div class="col-md-6"><label class="form-label small">Pupil OS (narrative)</label><input type="text" name="dept_pupil_os" value="{{ d.pupil_os|default:'' }}" class="form-control form-control-sm" placeholder="e.g. 4mm reactive, round, regular"></div>
    </div>
  </div>
</div>

<div class="mb-3">
  <div class="fw-bold text-uppercase text-secondary cfm-hdr collapsed" style="font-size:.72rem;letter-spacing:.07em;"
       data-bs-toggle="collapse" data-bs-target="#cfm_neuro_s3" aria-expanded="false">
    <span><i class="bi bi-palette me-1"></i>3. Colour Vision</span>
    <i class="bi bi-chevron-up cfm-chev"></i>
  </div>
  <div class="collapse mt-2" id="cfm_neuro_s3">
    <div class="row g-2">
      <div class="col-md-3">
        <label class="form-label small">Test Used</label>
        <select name="dept_cv_test" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "Ishihara (15 plates),Ishihara (38 plates),Hardy-Rand-Rittler (HRR),Farnsworth D15,FM 100-Hue,Not tested"|split:"," %}
  <option value="{{ v }}" {% if d.cv_test == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-3"><label class="form-label small">Colour Vision OD (score)</label><input type="text" name="dept_colour_od" class="form-control form-control-sm" placeholder="e.g. 15/15 / 10/15" value="{{ d.colour_od|default:'' }}"></div>
      <div class="col-md-3"><label class="form-label small">Colour Vision OS (score)</label><input type="text" name="dept_colour_os" class="form-control form-control-sm" placeholder="e.g. 15/15 / 10/15" value="{{ d.colour_os|default:'' }}"></div>
      <div class="col-md-3">
        <label class="form-label small">Defect Type</label>
        <select name="dept_cv_defect" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "None,Red-green (acquired),Blue-yellow (acquired),Non-specific acquired,Congenital defect,Achromatopsia"|split:"," %}
  <option value="{{ v }}" {% if d.cv_defect == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
    </div>
  </div>
</div>

<div class="mb-3">
  <div class="fw-bold text-uppercase text-secondary cfm-hdr collapsed" style="font-size:.72rem;letter-spacing:.07em;"
       data-bs-toggle="collapse" data-bs-target="#cfm_neuro_s4" aria-expanded="false">
    <span><i class="bi bi-bullseye me-1"></i>4. Visual Field</span>
    <i class="bi bi-chevron-up cfm-chev"></i>
  </div>
  <div class="collapse mt-2" id="cfm_neuro_s4">
    <div class="row g-2">
      <div class="col-md-4">
        <label class="form-label small">Confrontation VF OD</label>
        <select name="dept_conf_vf_od" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "Full,Temporal hemianopia,Nasal hemianopia,Superior hemianopia,Inferior hemianopia,Central scotoma,Cecocentral scotoma,Constricted,Not testable"|split:"," %}
  <option value="{{ v }}" {% if d.conf_vf_od == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-4">
        <label class="form-label small">Confrontation VF OS</label>
        <select name="dept_conf_vf_os" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "Full,Temporal hemianopia,Nasal hemianopia,Superior hemianopia,Inferior hemianopia,Central scotoma,Cecocentral scotoma,Constricted,Not testable"|split:"," %}
  <option value="{{ v }}" {% if d.conf_vf_os == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-4">
        <label class="form-label small">VF Defect Pattern (perimetry)</label>
        <select name="dept_vf_pattern" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "Normal,Central scotoma,Cecocentral scotoma,Altitudinal (superior),Altitudinal (inferior),Temporal hemianopia (bitemporal),Homonymous hemianopia (right),Homonymous hemianopia (left),Quadrantanopia (sup right),Quadrantanopia (sup left),Quadrantanopia (inf right),Quadrantanopia (inf left),Concentric constriction,Arcuate,Nasal step,Enlarged blind spot,Diffuse depression"|split:"," %}
  <option value="{{ v }}" {% if d.vf_pattern == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-3"><label class="form-label small">HVF MD OD (dB)</label><input type="text" name="dept_hvf_md_od" class="form-control form-control-sm" placeholder="-4.5" value="{{ d.hvf_md_od|default:'' }}"></div>
      <div class="col-md-3"><label class="form-label small">HVF MD OS (dB)</label><input type="text" name="dept_hvf_md_os" class="form-control form-control-sm" placeholder="-4.5" value="{{ d.hvf_md_os|default:'' }}"></div>
      <div class="col-md-3"><label class="form-label small">HVF PSD OD (dB)</label><input type="text" name="dept_hvf_psd_od" class="form-control form-control-sm" placeholder="2.1" value="{{ d.hvf_psd_od|default:'' }}"></div>
      <div class="col-md-3"><label class="form-label small">HVF PSD OS (dB)</label><input type="text" name="dept_hvf_psd_os" class="form-control form-control-sm" placeholder="2.1" value="{{ d.hvf_psd_os|default:'' }}"></div>
      <div class="col-md-6"><label class="form-label small">Visual Field OD (free text)</label><input type="text" name="dept_vf_od" value="{{ d.vf_od|default:'' }}" class="form-control form-control-sm" placeholder="Goldmann / HVF interpretation summary"></div>
      <div class="col-md-6"><label class="form-label small">Visual Field OS (free text)</label><input type="text" name="dept_vf_os" value="{{ d.vf_os|default:'' }}" class="form-control form-control-sm" placeholder="e.g. Bitemporal hemianopia"></div>
    </div>
  </div>
</div>

<div class="mb-3">
  <div class="fw-bold text-uppercase text-secondary cfm-hdr collapsed" style="font-size:.72rem;letter-spacing:.07em;"
       data-bs-toggle="collapse" data-bs-target="#cfm_neuro_s5" aria-expanded="false">
    <span><i class="bi bi-circle-half me-1"></i>5. Optic Nerve &amp; Disc</span>
    <i class="bi bi-chevron-up cfm-chev"></i>
  </div>
  <div class="collapse mt-2" id="cfm_neuro_s5">
    <div class="row g-2">
      <div class="col-md-3"><label class="form-label small">Disc OD</label><input type="text" name="dept_disc_neuro_od" value="{{ d.disc_neuro_od|default:'' }}" class="form-control form-control-sm" placeholder="e.g. Pale, swollen, C/D 0.7"></div>
      <div class="col-md-3"><label class="form-label small">Disc OS</label><input type="text" name="dept_disc_neuro_os" value="{{ d.disc_neuro_os|default:'' }}" class="form-control form-control-sm" placeholder="e.g. Normal, C/D 0.3"></div>
      <div class="col-md-3">
        <label class="form-label small">Disc Appearance OD</label>
        <select name="dept_disc_appearance_od" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "Normal,Pale (temporal),Pale (diffuse),Swollen/Oedematous,Hyperaemic,Drusen,Tilted,Hypoplastic,Excavated (glaucomatous)"|split:"," %}
  <option value="{{ v }}" {% if d.disc_appearance_od == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-3">
        <label class="form-label small">Disc Appearance OS</label>
        <select name="dept_disc_appearance_os" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "Normal,Pale (temporal),Pale (diffuse),Swollen/Oedematous,Hyperaemic,Drusen,Tilted,Hypoplastic,Excavated (glaucomatous)"|split:"," %}
  <option value="{{ v }}" {% if d.disc_appearance_os == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-3">
        <label class="form-label small">Papilloedema Grade OD (Frisén)</label>
        <select name="dept_papilloedema_od" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "0 (Normal),1 (C-shaped obscuration),2 (Circumferential),3 (Partial arcuate),4 (Complete arcuate),5 (Dome-shaped)"|split:"," %}
  <option value="{{ v }}" {% if d.papilloedema_od == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-3">
        <label class="form-label small">Papilloedema Grade OS (Frisén)</label>
        <select name="dept_papilloedema_os" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "0 (Normal),1 (C-shaped obscuration),2 (Circumferential),3 (Partial arcuate),4 (Complete arcuate),5 (Dome-shaped)"|split:"," %}
  <option value="{{ v }}" {% if d.papilloedema_os == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
    </div>
  </div>
</div>

<div class="mb-3">
  <div class="fw-bold text-uppercase text-secondary cfm-hdr collapsed" style="font-size:.72rem;letter-spacing:.07em;"
       data-bs-toggle="collapse" data-bs-target="#cfm_neuro_s6" aria-expanded="false">
    <span><i class="bi bi-layers me-1"></i>6. OCT RNFL &amp; Ganglion Cell</span>
    <i class="bi bi-chevron-up cfm-chev"></i>
  </div>
  <div class="collapse mt-2" id="cfm_neuro_s6">
    <div class="row g-2">
      <div class="col-md-2"><label class="form-label small">Avg RNFL OD (µm)</label><input type="number" name="dept_rnfl_avg_od" class="form-control form-control-sm" placeholder="95" value="{{ d.rnfl_avg_od|default:'' }}"></div>
      <div class="col-md-2"><label class="form-label small">Avg RNFL OS (µm)</label><input type="number" name="dept_rnfl_avg_os" class="form-control form-control-sm" placeholder="95" value="{{ d.rnfl_avg_os|default:'' }}"></div>
      <div class="col-md-2"><label class="form-label small">Inf RNFL OD (µm)</label><input type="number" name="dept_rnfl_inf_od" class="form-control form-control-sm" placeholder="110" value="{{ d.rnfl_inf_od|default:'' }}"></div>
      <div class="col-md-2"><label class="form-label small">Inf RNFL OS (µm)</label><input type="number" name="dept_rnfl_inf_os" class="form-control form-control-sm" placeholder="110" value="{{ d.rnfl_inf_os|default:'' }}"></div>
      <div class="col-md-4"><label class="form-label small">RNFL / OCT Interpretation</label><input type="text" name="dept_oct_rnfl" value="{{ d.oct_rnfl|default:'' }}" class="form-control form-control-sm" placeholder="e.g. Thinning superior quadrant OD, within normal OS"></div>
    </div>
  </div>
</div>

<div class="mb-3">
  <div class="fw-bold text-uppercase text-secondary cfm-hdr collapsed" style="font-size:.72rem;letter-spacing:.07em;"
       data-bs-toggle="collapse" data-bs-target="#cfm_neuro_s7" aria-expanded="false">
    <span><i class="bi bi-activity me-1"></i>7. VEP &amp; ERG</span>
    <i class="bi bi-chevron-up cfm-chev"></i>
  </div>
  <div class="collapse mt-2" id="cfm_neuro_s7">
    <div class="row g-2">
      <div class="col-md-3"><label class="form-label small">VEP P100 Latency OD (ms)</label><input type="number" step="0.1" name="dept_vep_p100_od" class="form-control form-control-sm" placeholder="102" value="{{ d.vep_p100_od|default:'' }}"></div>
      <div class="col-md-3"><label class="form-label small">VEP P100 Latency OS (ms)</label><input type="number" step="0.1" name="dept_vep_p100_os" class="form-control form-control-sm" placeholder="102" value="{{ d.vep_p100_os|default:'' }}"></div>
      <div class="col-md-3"><label class="form-label small">VEP Amplitude OD (µV)</label><input type="number" step="0.1" name="dept_vep_amp_od" class="form-control form-control-sm" placeholder="8.5" value="{{ d.vep_amp_od|default:'' }}"></div>
      <div class="col-md-3"><label class="form-label small">VEP Amplitude OS (µV)</label><input type="number" step="0.1" name="dept_vep_amp_os" class="form-control form-control-sm" placeholder="8.5" value="{{ d.vep_amp_os|default:'' }}"></div>
      <div class="col-md-4">
        <label class="form-label small">VEP Interpretation</label>
        <select name="dept_vep_interp" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "Normal,Delayed P100 — OD,Delayed P100 — OS,Delayed P100 — OU,Reduced amplitude — OD,Reduced amplitude — OS,Absent response — OD,Absent response — OS,Not performed"|split:"," %}
  <option value="{{ v }}" {% if d.vep_interp == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-4">
        <label class="form-label small">ERG Findings</label>
        <select name="dept_erg_findings" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "Normal,Subnormal (generalised),Electronegative (b-wave selectively reduced),Absent (extinguished),Rod-isolated reduced,Cone-isolated reduced,Not performed"|split:"," %}
  <option value="{{ v }}" {% if d.erg_findings == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-4"><label class="form-label small">VEP / ERG Notes</label><input type="text" name="dept_vep" value="{{ d.vep|default:'' }}" class="form-control form-control-sm" placeholder="Additional interpretation..."></div>
    </div>
  </div>
</div>

<div class="mb-3">
  <div class="fw-bold text-uppercase text-secondary cfm-hdr collapsed" style="font-size:.72rem;letter-spacing:.07em;"
       data-bs-toggle="collapse" data-bs-target="#cfm_neuro_s8" aria-expanded="false">
    <span><i class="bi bi-diagram-3 me-1"></i>8. Cranial Nerve Assessment</span>
    <i class="bi bi-chevron-up cfm-chev"></i>
  </div>
  <div class="collapse mt-2" id="cfm_neuro_s8">
    <div class="row g-2">
      <div class="col-md-3">
        <label class="form-label small">CN II (Optic)</label>
        <select name="dept_cn2" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "Normal,Afferent pupil defect,Optic atrophy,Optic disc swelling,Reduced acuity,Visual field defect"|split:"," %}
  <option value="{{ v }}" {% if d.cn2 == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-3">
        <label class="form-label small">CN III (Oculomotor)</label>
        <select name="dept_cn3" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "Normal,Complete palsy (pupil-involved),Complete palsy (pupil-sparing),Partial palsy,Aberrant regeneration"|split:"," %}
  <option value="{{ v }}" {% if d.cn3 == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-3">
        <label class="form-label small">CN IV (Trochlear)</label>
        <select name="dept_cn4" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "Normal,Superior oblique palsy — OD,Superior oblique palsy — OS,Bilateral"|split:"," %}
  <option value="{{ v }}" {% if d.cn4 == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-3">
        <label class="form-label small">CN VI (Abducens)</label>
        <select name="dept_cn6" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "Normal,Lateral rectus palsy — OD,Lateral rectus palsy — OS,Bilateral,Partial palsy"|split:"," %}
  <option value="{{ v }}" {% if d.cn6 == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-4">
        <label class="form-label small">CN V (Trigeminal)</label>
        <select name="dept_cn5" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "Normal,V1 sensory loss,V2 sensory loss,V3 sensory loss,Corneal reflex absent — OD,Corneal reflex absent — OS,Jaw deviation"|split:"," %}
  <option value="{{ v }}" {% if d.cn5 == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-4">
        <label class="form-label small">CN VII (Facial)</label>
        <select name="dept_cn7" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "Normal,UMN facial palsy — right,UMN facial palsy — left,LMN facial palsy — right (Bell's palsy),LMN facial palsy — left (Bell's palsy),Partial weakness"|split:"," %}
  <option value="{{ v }}" {% if d.cn7 == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-4"><label class="form-label small">Other CNs / Cerebellar / Long Tracts</label><input type="text" name="dept_other_cn" class="form-control form-control-sm" placeholder="e.g. Normal / Upgoing plantar OD / Ataxia" value="{{ d.other_cn|default:'' }}"></div>
    </div>
  </div>
</div>

<div class="mb-3">
  <div class="fw-bold text-uppercase text-secondary cfm-hdr collapsed" style="font-size:.72rem;letter-spacing:.07em;"
       data-bs-toggle="collapse" data-bs-target="#cfm_neuro_s9" aria-expanded="false">
    <span><i class="bi bi-arrows-move me-1"></i>9. Motility &amp; Diplopia</span>
    <i class="bi bi-chevron-up cfm-chev"></i>
  </div>
  <div class="collapse mt-2" id="cfm_neuro_s9">
    <div class="row g-2">
      <div class="col-md-4"><label class="form-label small">Ocular Motility</label><input type="text" name="dept_motility" value="{{ d.motility|default:'' }}" class="form-control form-control-sm" placeholder="e.g. Full OU / Restricted elevation OD"></div>
      <div class="col-md-4">
        <label class="form-label small">Nystagmus</label>
        <select name="dept_nystagmus" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "None,Horizontal — jerk,Horizontal — pendular,Vertical (upbeat),Vertical (downbeat),Rotatory,Gaze-evoked,Congenital,See-saw,Periodic alternating"|split:"," %}
  <option value="{{ v }}" {% if d.nystagmus == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-4">
        <label class="form-label small">Diplopia</label>
        <select name="dept_diplopia" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "None,Binocular — horizontal,Binocular — vertical,Binocular — oblique,Monocular OD,Monocular OS,Intermittent,Constant"|split:"," %}
  <option value="{{ v }}" {% if d.diplopia == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
    </div>
  </div>
</div>

<div class="mb-3">
  <div class="fw-bold text-uppercase text-secondary cfm-hdr collapsed" style="font-size:.72rem;letter-spacing:.07em;"
       data-bs-toggle="collapse" data-bs-target="#cfm_neuro_s10" aria-expanded="false">
    <span><i class="bi bi-scan me-1"></i>10. Neuroimaging &amp; Investigations</span>
    <i class="bi bi-chevron-up cfm-chev"></i>
  </div>
  <div class="collapse mt-2" id="cfm_neuro_s10">
    <div class="row g-2">
      <div class="col-md-4">
        <label class="form-label small">MRI / CT Ordered</label>
        <select name="dept_imaging_ordered" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "None,MRI Brain,MRI Brain + Orbits with contrast,MRI Brain + Spine,CT Brain,CT Brain (non-contrast),CT Orbits,MRI Pituitary protocol,CT/MRI Angiography,LP (Lumbar Puncture)"|split:"," %}
  <option value="{{ v }}" {% if d.imaging_ordered == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-4"><label class="form-label small">Imaging Result Summary</label><input type="text" name="dept_imaging_result" class="form-control form-control-sm" placeholder="e.g. Demyelinating plaque periventricular..." value="{{ d.imaging_result|default:'' }}"></div>
      <div class="col-md-4">
        <label class="form-label small">Neurology Referral</label>
        <select name="dept_neuro_referral" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "Not required,Referred — urgent,Referred — routine,Already under neurology,Referred to neurosurgery"|split:"," %}
  <option value="{{ v }}" {% if d.neuro_referral == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-6">
        <label class="form-label small">Neuro-Ophthalmic Diagnosis</label>
        <select name="dept_neuro_diagnosis" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "Optic Neuritis,NAION,AION (Arteritic — GCA),Papilloedema (raised ICP),Pseudotumour Cerebri / IIH,LHON,Toxic / Nutritional Optic Neuropathy,Compressive Optic Neuropathy,CN III Palsy (pupil-involved),CN III Palsy (pupil-sparing),CN IV Palsy,CN VI Palsy,Internuclear Ophthalmoplegia (INO),Horner Syndrome,Nystagmus (central),Homonymous Hemianopia,Chiasmal syndrome,Posterior cortical atrophy,Other — see impression"|split:"," %}
  <option value="{{ v }}" {% if d.neuro_diagnosis == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-12"><label class="form-label fw-semibold small">Neurological Findings / Impression &amp; Plan</label>
        <textarea name="dept_neuro_impression" rows="3" class="form-control form-control-sm" placeholder="e.g. R/O Optic neuritis OD — demyelinating lesion on MRI. Started IV methylprednisolone. Neurology referral. Next review 4 weeks.">{{ d.neuro_impression|default:'' }}</textarea>
      </div>
    </div>
  </div>
</div>

{% endwith %}
