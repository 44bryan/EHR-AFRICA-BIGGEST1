{% load ehr_tags %}
{% with d=consultation.department_specific_data %}
<!-- OCULOPLASTICS & ORBIT — editable form -->

<div class="mb-0 pt-3 border-top">
  <div class="fw-bold text-uppercase text-dark cfm-hdr collapsed" style="font-size:.85rem;letter-spacing:.04em;"
       data-bs-toggle="collapse" data-bs-target="#cfm_ocp_s1" aria-expanded="false">
    <span><i class="bi bi-eye me-1"></i>1. Eyelid Assessment</span>
    <i class="bi bi-chevron-up cfm-chev"></i>
  </div>
  <div class="collapse mt-2" id="cfm_ocp_s1">
    <div class="row g-2">
      <div class="col-md-2"><label class="form-label fw-semibold small">MRD1 OD (mm)</label><input type="number" step="0.1" name="dept_mrd1_od" value="{{ d.mrd1_od|default:'' }}" class="form-control form-control-sm" placeholder="4"></div>
      <div class="col-md-2"><label class="form-label fw-semibold small">MRD1 OS (mm)</label><input type="number" step="0.1" name="dept_mrd1_os" value="{{ d.mrd1_os|default:'' }}" class="form-control form-control-sm" placeholder="4"></div>
      <div class="col-md-2"><label class="form-label fw-semibold small">MRD2 OD (mm)</label><input type="number" step="0.1" name="dept_mrd2_od" value="{{ d.mrd2_od|default:'' }}" class="form-control form-control-sm" placeholder="5"></div>
      <div class="col-md-2"><label class="form-label fw-semibold small">MRD2 OS (mm)</label><input type="number" step="0.1" name="dept_mrd2_os" value="{{ d.mrd2_os|default:'' }}" class="form-control form-control-sm" placeholder="5"></div>
      <div class="col-md-2"><label class="form-label fw-semibold small">Lagophthalmos OD (mm)</label><input type="number" step="0.1" name="dept_lagoph_od" value="{{ d.lagoph_od|default:'' }}" class="form-control form-control-sm" placeholder="0"></div>
      <div class="col-md-2"><label class="form-label fw-semibold small">Lagophthalmos OS (mm)</label><input type="number" step="0.1" name="dept_lagoph_os" value="{{ d.lagoph_os|default:'' }}" class="form-control form-control-sm" placeholder="0"></div>
      <div class="col-md-3">
        <label class="form-label fw-semibold small">Ptosis Type OD</label>
        <select name="dept_ptosis_type_od" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "None,Aponeurotic,Congenital,Myogenic,Neurogenic (CN III),Horner Syndrome,Mechanical,Pseudoptosis"|split:"," %}
  <option value="{{ v }}" {% if d.ptosis_type_od == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-3">
        <label class="form-label fw-semibold small">Ptosis Type OS</label>
        <select name="dept_ptosis_type_os" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "None,Aponeurotic,Congenital,Myogenic,Neurogenic (CN III),Horner Syndrome,Mechanical,Pseudoptosis"|split:"," %}
  <option value="{{ v }}" {% if d.ptosis_type_os == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-3">
        <label class="form-label fw-semibold small">Levator Function OD (mm)</label>
        <input type="number" step="0.5" name="dept_levator_od" value="{{ d.levator_od|default:'' }}" class="form-control form-control-sm" placeholder="12">
      </div>
      <div class="col-md-3">
        <label class="form-label fw-semibold small">Levator Function OS (mm)</label>
        <input type="number" step="0.5" name="dept_levator_os" value="{{ d.levator_os|default:'' }}" class="form-control form-control-sm" placeholder="12">
      </div>
      <div class="col-md-4">
        <label class="form-label fw-semibold small">Palpebral Fissure OD (mm)</label>
        <input type="number" step="0.1" name="dept_fissure_od" value="{{ d.fissure_od|default:'' }}" class="form-control form-control-sm" placeholder="e.g. 9">
      </div>
      <div class="col-md-4">
        <label class="form-label fw-semibold small">Palpebral Fissure OS (mm)</label>
        <input type="number" step="0.1" name="dept_fissure_os" value="{{ d.fissure_os|default:'' }}" class="form-control form-control-sm" placeholder="e.g. 9">
      </div>
      <div class="col-md-4">
        <label class="form-label fw-semibold small">Bell's Phenomenon</label>
        <select name="dept_bells" class="form-select form-select-sm">
          <option value="">— Select —</option>
          <option value="Positive OD & OS" {% if d.bells == 'Positive OD & OS' %}selected{% endif %}>Positive OD & OS</option>
          <option value="Positive OD only" {% if d.bells == 'Positive OD only' %}selected{% endif %}>Positive OD only</option>
          <option value="Positive OS only" {% if d.bells == 'Positive OS only' %}selected{% endif %}>Positive OS only</option>
          <option value="Negative" {% if d.bells == 'Negative' %}selected{% endif %}>Negative</option>
          <option value="Not tested" {% if d.bells == 'Not tested' %}selected{% endif %}>Not tested</option>
        </select>
      </div>
      <div class="col-12">
        <label class="form-label fw-semibold small">Lid Condition (Entropion / Ectropion / Ptosis / Lesion)</label>
        <textarea name="dept_lid_condition" rows="2" class="form-control form-control-sm" placeholder="Describe findings for each eye">{{ d.lid_condition|default:'' }}</textarea>
      </div>
    </div>
  </div>
</div>

<div class="mb-0 pt-3 border-top">
  <div class="fw-bold text-uppercase text-dark cfm-hdr collapsed" style="font-size:.85rem;letter-spacing:.04em;"
       data-bs-toggle="collapse" data-bs-target="#cfm_ocp_s2" aria-expanded="false">
    <span><i class="bi bi-droplet me-1"></i>2. Lacrimal System</span>
    <i class="bi bi-chevron-up cfm-chev"></i>
  </div>
  <div class="collapse mt-2" id="cfm_ocp_s2">
    <div class="row g-2">
      <div class="col-md-6">
        <label class="form-label fw-semibold small">ROPLAS / Syringing</label>
        <select name="dept_lacrimal" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "Patent bilaterally,Patent OD only,Patent OS only,Blocked OD,Blocked OS,Blocked OU,Partially patent OD,Partially patent OS,Mucocoele OD,Mucocoele OS,Not performed"|split:"," %}
  <option value="{{ v }}" {% if d.lacrimal == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold small">DCR / Tube Status</label>
        <select name="dept_dcr_status" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "None / No previous surgery,Post-DCR OD — patent,Post-DCR OS — patent,Post-DCR OD — failed,Post-DCR OS — failed,Tube in situ OD,Tube in situ OS,Tube removed OD,Tube removed OS,Jones tube in situ"|split:"," %}
  <option value="{{ v }}" {% if d.dcr_status == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
    </div>
  </div>
</div>

<div class="mb-0 pt-3 border-top">
  <div class="fw-bold text-uppercase text-dark cfm-hdr collapsed" style="font-size:.85rem;letter-spacing:.04em;"
       data-bs-toggle="collapse" data-bs-target="#cfm_ocp_s3" aria-expanded="false">
    <span><i class="bi bi-circle me-1"></i>3. Orbit &amp; Proptosis</span>
    <i class="bi bi-chevron-up cfm-chev"></i>
  </div>
  <div class="collapse mt-2" id="cfm_ocp_s3">
    <div class="row g-2">
      <div class="col-md-4">
        <label class="form-label fw-semibold small">Hertel Exophthalmometry OD (mm)</label>
        <input type="number" step="0.1" name="dept_hertel_od" value="{{ d.hertel_od|default:'' }}" class="form-control form-control-sm" placeholder="e.g. 18">
      </div>
      <div class="col-md-4">
        <label class="form-label fw-semibold small">Hertel Exophthalmometry OS (mm)</label>
        <input type="number" step="0.1" name="dept_hertel_os" value="{{ d.hertel_os|default:'' }}" class="form-control form-control-sm" placeholder="e.g. 18">
      </div>
      <div class="col-md-4">
        <label class="form-label fw-semibold small">Orbital Findings</label>
        <select name="dept_orbital" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "No proptosis — normal,Proptosis OD,Proptosis OS,Bilateral proptosis,Enophthalmos OD,Enophthalmos OS,Palpable mass OD,Palpable mass OS,Bruit present,No bruit,Restricted motility"|split:"," %}
  <option value="{{ v }}" {% if d.orbital == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
    </div>
  </div>
</div>

<div class="mb-0 pt-3 border-top">
  <div class="fw-bold text-uppercase text-dark cfm-hdr collapsed" style="font-size:.85rem;letter-spacing:.04em;"
       data-bs-toggle="collapse" data-bs-target="#cfm_ocp_s4" aria-expanded="false">
    <span><i class="bi bi-activity me-1"></i>4. Thyroid Eye Disease (TED)</span>
    <i class="bi bi-chevron-up cfm-chev"></i>
  </div>
  <div class="collapse mt-2" id="cfm_ocp_s4">
    <div class="row g-2">
      <div class="col-md-3">
        <label class="form-label small">Clinical Activity Score (CAS /7)</label>
        <select name="dept_cas_score" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "0,1,2,3,4,5,6,7"|split:"," %}
  <option value="{{ v }}" {% if d.cas_score == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-3">
        <label class="form-label small">NOSPECS Classification</label>
        <input type="text" name="dept_nospecs" class="form-control form-control-sm" placeholder="e.g. Class 3b" value="{{ d.nospecs|default:'' }}">
      </div>
      <div class="col-md-3">
        <label class="form-label small">TED Phase</label>
        <select name="dept_ted_phase" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "Active (inflammatory),Inactive (stable),Post-treatment,Not applicable"|split:"," %}
  <option value="{{ v }}" {% if d.ted_phase == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-3">
        <label class="form-label small">Corneal Exposure Risk</label>
        <select name="dept_exposure_risk" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "Low,Moderate,High — lubrication needed,High — surgery indicated"|split:"," %}
  <option value="{{ v }}" {% if d.exposure_risk == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
    </div>
  </div>
</div>

<div class="mb-0 pt-3 border-top">
  <div class="fw-bold text-uppercase text-dark cfm-hdr collapsed" style="font-size:.85rem;letter-spacing:.04em;"
       data-bs-toggle="collapse" data-bs-target="#cfm_ocp_s5" aria-expanded="false">
    <span><i class="bi bi-scissors me-1"></i>5. Surgery &amp; Post-op Assessment</span>
    <i class="bi bi-chevron-up cfm-chev"></i>
  </div>
  <div class="collapse mt-2" id="cfm_ocp_s5">
    <div class="row g-2">
      <div class="col-12">
        <label class="form-label fw-semibold small">Surgical Plan</label>
        <select name="dept_surgical_plan" class="form-select form-select-sm">
          <option value="">— Select surgical plan —</option>
          {% for v in "Ptosis correction — levator advancement OD,Ptosis correction — levator advancement OS,Ptosis correction — Fasanella-Servat OD,Ptosis correction — Fasanella-Servat OS,Ectropion repair — medial canthoplasty,Entropion repair — everting sutures,DCR (dacryocystorhinostomy) OD,DCR (dacryocystorhinostomy) OS,Nasolacrimal duct probing,Eyelid lesion excision biopsy,Lid reconstruction after excision,Orbital decompression,No surgery — conservative management,Review post-op"|split:"," %}
          <option value="{{ v }}" {% if d.surgical_plan == v %}selected{% endif %}>{{ v }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-3"><label class="form-label small">Surgery Date</label><input type="date" name="dept_op_date" class="form-control form-control-sm" value="{{ d.op_date|default:'' }}"></div>
      <div class="col-md-5"><label class="form-label small">Post-op Assessment</label><input type="text" name="dept_postop_assess" class="form-control form-control-sm" placeholder="e.g. MRD1 now 4mm OD, symmetrical, lid crease good" value="{{ d.postop_assess|default:'' }}"></div>
      <div class="col-md-4"><label class="form-label small">Post-op Complications</label><input type="text" name="dept_postop_complications" class="form-control form-control-sm" placeholder="e.g. None / Under-correction / Lagophthalmos" value="{{ d.postop_complications|default:'' }}"></div>
    </div>
  </div>
</div>

{% endwith %}
