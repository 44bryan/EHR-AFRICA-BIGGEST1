{% load ehr_tags %}
{% with d=consultation.department_specific_data %}
<!-- CATARACT & SURGICAL — editable form -->
<div class="row g-3">
  <div class="col-12">
    <h6 class="fw-bold text-uppercase text-muted small border-bottom pb-1">Pre-operative Visual Acuity &amp; IOP</h6>
  </div>
  <div class="col-md-2"><label class="form-label small">VA OD (unaided)</label><input type="text" name="dept_preop_va_od" class="form-control form-control-sm" placeholder="CF" value="{{ d.preop_va_od|default:'' }}"></div>
  <div class="col-md-2"><label class="form-label small">VA OS (unaided)</label><input type="text" name="dept_preop_va_os" class="form-control form-control-sm" placeholder="6/60" value="{{ d.preop_va_os|default:'' }}"></div>
  <div class="col-md-2"><label class="form-label small">BCVA OD</label><input type="text" name="dept_preop_bcva_od" class="form-control form-control-sm" placeholder="6/36" value="{{ d.preop_bcva_od|default:'' }}"></div>
  <div class="col-md-2"><label class="form-label small">BCVA OS</label><input type="text" name="dept_preop_bcva_os" class="form-control form-control-sm" placeholder="6/36" value="{{ d.preop_bcva_os|default:'' }}"></div>
  <div class="col-md-2"><label class="form-label small">IOP OD (mmHg)</label><input type="number" name="dept_preop_iop_od" class="form-control form-control-sm" value="{{ d.preop_iop_od|default:'' }}"></div>
  <div class="col-md-2"><label class="form-label small">IOP OS (mmHg)</label><input type="number" name="dept_preop_iop_os" class="form-control form-control-sm" value="{{ d.preop_iop_os|default:'' }}"></div>

  <div class="col-12 mt-1">
    <h6 class="fw-bold text-uppercase text-muted small border-bottom pb-1">Lens Assessment</h6>
  </div>
  <div class="col-md-3">
    <label class="form-label fw-semibold small">Lens OD</label>
    <select name="dept_lens_od" class="form-select form-select-sm">
      <option value="">— Select —</option>
      <option value="Clear" {% if d.lens_od == 'Clear' %}selected{% endif %}>Clear</option>
      <option value="Nuclear sclerosis" {% if d.lens_od == 'Nuclear sclerosis' %}selected{% endif %}>Nuclear sclerosis</option>
      <option value="Posterior subcapsular" {% if d.lens_od == 'Posterior subcapsular' %}selected{% endif %}>Posterior subcapsular</option>
      <option value="Cortical" {% if d.lens_od == 'Cortical' %}selected{% endif %}>Cortical</option>
      <option value="Mixed" {% if d.lens_od == 'Mixed' %}selected{% endif %}>Mixed</option>
      <option value="Mature/White" {% if d.lens_od == 'Mature/White' %}selected{% endif %}>Mature/White</option>
      <option value="Pseudophakic" {% if d.lens_od == 'Pseudophakic' %}selected{% endif %}>Pseudophakic</option>
      <option value="Aphakic" {% if d.lens_od == 'Aphakic' %}selected{% endif %}>Aphakic</option>
    </select>
  </div>
  <div class="col-md-3">
    <label class="form-label fw-semibold small">Lens OS</label>
    <select name="dept_lens_os" class="form-select form-select-sm">
      <option value="">— Select —</option>
      <option value="Clear" {% if d.lens_os == 'Clear' %}selected{% endif %}>Clear</option>
      <option value="Nuclear sclerosis" {% if d.lens_os == 'Nuclear sclerosis' %}selected{% endif %}>Nuclear sclerosis</option>
      <option value="Posterior subcapsular" {% if d.lens_os == 'Posterior subcapsular' %}selected{% endif %}>Posterior subcapsular</option>
      <option value="Cortical" {% if d.lens_os == 'Cortical' %}selected{% endif %}>Cortical</option>
      <option value="Mixed" {% if d.lens_os == 'Mixed' %}selected{% endif %}>Mixed</option>
      <option value="Mature/White" {% if d.lens_os == 'Mature/White' %}selected{% endif %}>Mature/White</option>
      <option value="Pseudophakic" {% if d.lens_os == 'Pseudophakic' %}selected{% endif %}>Pseudophakic</option>
      <option value="Aphakic" {% if d.lens_os == 'Aphakic' %}selected{% endif %}>Aphakic</option>
    </select>
  </div>
  <div class="col-md-3">
    <label class="form-label fw-semibold small">Cataract Grade OD (LOCS III)</label>
    <select name="dept_locs_od" class="form-select form-select-sm">
      <option value="">— Grade —</option>
      <option value="1" {% if d.locs_od == '1' %}selected{% endif %}>Grade 1</option>
      <option value="2" {% if d.locs_od == '2' %}selected{% endif %}>Grade 2</option>
      <option value="3" {% if d.locs_od == '3' %}selected{% endif %}>Grade 3</option>
      <option value="4" {% if d.locs_od == '4' %}selected{% endif %}>Grade 4</option>
      <option value="5" {% if d.locs_od == '5' %}selected{% endif %}>Grade 5</option>
      <option value="6" {% if d.locs_od == '6' %}selected{% endif %}>Grade 6 (Mature)</option>
    </select>
  </div>
  <div class="col-md-3">
    <label class="form-label fw-semibold small">Cataract Grade OS (LOCS III)</label>
    <select name="dept_locs_os" class="form-select form-select-sm">
      <option value="">— Grade —</option>
      <option value="1" {% if d.locs_os == '1' %}selected{% endif %}>Grade 1</option>
      <option value="2" {% if d.locs_os == '2' %}selected{% endif %}>Grade 2</option>
      <option value="3" {% if d.locs_os == '3' %}selected{% endif %}>Grade 3</option>
      <option value="4" {% if d.locs_os == '4' %}selected{% endif %}>Grade 4</option>
      <option value="5" {% if d.locs_os == '5' %}selected{% endif %}>Grade 5</option>
      <option value="6" {% if d.locs_os == '6' %}selected{% endif %}>Grade 6 (Mature)</option>
    </select>
  </div>

  <div class="col-12 mt-2">
    <h6 class="fw-bold text-uppercase text-muted small border-bottom pb-1">Biometry & IOL Calculation</h6>
  </div>
  <div class="col-md-3">
    <label class="form-label fw-semibold small">Axial Length OD (mm)</label>
    <input type="number" step="0.01" name="dept_al_od" value="{{ d.al_od|default:'' }}" class="form-control form-control-sm" placeholder="e.g. 23.45">
  </div>
  <div class="col-md-3">
    <label class="form-label fw-semibold small">Axial Length OS (mm)</label>
    <input type="number" step="0.01" name="dept_al_os" value="{{ d.al_os|default:'' }}" class="form-control form-control-sm" placeholder="e.g. 23.45">
  </div>
  <div class="col-md-3">
    <label class="form-label fw-semibold small">K1/K2 OD</label>
    <input type="text" name="dept_biom_k_od" value="{{ d.biom_k_od|default:'' }}" class="form-control form-control-sm" placeholder="e.g. 43.5 / 44.25">
  </div>
  <div class="col-md-3">
    <label class="form-label fw-semibold small">K1/K2 OS</label>
    <input type="text" name="dept_biom_k_os" value="{{ d.biom_k_os|default:'' }}" class="form-control form-control-sm" placeholder="e.g. 43.5 / 44.25">
  </div>
  <div class="col-md-4">
    <label class="form-label fw-semibold small">Target Refraction</label>
    <input type="text" name="dept_target_rx" value="{{ d.target_rx|default:'' }}" class="form-control form-control-sm" placeholder="e.g. Plano / -0.50">
  </div>
  <div class="col-md-4">
    <label class="form-label fw-semibold small">IOL Power OD (D)</label>
    <input type="number" step="0.5" name="dept_iol_power_od" value="{{ d.iol_power_od|default:'' }}" class="form-control form-control-sm" placeholder="e.g. 21.5">
  </div>
  <div class="col-md-4">
    <label class="form-label fw-semibold small">IOL Power OS (D)</label>
    <input type="number" step="0.5" name="dept_iol_power_os" value="{{ d.iol_power_os|default:'' }}" class="form-control form-control-sm" placeholder="e.g. 21.5">
  </div>
  <div class="col-md-4">
    <label class="form-label fw-semibold small">IOL Type / Model</label>
    <input type="text" name="dept_iol_model" value="{{ d.iol_model|default:'' }}" class="form-control form-control-sm" placeholder="e.g. Alcon SN60WF, Monofocal">
  </div>
  <div class="col-md-2">
    <label class="form-label fw-semibold small">Biometry Formula</label>
    <select name="dept_biom_formula" class="form-select form-select-sm">
      <option value="">—</option>
      {% for f in "SRK/T,Haigis,Holladay 1,Holladay 2,Barrett Universal II,Kane,Olsen"|split:"," %}
      <option value="{{ f }}" {% if d.biom_formula == f %}selected{% endif %}>{{ f }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-3"><label class="form-label small">ECD OD (cells/mm²)</label><input type="number" name="dept_ecd_od" class="form-control form-control-sm" placeholder="2500" value="{{ d.ecd_od|default:'' }}"></div>
  <div class="col-md-3"><label class="form-label small">ECD OS (cells/mm²)</label><input type="number" name="dept_ecd_os" class="form-control form-control-sm" placeholder="2500" value="{{ d.ecd_os|default:'' }}"></div>

  <div class="col-12 mt-2">
    <h6 class="fw-bold text-uppercase text-muted small border-bottom pb-1">Surgical Record</h6>
  </div>
  <div class="col-md-4">
    <label class="form-label fw-semibold small">Surgery Date</label>
    <input type="date" name="dept_surgery_date" value="{{ d.surgery_date|default:'' }}" class="form-control form-control-sm">
  </div>
  <div class="col-md-4">
    <label class="form-label fw-semibold small">Surgeon</label>
    <input type="text" name="dept_surgeon" value="{{ d.surgeon|default:'' }}" class="form-control form-control-sm" placeholder="Surgeon name">
  </div>
  <div class="col-md-4">
    <label class="form-label fw-semibold small">Anaesthesia</label>
    <select name="dept_anaesthesia" class="form-select form-select-sm">
      <option value="">— Select —</option>
      <option value="Topical" {% if d.anaesthesia == 'Topical' %}selected{% endif %}>Topical</option>
      <option value="Peribulbar" {% if d.anaesthesia == 'Peribulbar' %}selected{% endif %}>Peribulbar</option>
      <option value="Retrobulbar" {% if d.anaesthesia == 'Retrobulbar' %}selected{% endif %}>Retrobulbar</option>
      <option value="General" {% if d.anaesthesia == 'General' %}selected{% endif %}>General</option>
      <option value="Sub-Tenon" {% if d.anaesthesia == 'Sub-Tenon' %}selected{% endif %}>Sub-Tenon</option>
    </select>
  </div>
  <div class="col-12">
    <label class="form-label fw-semibold small">Operative Notes</label>
    <textarea name="dept_op_notes" rows="3" class="form-control form-control-sm" placeholder="e.g. Phaco + IOL implantation, no complications, CCC performed, hydrodissection done...">{{ d.op_notes|default:'' }}</textarea>
  </div>
  <div class="col-12">
    <label class="form-label fw-semibold small">Post-op Status / Examination</label>
    <textarea name="dept_postop" rows="2" class="form-control form-control-sm" placeholder="e.g. Day 1 post-op: VA 6/12, cornea clear, IOL in situ, mild AC reaction">{{ d.postop|default:'' }}</textarea>
  </div>

  <div class="col-12 mt-2">
    <h6 class="fw-bold text-uppercase text-muted small border-bottom pb-1">Post-operative VA Tracking</h6>
  </div>
  <div class="col-md-2"><label class="form-label small">UCVA OD</label><input type="text" name="dept_postop_ucva_od" class="form-control form-control-sm" placeholder="6/12" value="{{ d.postop_ucva_od|default:'' }}"></div>
  <div class="col-md-2"><label class="form-label small">UCVA OS</label><input type="text" name="dept_postop_ucva_os" class="form-control form-control-sm" placeholder="6/12" value="{{ d.postop_ucva_os|default:'' }}"></div>
  <div class="col-md-2"><label class="form-label small">BCVA OD</label><input type="text" name="dept_postop_bcva_od" class="form-control form-control-sm" placeholder="6/6" value="{{ d.postop_bcva_od|default:'' }}"></div>
  <div class="col-md-2"><label class="form-label small">BCVA OS</label><input type="text" name="dept_postop_bcva_os" class="form-control form-control-sm" placeholder="6/6" value="{{ d.postop_bcva_os|default:'' }}"></div>
  <div class="col-md-2"><label class="form-label small">IOP OD (mmHg)</label><input type="number" name="dept_postop_iop_od" class="form-control form-control-sm" value="{{ d.postop_iop_od|default:'' }}"></div>
  <div class="col-md-2"><label class="form-label small">IOP OS (mmHg)</label><input type="number" name="dept_postop_iop_os" class="form-control form-control-sm" value="{{ d.postop_iop_os|default:'' }}"></div>
  <div class="col-md-3"><label class="form-label small">Post-op Day / Week</label>
    <select name="dept_postop_timepoint" class="form-select form-select-sm">
      <option value="">—</option>
      {% for t in "Day 1,Day 3,Week 1,Week 2,Week 4 (1 month),3 months,6 months,12 months"|split:"," %}
      <option value="{{ t }}" {% if d.postop_timepoint == t %}selected{% endif %}>{{ t }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-3">
    <label class="form-label small">IOL Position</label>
    <select name="dept_iol_position" class="form-select form-select-sm">
      <option value="">—</option>
      {% for p in "In bag — central,In bag — decentred,Sulcus,Anterior chamber,Subluxated,Not applicable"|split:"," %}
      <option value="{{ p }}" {% if d.iol_position == p %}selected{% endif %}>{{ p }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-3">
    <label class="form-label small">PCO Status</label>
    <select name="dept_pco" class="form-select form-select-sm">
      <option value="">—</option>
      {% for p in "None,Mild,Moderate,Dense — YAG needed,Post YAG"|split:"," %}
      <option value="{{ p }}" {% if d.pco == p %}selected{% endif %}>{{ p }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-3">
    <label class="form-label small">Intra-op Complications</label>
    <input type="text" name="dept_intraop_complications" class="form-control form-control-sm" placeholder="e.g. PCR, vitreous loss, none" value="{{ d.intraop_complications|default:'' }}">
  </div>
</div>
{% endwith %}
