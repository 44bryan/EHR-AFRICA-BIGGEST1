{% load ehr_tags %}
{% with d=consultation.department_specific_data %}
<!-- CATARACT & SURGICAL — editable form -->

<div class="mb-3">
  <div class="fw-bold text-uppercase text-secondary cfm-hdr collapsed" style="font-size:.72rem;letter-spacing:.07em;"
       data-bs-toggle="collapse" data-bs-target="#cfm_cat_s1" aria-expanded="false">
    <span><i class="bi bi-eye me-1"></i>1. Pre-operative Visual Acuity &amp; IOP</span>
    <i class="bi bi-chevron-up cfm-chev"></i>
  </div>
  <div class="collapse mt-2" id="cfm_cat_s1">
    <div class="row g-2">
      <div class="col-md-2">
        <label class="form-label small">VA OD (unaided)</label>
        <select name="dept_preop_va_od" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "6/6,6/9,6/12,6/18,6/24,6/36,6/60,CF (Counting Fingers),HM (Hand Motion),PL (Perception of Light),NPL (No Perception of Light)"|split:"," %}
  <option value="{{ v }}" {% if d.preop_va_od == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-2">
        <label class="form-label small">VA OS (unaided)</label>
        <select name="dept_preop_va_os" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "6/6,6/9,6/12,6/18,6/24,6/36,6/60,CF (Counting Fingers),HM (Hand Motion),PL (Perception of Light),NPL (No Perception of Light)"|split:"," %}
  <option value="{{ v }}" {% if d.preop_va_os == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-2">
        <label class="form-label small">BCVA OD</label>
        <select name="dept_preop_bcva_od" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "6/6,6/9,6/12,6/18,6/24,6/36,6/60,CF (Counting Fingers),HM (Hand Motion),PL,NPL"|split:"," %}
  <option value="{{ v }}" {% if d.preop_bcva_od == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-2">
        <label class="form-label small">BCVA OS</label>
        <select name="dept_preop_bcva_os" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "6/6,6/9,6/12,6/18,6/24,6/36,6/60,CF (Counting Fingers),HM (Hand Motion),PL,NPL"|split:"," %}
  <option value="{{ v }}" {% if d.preop_bcva_os == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-2"><label class="form-label small">IOP OD (mmHg)</label><input type="number" name="dept_preop_iop_od" class="form-control form-control-sm" value="{{ d.preop_iop_od|default:'' }}"></div>
      <div class="col-md-2"><label class="form-label small">IOP OS (mmHg)</label><input type="number" name="dept_preop_iop_os" class="form-control form-control-sm" value="{{ d.preop_iop_os|default:'' }}"></div>
    </div>
  </div>
</div>

<div class="mb-3">
  <div class="fw-bold text-uppercase text-secondary cfm-hdr collapsed" style="font-size:.72rem;letter-spacing:.07em;"
       data-bs-toggle="collapse" data-bs-target="#cfm_cat_s2" aria-expanded="false">
    <span><i class="bi bi-eye-fill me-1"></i>2. Lens Assessment</span>
    <i class="bi bi-chevron-up cfm-chev"></i>
  </div>
  <div class="collapse mt-2" id="cfm_cat_s2">
    <div class="row g-2">
      <div class="col-md-3">
        <label class="form-label fw-semibold small">Lens OD</label>
        <select name="dept_lens_od" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "Clear,Nuclear sclerosis,Posterior subcapsular,Cortical,Mixed,Mature/White,Pseudophakic,Aphakic"|split:"," %}
  <option value="{{ v }}" {% if d.lens_od == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-3">
        <label class="form-label fw-semibold small">Lens OS</label>
        <select name="dept_lens_os" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "Clear,Nuclear sclerosis,Posterior subcapsular,Cortical,Mixed,Mature/White,Pseudophakic,Aphakic"|split:"," %}
  <option value="{{ v }}" {% if d.lens_os == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-3">
        <label class="form-label fw-semibold small">Cataract Grade OD (LOCS III)</label>
        <select name="dept_locs_od" class="form-select form-select-sm">
          <option value="">— Grade —</option>
          {% for v in "1,2,3,4,5"|split:"," %}
          <option value="{{ v }}" {% if d.locs_od == v %}selected{% endif %}>Grade {{ v }}</option>
          {% endfor %}
          <option value="6" {% if d.locs_od == '6' %}selected{% endif %}>Grade 6 (Mature)</option>
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label fw-semibold small">Cataract Grade OS (LOCS III)</label>
        <select name="dept_locs_os" class="form-select form-select-sm">
          <option value="">— Grade —</option>
          {% for v in "1,2,3,4,5"|split:"," %}
          <option value="{{ v }}" {% if d.locs_os == v %}selected{% endif %}>Grade {{ v }}</option>
          {% endfor %}
          <option value="6" {% if d.locs_os == '6' %}selected{% endif %}>Grade 6 (Mature)</option>
        </select>
      </div>
    </div>
  </div>
</div>

<div class="mb-3">
  <div class="fw-bold text-uppercase text-secondary cfm-hdr collapsed" style="font-size:.72rem;letter-spacing:.07em;"
       data-bs-toggle="collapse" data-bs-target="#cfm_cat_s3" aria-expanded="false">
    <span><i class="bi bi-calculator me-1"></i>3. Biometry &amp; IOL Calculation</span>
    <i class="bi bi-chevron-up cfm-chev"></i>
  </div>
  <div class="collapse mt-2" id="cfm_cat_s3">
    <div class="row g-2">
      <div class="col-md-3"><label class="form-label fw-semibold small">Axial Length OD (mm)</label><input type="number" step="0.01" name="dept_al_od" value="{{ d.al_od|default:'' }}" class="form-control form-control-sm" placeholder="e.g. 23.45"></div>
      <div class="col-md-3"><label class="form-label fw-semibold small">Axial Length OS (mm)</label><input type="number" step="0.01" name="dept_al_os" value="{{ d.al_os|default:'' }}" class="form-control form-control-sm" placeholder="e.g. 23.45"></div>
      <div class="col-md-3"><label class="form-label fw-semibold small">K1/K2 OD</label><input type="text" name="dept_biom_k_od" value="{{ d.biom_k_od|default:'' }}" class="form-control form-control-sm" placeholder="e.g. 43.5 / 44.25"></div>
      <div class="col-md-3"><label class="form-label fw-semibold small">K1/K2 OS</label><input type="text" name="dept_biom_k_os" value="{{ d.biom_k_os|default:'' }}" class="form-control form-control-sm" placeholder="e.g. 43.5 / 44.25"></div>
      <div class="col-md-4"><label class="form-label fw-semibold small">Target Refraction</label><input type="text" name="dept_target_rx" value="{{ d.target_rx|default:'' }}" class="form-control form-control-sm" placeholder="e.g. Plano / -0.50"></div>
      <div class="col-md-4"><label class="form-label fw-semibold small">IOL Power OD (D)</label><input type="number" step="0.5" name="dept_iol_power_od" value="{{ d.iol_power_od|default:'' }}" class="form-control form-control-sm" placeholder="e.g. 21.5"></div>
      <div class="col-md-4"><label class="form-label fw-semibold small">IOL Power OS (D)</label><input type="number" step="0.5" name="dept_iol_power_os" value="{{ d.iol_power_os|default:'' }}" class="form-control form-control-sm" placeholder="e.g. 21.5"></div>
      <div class="col-md-4"><label class="form-label fw-semibold small">IOL Type / Model</label><input type="text" name="dept_iol_model" value="{{ d.iol_model|default:'' }}" class="form-control form-control-sm" placeholder="e.g. Alcon SN60WF, Monofocal"></div>
      <div class="col-md-2">
        <label class="form-label fw-semibold small">Biometry Formula</label>
        <select name="dept_biom_formula" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "SRK/T,Haigis,Holladay 1,Holladay 2,Barrett Universal II,Kane,Olsen"|split:"," %}
  <option value="{{ v }}" {% if d.biom_formula == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-3"><label class="form-label small">ECD OD (cells/mm²)</label><input type="number" name="dept_ecd_od" class="form-control form-control-sm" placeholder="2500" value="{{ d.ecd_od|default:'' }}"></div>
      <div class="col-md-3"><label class="form-label small">ECD OS (cells/mm²)</label><input type="number" name="dept_ecd_os" class="form-control form-control-sm" placeholder="2500" value="{{ d.ecd_os|default:'' }}"></div>
    </div>
  </div>
</div>

<div class="mb-3">
  <div class="fw-bold text-uppercase text-secondary cfm-hdr collapsed" style="font-size:.72rem;letter-spacing:.07em;"
       data-bs-toggle="collapse" data-bs-target="#cfm_cat_s4" aria-expanded="false">
    <span><i class="bi bi-scissors me-1"></i>4. Surgical Record</span>
    <i class="bi bi-chevron-up cfm-chev"></i>
  </div>
  <div class="collapse mt-2" id="cfm_cat_s4">
    <div class="row g-2">
      <div class="col-md-4"><label class="form-label fw-semibold small">Surgery Date</label><input type="date" name="dept_surgery_date" value="{{ d.surgery_date|default:'' }}" class="form-control form-control-sm"></div>
      <div class="col-md-4"><label class="form-label fw-semibold small">Surgeon</label><input type="text" name="dept_surgeon" value="{{ d.surgeon|default:'' }}" class="form-control form-control-sm" placeholder="Surgeon name"></div>
      <div class="col-md-4">
        <label class="form-label fw-semibold small">Anaesthesia</label>
        <select name="dept_anaesthesia" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "Topical,Peribulbar,Retrobulbar,General,Sub-Tenon"|split:"," %}
  <option value="{{ v }}" {% if d.anaesthesia == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-12"><label class="form-label fw-semibold small">Operative Notes</label>
        <textarea name="dept_op_notes" rows="3" class="form-control form-control-sm" placeholder="e.g. Phaco + IOL implantation, no complications, CCC performed, hydrodissection done...">{{ d.op_notes|default:'' }}</textarea>
      </div>
      <div class="col-12"><label class="form-label fw-semibold small">Post-op Status / Examination</label>
        <textarea name="dept_postop" rows="2" class="form-control form-control-sm" placeholder="e.g. Day 1 post-op: VA 6/12, cornea clear, IOL in situ, mild AC reaction">{{ d.postop|default:'' }}</textarea>
      </div>
    </div>
  </div>
</div>

<div class="mb-3">
  <div class="fw-bold text-uppercase text-secondary cfm-hdr collapsed" style="font-size:.72rem;letter-spacing:.07em;"
       data-bs-toggle="collapse" data-bs-target="#cfm_cat_s5" aria-expanded="false">
    <span><i class="bi bi-graph-up me-1"></i>5. Post-operative VA Tracking</span>
    <i class="bi bi-chevron-up cfm-chev"></i>
  </div>
  <div class="collapse mt-2" id="cfm_cat_s5">
    <div class="row g-2">
      <div class="col-md-2">
        <label class="form-label small">UCVA OD</label>
        <select name="dept_postop_ucva_od" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "6/6,6/9,6/12,6/18,6/24,6/36,6/60,CF,HM,PL,NPL"|split:"," %}
  <option value="{{ v }}" {% if d.postop_ucva_od == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-2">
        <label class="form-label small">UCVA OS</label>
        <select name="dept_postop_ucva_os" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "6/6,6/9,6/12,6/18,6/24,6/36,6/60,CF,HM,PL,NPL"|split:"," %}
  <option value="{{ v }}" {% if d.postop_ucva_os == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-2">
        <label class="form-label small">BCVA OD</label>
        <select name="dept_postop_bcva_od" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "6/6,6/9,6/12,6/18,6/24,6/36,6/60,CF,HM,PL,NPL"|split:"," %}
  <option value="{{ v }}" {% if d.postop_bcva_od == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-2">
        <label class="form-label small">BCVA OS</label>
        <select name="dept_postop_bcva_os" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "6/6,6/9,6/12,6/18,6/24,6/36,6/60,CF,HM,PL,NPL"|split:"," %}
  <option value="{{ v }}" {% if d.postop_bcva_os == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-2"><label class="form-label small">IOP OD (mmHg)</label><input type="number" name="dept_postop_iop_od" class="form-control form-control-sm" value="{{ d.postop_iop_od|default:'' }}"></div>
      <div class="col-md-2"><label class="form-label small">IOP OS (mmHg)</label><input type="number" name="dept_postop_iop_os" class="form-control form-control-sm" value="{{ d.postop_iop_os|default:'' }}"></div>
      <div class="col-md-3">
        <label class="form-label small">Post-op Day / Week</label>
        <select name="dept_postop_timepoint" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "Day 1,Day 3,Week 1,Week 2,Week 4 (1 month),3 months,6 months,12 months"|split:"," %}
  <option value="{{ v }}" {% if d.postop_timepoint == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-3">
        <label class="form-label small">IOL Position</label>
        <select name="dept_iol_position" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "In bag — central,In bag — decentred,Sulcus,Anterior chamber,Subluxated,Not applicable"|split:"," %}
  <option value="{{ v }}" {% if d.iol_position == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-3">
        <label class="form-label small">PCO Status</label>
        <select name="dept_pco" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "None,Mild,Moderate,Dense — YAG needed,Post YAG"|split:"," %}
  <option value="{{ v }}" {% if d.pco == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-3">
        <label class="form-label small">Intra-op Complications</label>
        <select name="dept_intraop_complications" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "None,PCR (Posterior Capsule Rupture),Vitreous loss,Zonular dialysis,Iris prolapse,Suprachoroidal haemorrhage,Dropped nucleus,IOL dropped,Hyphema,Descemet's detachment"|split:"," %}
  <option value="{{ v }}" {% if d.intraop_complications == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
    </div>
  </div>
</div>

{% endwith %}
