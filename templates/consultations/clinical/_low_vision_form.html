{% load ehr_tags %}
{% with d=consultation.department_specific_data %}
<div class="row g-3">

  <div class="col-12"><h6 class="fw-semibold text-muted small text-uppercase border-bottom pb-1">Distance Visual Acuity</h6></div>
  <div class="col-md-2">
    <label class="form-label small">VA Chart Used</label>
    <select name="dept_va_chart" class="form-select form-select-sm">
      <option value="">—</option>
      {% for c in "Snellen 6m,LogMAR (ETDRS),LogMAR (Bailey-Lovie),Tumbling E,Sheridan-Gardiner,Cardiff Cards,Not recorded"|split:"," %}
      <option value="{{ c }}" {% if d.va_chart == c %}selected{% endif %}>{{ c }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-2"><label class="form-label small">VA OD (current Rx)</label><input type="text" name="dept_dist_va_od" class="form-control form-control-sm" placeholder="6/60, HM, CF, PL" value="{{ d.dist_va_od|default:'' }}"></div>
  <div class="col-md-2"><label class="form-label small">VA OS (current Rx)</label><input type="text" name="dept_dist_va_os" class="form-control form-control-sm" placeholder="6/60, HM, CF, PL" value="{{ d.dist_va_os|default:'' }}"></div>
  <div class="col-md-2"><label class="form-label small">VA OD (with LVA)</label><input type="text" name="dept_dist_va_od_lva" class="form-control form-control-sm" placeholder="6/18" value="{{ d.dist_va_od_lva|default:'' }}"></div>
  <div class="col-md-2"><label class="form-label small">VA OS (with LVA)</label><input type="text" name="dept_dist_va_os_lva" class="form-control form-control-sm" placeholder="6/18" value="{{ d.dist_va_os_lva|default:'' }}"></div>
  <div class="col-md-2">
    <label class="form-label small">Better Eye VA</label>
    <input type="text" name="dept_better_eye_va" class="form-control form-control-sm" placeholder="6/60" value="{{ d.better_eye_va|default:'' }}">
  </div>

  <div class="col-12 mt-2"><h6 class="fw-semibold text-muted small text-uppercase border-bottom pb-1">Near Visual Acuity</h6></div>
  <div class="col-md-3"><label class="form-label small">Near VA OD</label><input type="text" name="dept_near_va_od" class="form-control form-control-sm" placeholder="N36 / N24 / N18" value="{{ d.near_va_od|default:'' }}"></div>
  <div class="col-md-3"><label class="form-label small">Near VA OS</label><input type="text" name="dept_near_va_os" class="form-control form-control-sm" placeholder="N36 / N24 / N18" value="{{ d.near_va_os|default:'' }}"></div>
  <div class="col-md-3"><label class="form-label small">Near VA OD (with LVA)</label><input type="text" name="dept_near_va_od_lva" class="form-control form-control-sm" placeholder="N8 / N5" value="{{ d.near_va_od_lva|default:'' }}"></div>
  <div class="col-md-3"><label class="form-label small">Near VA OS (with LVA)</label><input type="text" name="dept_near_va_os_lva" class="form-control form-control-sm" placeholder="N8 / N5" value="{{ d.near_va_os_lva|default:'' }}"></div>

  <div class="col-12 mt-2"><h6 class="fw-semibold text-muted small text-uppercase border-bottom pb-1">WHO Visual Impairment Classification (ICD-11)</h6></div>
  <div class="col-md-4">
    <label class="form-label small">Distance Vision Category (better eye)</label>
    <select name="dept_who_dist_cat" class="form-select form-select-sm">
      <option value="">—</option>
      {% for w in "0 — Mild or no impairment (≥6/18),1 — Moderate impairment (6/18–6/60),2 — Severe impairment (<6/60–3/60),3 — Blindness (<3/60–1/60),4 — Blindness (<1/60–LP),5 — No Light Perception,9 — Undetermined"|split:"," %}
      <option value="{{ w }}" {% if d.who_dist_cat == w %}selected{% endif %}>{{ w }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-4">
    <label class="form-label small">Near Vision Category (better eye)</label>
    <select name="dept_who_near_cat" class="form-select form-select-sm">
      <option value="">—</option>
      {% for n in "N0 — No impairment (N8 or better),N1 — Mild (N10–N14),N2 — Moderate (N18–N24),N3 — Severe (N36 or worse),Near vision not assessable"|split:"," %}
      <option value="{{ n }}" {% if d.who_near_cat == n %}selected{% endif %}>{{ n }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-4">
    <label class="form-label small">Laterality</label>
    <select name="dept_lv_laterality" class="form-select form-select-sm">
      <option value="">—</option>
      {% for l in "Unilateral — OD affected,Unilateral — OS affected,Bilateral — symmetric,Bilateral — asymmetric"|split:"," %}
      <option value="{{ l }}" {% if d.lv_laterality == l %}selected{% endif %}>{{ l }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-4">
    <label class="form-label small">Registration Status</label>
    <select name="dept_blind_registration" class="form-select form-select-sm">
      <option value="">—</option>
      {% for r in "Not registered,Partially sighted (registered),Severely sight impaired (blind — registered),Eligible — not yet registered,Not eligible"|split:"," %}
      <option value="{{ r }}" {% if d.blind_registration == r %}selected{% endif %}>{{ r }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-4">
    <label class="form-label small">Aetiology / Primary Diagnosis</label>
    <select name="dept_lv_aetiology" class="form-select form-select-sm">
      <option value="">—</option>
      {% for ae in "AMD (dry),AMD (wet),Diabetic Retinopathy,Glaucoma,Corneal opacity/scarring,Optic atrophy,Retinitis Pigmentosa,Macular dystrophy,Congenital / developmental,Trauma,Other — see notes"|split:"," %}
      <option value="{{ ae }}" {% if d.lv_aetiology == ae %}selected{% endif %}>{{ ae }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-4">
    <label class="form-label small">Prognosis</label>
    <select name="dept_lv_prognosis" class="form-select form-select-sm">
      <option value="">—</option>
      {% for p in "Stable,Slowly progressive,Rapidly progressive,Potentially reversible,Variable / uncertain"|split:"," %}
      <option value="{{ p }}" {% if d.lv_prognosis == p %}selected{% endif %}>{{ p }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="col-12 mt-2"><h6 class="fw-semibold text-muted small text-uppercase border-bottom pb-1">Contrast Sensitivity & Other Tests</h6></div>
  <div class="col-md-4"><label class="form-label small">Contrast Sensitivity OD</label><input type="text" name="dept_contrast_od" class="form-control form-control-sm" placeholder="Normal / Reduced (Pelli-Robson)" value="{{ d.contrast_od|default:'' }}"></div>
  <div class="col-md-4"><label class="form-label small">Contrast Sensitivity OS</label><input type="text" name="dept_contrast_os" class="form-control form-control-sm" placeholder="Normal / Reduced" value="{{ d.contrast_os|default:'' }}"></div>
  <div class="col-md-4"><label class="form-label small">Visual Field Status</label><input type="text" name="dept_vf_status" class="form-control form-control-sm" placeholder="Full / Constricted / Hemianopia" value="{{ d.vf_status|default:'' }}"></div>
  <div class="col-md-4"><label class="form-label small">Colour Vision</label><input type="text" name="dept_colour_vision" class="form-control form-control-sm" placeholder="Normal / Deficient" value="{{ d.colour_vision|default:'' }}"></div>
  <div class="col-md-4"><label class="form-label small">Glare Sensitivity</label><input type="text" name="dept_glare" class="form-control form-control-sm" placeholder="Yes / No / Mild" value="{{ d.glare|default:'' }}"></div>
  <div class="col-md-4">
    <label class="form-label small">Eccentric Viewing</label>
    <select name="dept_eccentric_viewing" class="form-select form-select-sm">
      <option value="">—</option>
      {% for v in "Not present,OD — Superior,OD — Inferior,OD — Temporal,OD — Nasal,OS — Superior,OS — Inferior,OS — Temporal,OS — Nasal"|split:"," %}
      <option value="{{ v }}" {% if d.eccentric_viewing == v %}selected{% endif %}>{{ v }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="col-12 mt-2"><h6 class="fw-semibold text-muted small text-uppercase border-bottom pb-1">Low Vision Aid (LVA) Assessment</h6></div>
  <div class="col-md-4">
    <label class="form-label small">Aid Type Prescribed</label>
    <select name="dept_aid_type" class="form-select form-select-sm">
      <option value="">—</option>
      {% for a in "Optical Magnifier (Handheld),Stand Magnifier,Bar Magnifier,Spectacle Magnifier (near),Spectacle Magnifier (distance),Telescopic (Distance — monocular),Telescopic (Bioptic),Electronic Magnifier (CCTV/tablet),Screen reader,Non-optical (Large print/typoscope/acetate),Tinted lenses,Mobility Aid / White cane,Guide dog referral,None — patient declined"|split:"," %}
      <option value="{{ a }}" {% if d.aid_type == a %}selected{% endif %}>{{ a }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-2"><label class="form-label small">Magnification Required</label><input type="text" name="dept_magnification" class="form-control form-control-sm" placeholder="4×, 8×, 12×" value="{{ d.magnification|default:'' }}"></div>
  <div class="col-md-2"><label class="form-label small">Reading Distance</label><input type="text" name="dept_reading_dist" class="form-control form-control-sm" placeholder="10 cm / 25 cm" value="{{ d.reading_dist|default:'' }}"></div>
  <div class="col-md-2">
    <label class="form-label small">Trial Outcome</label>
    <select name="dept_lva_trial" class="form-select form-select-sm">
      <option value="">—</option>
      {% for t in "Good — dispensed,Partial benefit — dispensed,No benefit — alternative sought,Patient declined,Further trial needed"|split:"," %}
      <option value="{{ t }}" {% if d.lva_trial == t %}selected{% endif %}>{{ t }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-2">
    <label class="form-label small">Task Goal Achieved</label>
    <select name="dept_lva_goal_met" class="form-select form-select-sm">
      <option value="">—</option>
      {% for g in "Reading newspaper,Reading medicine labels,Watching TV,Face recognition,Writing,Walking independently,Other — see notes"|split:"," %}
      <option value="{{ g }}" {% if d.lva_goal_met == g %}selected{% endif %}>{{ g }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-12"><label class="form-label small">LVA Performance / Notes</label><textarea name="dept_lva_notes" class="form-control form-control-sm" rows="2" placeholder="Patient's performance with the aid, acceptance, instructions given...">{{ d.lva_notes|default:'' }}</textarea></div>

  <div class="col-12 mt-2"><h6 class="fw-semibold text-muted small text-uppercase border-bottom pb-1">Functional Assessment & Rehabilitation Plan</h6></div>
  <div class="col-md-3">
    <label class="form-label small">Activities of Daily Living (ADL)</label>
    <select name="dept_adl" class="form-select form-select-sm">
      <option value="">—</option>
      {% for l in "Independent,Partially dependent,Fully dependent"|split:"," %}
      <option value="{{ l }}" {% if d.adl == l %}selected{% endif %}>{{ l }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-3">
    <label class="form-label small">Mobility</label>
    <select name="dept_mobility" class="form-select form-select-sm">
      <option value="">—</option>
      {% for m in "Independent,Partially independent,Needs assistance,Uses cane/guide,Housebound"|split:"," %}
      <option value="{{ m }}" {% if d.mobility == m %}selected{% endif %}>{{ m }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-3">
    <label class="form-label small">Reading Ability</label>
    <select name="dept_reading_ability" class="form-select form-select-sm">
      <option value="">—</option>
      {% for r in "Normal print,Large print (N18–N24),Large print only (N36+),Cannot read — uses audio,Braille user,Illiterate"|split:"," %}
      <option value="{{ r }}" {% if d.reading_ability == r %}selected{% endif %}>{{ r }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-3">
    <label class="form-label small">Employment / Education Impact</label>
    <select name="dept_employment_impact" class="form-select form-select-sm">
      <option value="">—</option>
      {% for e in "No impact,Reduced productivity,Unable to continue current role,Retired / not working,School-age — learning support needed,Referral to social services made"|split:"," %}
      <option value="{{ e }}" {% if d.employment_impact == e %}selected{% endif %}>{{ e }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-6"><label class="form-label small">Rehabilitation Goals</label><textarea name="dept_rehab_goals" class="form-control form-control-sm" rows="2" placeholder="e.g. Read newspaper, recognise faces, navigate independently...">{{ d.rehab_goals|default:'' }}</textarea></div>
  <div class="col-md-6"><label class="form-label small">Referrals / Follow-up Plan</label><textarea name="dept_rehab_referrals" class="form-control form-control-sm" rows="2" placeholder="Orientation & Mobility training, Braille, Social services, SENSE...">{{ d.rehab_referrals|default:'' }}</textarea></div>
  <div class="col-12"><label class="form-label small">Additional Notes</label><textarea name="dept_lv_notes_general" class="form-control form-control-sm" rows="2">{{ d.lv_notes_general|default:'' }}</textarea></div>

</div>
{% endwith %}
