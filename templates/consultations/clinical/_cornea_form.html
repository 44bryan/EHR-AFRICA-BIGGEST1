{% load ehr_tags %}
{% with d=consultation.department_specific_data %}
<!-- CORNEA & EXTERNAL EYE — editable form -->
<div class="row g-3">
  <div class="col-12">
    <h6 class="fw-bold text-uppercase text-muted small border-bottom pb-1">Corneal Assessment</h6>
  </div>
  <div class="col-md-6">
    <label class="form-label fw-semibold small">Keratometry K1/K2 OD</label>
    <input type="text" name="dept_kerato_od" value="{{ d.kerato_od|default:'' }}" class="form-control form-control-sm" placeholder="e.g. 43.50 / 44.25 @ 90">
  </div>
  <div class="col-md-6">
    <label class="form-label fw-semibold small">Keratometry K1/K2 OS</label>
    <input type="text" name="dept_kerato_os" value="{{ d.kerato_os|default:'' }}" class="form-control form-control-sm" placeholder="e.g. 43.50 / 44.25 @ 90">
  </div>
  <div class="col-md-4">
    <label class="form-label fw-semibold small">Pachymetry OD (µm)</label>
    <input type="number" name="dept_pachymetry_od" value="{{ d.pachymetry_od|default:'' }}" class="form-control form-control-sm" placeholder="e.g. 540">
  </div>
  <div class="col-md-4">
    <label class="form-label fw-semibold small">Pachymetry OS (µm)</label>
    <input type="number" name="dept_pachymetry_os" value="{{ d.pachymetry_os|default:'' }}" class="form-control form-control-sm" placeholder="e.g. 540">
  </div>
  <div class="col-md-3">
    <label class="form-label fw-semibold small">ECD OD (cells/mm²)</label>
    <input type="number" name="dept_ecd_od" value="{{ d.ecd_od|default:'' }}" class="form-control form-control-sm" placeholder="2500">
  </div>
  <div class="col-md-3">
    <label class="form-label fw-semibold small">ECD OS (cells/mm²)</label>
    <input type="number" name="dept_ecd_os" value="{{ d.ecd_os|default:'' }}" class="form-control form-control-sm" placeholder="2500">
  </div>

  <div class="col-12 mt-2">
    <h6 class="fw-bold text-uppercase text-muted small border-bottom pb-1">Corneal Topography / Pentacam (Investigation Results)</h6>
  </div>
  <div class="col-md-3"><label class="form-label small">K1 OD (D)</label><input type="text" name="dept_k1_od" class="form-control form-control-sm" placeholder="43.5" value="{{ d.k1_od|default:'' }}"></div>
  <div class="col-md-3"><label class="form-label small">K2 OD (D)</label><input type="text" name="dept_k2_od" class="form-control form-control-sm" placeholder="44.25" value="{{ d.k2_od|default:'' }}"></div>
  <div class="col-md-3"><label class="form-label small">K1 OS (D)</label><input type="text" name="dept_k1_os" class="form-control form-control-sm" placeholder="43.5" value="{{ d.k1_os|default:'' }}"></div>
  <div class="col-md-3"><label class="form-label small">K2 OS (D)</label><input type="text" name="dept_k2_os" class="form-control form-control-sm" placeholder="44.25" value="{{ d.k2_os|default:'' }}"></div>
  <div class="col-md-3"><label class="form-label small">K-max OD (D)</label><input type="text" name="dept_kmax_od" class="form-control form-control-sm" placeholder="48.5" value="{{ d.kmax_od|default:'' }}"></div>
  <div class="col-md-3"><label class="form-label small">K-max OS (D)</label><input type="text" name="dept_kmax_os" class="form-control form-control-sm" placeholder="48.5" value="{{ d.kmax_os|default:'' }}"></div>
  <div class="col-md-3"><label class="form-label small">Min Corneal Thickness OD (µm)</label><input type="number" name="dept_mct_od" class="form-control form-control-sm" placeholder="440" value="{{ d.mct_od|default:'' }}"></div>
  <div class="col-md-3"><label class="form-label small">Min Corneal Thickness OS (µm)</label><input type="number" name="dept_mct_os" class="form-control form-control-sm" placeholder="440" value="{{ d.mct_os|default:'' }}"></div>
  <div class="col-md-4">
    <label class="form-label small">Keratoconus Stage OD (Amsler-Krumeich)</label>
    <select name="dept_kc_stage_od" class="form-select form-select-sm">
      <option value="">—</option>
      {% for s in "No Keratoconus,Suspect (Forme Fruste),Stage I,Stage II,Stage III,Stage IV"|split:"," %}
      <option value="{{ s }}" {% if d.kc_stage_od == s %}selected{% endif %}>{{ s }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-4">
    <label class="form-label small">Keratoconus Stage OS</label>
    <select name="dept_kc_stage_os" class="form-select form-select-sm">
      <option value="">—</option>
      {% for s in "No Keratoconus,Suspect (Forme Fruste),Stage I,Stage II,Stage III,Stage IV"|split:"," %}
      <option value="{{ s }}" {% if d.kc_stage_os == s %}selected{% endif %}>{{ s }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-4"><label class="form-label small">Topography Additional Notes</label><input type="text" name="dept_topography_notes" class="form-control form-control-sm" placeholder="Inferior steepening, asymmetric bow-tie..." value="{{ d.topography_notes|default:'' }}"></div>

  <div class="col-12 mt-2">
    <h6 class="fw-bold text-uppercase text-muted small border-bottom pb-1">Corneal Crosslinking / Transplant</h6>
  </div>
  <div class="col-md-3">
    <label class="form-label small">CXL Status</label>
    <select name="dept_cxl_status" class="form-select form-select-sm">
      <option value="">—</option>
      {% for s in "Not performed,Candidate — advised,Performed OD,Performed OS,Performed OU,Post-CXL follow-up"|split:"," %}
      <option value="{{ s }}" {% if d.cxl_status == s %}selected{% endif %}>{{ s }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-3">
    <label class="form-label small">CXL Protocol</label>
    <select name="dept_cxl_protocol" class="form-select form-select-sm">
      <option value="">—</option>
      {% for p in "Epi-off (Dresden),Epi-off (Accelerated),Epi-on (Transepithelial),Not applicable"|split:"," %}
      <option value="{{ p }}" {% if d.cxl_protocol == p %}selected{% endif %}>{{ p }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-3">
    <label class="form-label small">Corneal Graft Type</label>
    <select name="dept_graft_type" class="form-select form-select-sm">
      <option value="">—</option>
      {% for g in "None,DALK,DSAEK,DMEK,PKP (Full thickness),KERALINK,Not applicable"|split:"," %}
      <option value="{{ g }}" {% if d.graft_type == g %}selected{% endif %}>{{ g }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-3">
    <label class="form-label small">Graft Status</label>
    <select name="dept_graft_status" class="form-select form-select-sm">
      <option value="">—</option>
      {% for gs in "Clear — functioning,Oedematous,Rejection episode,Failed,Not applicable"|split:"," %}
      <option value="{{ gs }}" {% if d.graft_status == gs %}selected{% endif %}>{{ gs }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="col-12 mt-2">
    <h6 class="fw-bold text-uppercase text-muted small border-bottom pb-1">Staining & Surface</h6>
  </div>
  <div class="col-md-4">
    <label class="form-label fw-semibold small">Fluorescein Staining OD</label>
    <input type="text" name="dept_fluor_od" value="{{ d.fluor_od|default:'' }}" class="form-control form-control-sm" placeholder="Negative / Positive">
  </div>
  <div class="col-md-4">
    <label class="form-label fw-semibold small">Fluorescein Staining OS</label>
    <input type="text" name="dept_fluor_os" value="{{ d.fluor_os|default:'' }}" class="form-control form-control-sm" placeholder="Negative / Positive">
  </div>
  <div class="col-md-4">
    <label class="form-label fw-semibold small">Rose Bengal / Lissamine</label>
    <input type="text" name="dept_rose_bengal" value="{{ d.rose_bengal|default:'' }}" class="form-control form-control-sm" placeholder="Score / Finding">
  </div>
  <div class="col-md-6">
    <label class="form-label fw-semibold small">Tear Film / TBUT (sec)</label>
    <input type="text" name="dept_tbut" value="{{ d.tbut|default:'' }}" class="form-control form-control-sm" placeholder="e.g. 5 sec OD, 4 sec OS">
  </div>
  <div class="col-md-6">
    <label class="form-label fw-semibold small">Schirmer Test (mm)</label>
    <input type="text" name="dept_schirmer" value="{{ d.schirmer|default:'' }}" class="form-control form-control-sm" placeholder="e.g. 10mm OD, 8mm OS">
  </div>
  <div class="col-12">
    <label class="form-label fw-semibold small">Diagnosis / Corneal Condition</label>
    <textarea name="dept_corneal_diagnosis" rows="2" class="form-control form-control-sm" placeholder="e.g. Keratoconus Stage II OD, Dry Eye Syndrome">{{ d.corneal_diagnosis|default:'' }}</textarea>
  </div>
  <div class="col-12">
    <label class="form-label fw-semibold small">Treatment Plan</label>
    <textarea name="dept_corneal_plan" rows="2" class="form-control form-control-sm" placeholder="e.g. RGP contact lens fitting, Corneal crosslinking">{{ d.corneal_plan|default:'' }}</textarea>
  </div>
</div>
{% endwith %}
