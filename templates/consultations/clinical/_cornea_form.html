{% load ehr_tags %}
{% with d=consultation.department_specific_data %}
<!-- CORNEA & EXTERNAL EYE — editable form -->

<div class="mb-3">
  <div class="fw-bold text-uppercase text-secondary cfm-hdr collapsed" style="font-size:.82rem;letter-spacing:.05em;"
       data-bs-toggle="collapse" data-bs-target="#cfm_cor_s1" aria-expanded="false">
    <span><i class="bi bi-eye me-1"></i>1. Corneal Assessment</span>
    <i class="bi bi-chevron-up cfm-chev"></i>
  </div>
  <div class="collapse mt-2" id="cfm_cor_s1">
    <div class="row g-2">
      <div class="col-md-6"><label class="form-label fw-semibold small">Keratometry K1/K2 OD</label><input type="text" name="dept_kerato_od" value="{{ d.kerato_od|default:'' }}" class="form-control form-control-sm" placeholder="e.g. 43.50 / 44.25 @ 90"></div>
      <div class="col-md-6"><label class="form-label fw-semibold small">Keratometry K1/K2 OS</label><input type="text" name="dept_kerato_os" value="{{ d.kerato_os|default:'' }}" class="form-control form-control-sm" placeholder="e.g. 43.50 / 44.25 @ 90"></div>
      <div class="col-md-3"><label class="form-label fw-semibold small">Pachymetry OD (µm)</label><input type="number" name="dept_pachymetry_od" value="{{ d.pachymetry_od|default:'' }}" class="form-control form-control-sm" placeholder="e.g. 540"></div>
      <div class="col-md-3"><label class="form-label fw-semibold small">Pachymetry OS (µm)</label><input type="number" name="dept_pachymetry_os" value="{{ d.pachymetry_os|default:'' }}" class="form-control form-control-sm" placeholder="e.g. 540"></div>
      <div class="col-md-3"><label class="form-label fw-semibold small">ECD OD (cells/mm²)</label><input type="number" name="dept_ecd_od" value="{{ d.ecd_od|default:'' }}" class="form-control form-control-sm" placeholder="2500"></div>
      <div class="col-md-3"><label class="form-label fw-semibold small">ECD OS (cells/mm²)</label><input type="number" name="dept_ecd_os" value="{{ d.ecd_os|default:'' }}" class="form-control form-control-sm" placeholder="2500"></div>
    </div>
  </div>
</div>

<div class="mb-3">
  <div class="fw-bold text-uppercase text-secondary cfm-hdr collapsed" style="font-size:.82rem;letter-spacing:.05em;"
       data-bs-toggle="collapse" data-bs-target="#cfm_cor_s2" aria-expanded="false">
    <span><i class="bi bi-diagram-3 me-1"></i>2. Corneal Topography / Pentacam</span>
    <i class="bi bi-chevron-up cfm-chev"></i>
  </div>
  <div class="collapse mt-2" id="cfm_cor_s2">
    <div class="row g-2">
      <div class="col-md-3"><label class="form-label small">K1 OD (D)</label><input type="text" name="dept_k1_od" class="form-control form-control-sm" placeholder="43.5" value="{{ d.k1_od|default:'' }}"></div>
      <div class="col-md-3"><label class="form-label small">K2 OD (D)</label><input type="text" name="dept_k2_od" class="form-control form-control-sm" placeholder="44.25" value="{{ d.k2_od|default:'' }}"></div>
      <div class="col-md-3"><label class="form-label small">K1 OS (D)</label><input type="text" name="dept_k1_os" class="form-control form-control-sm" placeholder="43.5" value="{{ d.k1_os|default:'' }}"></div>
      <div class="col-md-3"><label class="form-label small">K2 OS (D)</label><input type="text" name="dept_k2_os" class="form-control form-control-sm" placeholder="44.25" value="{{ d.k2_os|default:'' }}"></div>
      <div class="col-md-3"><label class="form-label small">K-max OD (D)</label><input type="text" name="dept_kmax_od" class="form-control form-control-sm" placeholder="48.5" value="{{ d.kmax_od|default:'' }}"></div>
      <div class="col-md-3"><label class="form-label small">K-max OS (D)</label><input type="text" name="dept_kmax_os" class="form-control form-control-sm" placeholder="48.5" value="{{ d.kmax_os|default:'' }}"></div>
      <div class="col-md-3"><label class="form-label small">Min Corneal Thickness OD (µm)</label><input type="number" name="dept_mct_od" class="form-control form-control-sm" placeholder="440" value="{{ d.mct_od|default:'' }}"></div>
      <div class="col-md-3"><label class="form-label small">Min Corneal Thickness OS (µm)</label><input type="number" name="dept_mct_os" class="form-control form-control-sm" placeholder="440" value="{{ d.mct_os|default:'' }}"></div>
      <div class="col-md-4">
        <label class="form-label small">Keratoconus Stage OD</label>
        <select name="dept_kc_stage_od" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "No Keratoconus,Suspect (Forme Fruste),Stage I,Stage II,Stage III,Stage IV"|split:"," %}
  <option value="{{ v }}" {% if d.kc_stage_od == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-4">
        <label class="form-label small">Keratoconus Stage OS</label>
        <select name="dept_kc_stage_os" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "No Keratoconus,Suspect (Forme Fruste),Stage I,Stage II,Stage III,Stage IV"|split:"," %}
  <option value="{{ v }}" {% if d.kc_stage_os == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-4"><label class="form-label small">Topography Notes</label><input type="text" name="dept_topography_notes" class="form-control form-control-sm" placeholder="Inferior steepening, asymmetric bow-tie..." value="{{ d.topography_notes|default:'' }}"></div>
    </div>
  </div>
</div>

<div class="mb-3">
  <div class="fw-bold text-uppercase text-secondary cfm-hdr collapsed" style="font-size:.82rem;letter-spacing:.05em;"
       data-bs-toggle="collapse" data-bs-target="#cfm_cor_s3" aria-expanded="false">
    <span><i class="bi bi-lightning me-1"></i>3. Corneal Crosslinking / Transplant</span>
    <i class="bi bi-chevron-up cfm-chev"></i>
  </div>
  <div class="collapse mt-2" id="cfm_cor_s3">
    <div class="row g-2">
      <div class="col-md-3">
        <label class="form-label small">CXL Status</label>
        <select name="dept_cxl_status" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "Not performed,Candidate — advised,Performed OD,Performed OS,Performed OU,Post-CXL follow-up"|split:"," %}
  <option value="{{ v }}" {% if d.cxl_status == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-3">
        <label class="form-label small">CXL Protocol</label>
        <select name="dept_cxl_protocol" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "Epi-off (Dresden),Epi-off (Accelerated),Epi-on (Transepithelial),Not applicable"|split:"," %}
  <option value="{{ v }}" {% if d.cxl_protocol == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-3">
        <label class="form-label small">Corneal Graft Type</label>
        <select name="dept_graft_type" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "None,DALK,DSAEK,DMEK,PKP (Full thickness),KERALINK,Not applicable"|split:"," %}
  <option value="{{ v }}" {% if d.graft_type == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-3">
        <label class="form-label small">Graft Status</label>
        <select name="dept_graft_status" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "Clear — functioning,Oedematous,Rejection episode,Failed,Not applicable"|split:"," %}
  <option value="{{ v }}" {% if d.graft_status == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
    </div>
  </div>
</div>

<div class="mb-3">
  <div class="fw-bold text-uppercase text-secondary cfm-hdr collapsed" style="font-size:.82rem;letter-spacing:.05em;"
       data-bs-toggle="collapse" data-bs-target="#cfm_cor_s4" aria-expanded="false">
    <span><i class="bi bi-droplet me-1"></i>4. Staining &amp; Tear Film</span>
    <i class="bi bi-chevron-up cfm-chev"></i>
  </div>
  <div class="collapse mt-2" id="cfm_cor_s4">
    <div class="row g-2">
      <div class="col-md-4">
        <label class="form-label fw-semibold small">Fluorescein Staining OD</label>
        <select name="dept_fluor_od" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "Negative — no staining,Superficial punctate staining (SPK),Diffuse SPK inferior 1/3,Diffuse SPK interpalpebral,Dendrite (herpetic ulcer),Geographic ulcer,Stromal infiltrate epithelial defect,Peripheral ulcerative keratitis,Neurotrophic ulcer round defect,Post-op epithelial defect,Abrasion — linear"|split:"," %}
  <option value="{{ v }}" {% if d.fluor_od == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-4">
        <label class="form-label fw-semibold small">Fluorescein Staining OS</label>
        <select name="dept_fluor_os" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "Negative — no staining,Superficial punctate staining (SPK),Diffuse SPK inferior 1/3,Diffuse SPK interpalpebral,Dendrite (herpetic ulcer),Geographic ulcer,Stromal infiltrate epithelial defect,Peripheral ulcerative keratitis,Neurotrophic ulcer round defect,Post-op epithelial defect,Abrasion — linear"|split:"," %}
  <option value="{{ v }}" {% if d.fluor_os == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-4">
        <label class="form-label fw-semibold small">Rose Bengal / Lissamine</label>
        <select name="dept_rose_bengal" class="form-select form-select-sm">
  <option value="">—</option>
  {% for v in "Negative,Grade 1+ (mild),Grade 2+ (moderate),Grade 3+ (severe),Oxford Grade 0,Oxford Grade I,Oxford Grade II,Oxford Grade III,Oxford Grade IV,Oxford Grade V,Not performed"|split:"," %}
  <option value="{{ v }}" {% if d.rose_bengal == v %}selected{% endif %}>{{ v }}</option>
  {% endfor %}
</select>
      </div>
      <div class="col-md-6"><label class="form-label fw-semibold small">Tear Film / TBUT (sec)</label><input type="text" name="dept_tbut" value="{{ d.tbut|default:'' }}" class="form-control form-control-sm" placeholder="e.g. 5 sec OD, 4 sec OS"></div>
      <div class="col-md-6"><label class="form-label fw-semibold small">Schirmer Test (mm)</label><input type="text" name="dept_schirmer" value="{{ d.schirmer|default:'' }}" class="form-control form-control-sm" placeholder="e.g. 10mm OD, 8mm OS"></div>
      <div class="col-12"><label class="form-label fw-semibold small">Diagnosis / Corneal Condition</label>
        <textarea name="dept_corneal_diagnosis" rows="2" class="form-control form-control-sm" placeholder="e.g. Keratoconus Stage II OD, Dry Eye Syndrome">{{ d.corneal_diagnosis|default:'' }}</textarea>
      </div>
      <div class="col-12"><label class="form-label fw-semibold small">Treatment Plan</label>
        <select name="dept_corneal_plan" class="form-select form-select-sm">
          <option value="">— Select treatment plan —</option>
          {% for v in "Lubricating drops QDS,Antibiotic drops — Moxifloxacin hourly,Acyclovir ointment 5x/day,Steroid drops — Prednisolone 1% QDS,RGP contact lens fitting,Scleral lens referral,Corneal crosslinking (CXL) planned,PKP referral,DALK referral,DSAEK referral,Urgent corneal graft,Continue current management,Review in 1 week,Review in 1 month,Review in 3 months"|split:"," %}
          <option value="{{ v }}" {% if d.corneal_plan == v %}selected{% endif %}>{{ v }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
  </div>
</div>

{% endwith %}
