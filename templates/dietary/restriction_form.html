{% extends "layouts/base_authenticated.html" %}

{% block title %}Add Dietary Restriction{% endblock %}

{% block content %}
<div class="d-flex align-items-center mb-4">
  <a href="javascript:history.back()" class="btn btn-sm btn-outline-secondary me-3">
    <i class="fas fa-arrow-left"></i>
  </a>
  <h4 class="mb-0">Add Dietary Restriction</h4>
</div>

<div class="card border-0 shadow-sm" style="max-width:500px;">
  <div class="card-header bg-white">
    <strong>Patient:</strong> {{ admission.patient.get_full_name }}
  </div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ request.GET.next }}">
      <div class="mb-3">
        <label class="form-label fw-semibold">Allergy / Intolerance Category</label>
        <select name="category" class="form-select" required>
          {% for val, label in category_choices %}
          <option value="{{ val }}">{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Description</label>
        <input type="text" name="description" class="form-control" placeholder="e.g. Tree nuts — cashews, almonds" required>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Severity</label>
        <select name="severity" class="form-select">
          <option value="MILD">Mild</option>
          <option value="MODERATE">Moderate</option>
          <option value="SEVERE">Severe / Anaphylactic</option>
        </select>
      </div>
      <div class="d-flex justify-content-end gap-2">
        <button type="submit" class="btn btn-warning">Save Restriction</button>
        <a href="javascript:history.back()" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
