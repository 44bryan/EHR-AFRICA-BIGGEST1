<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patient Portal — Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a56db 0%, #0e9f6e 100%);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }
    .login-card {
      background: #fff; border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
      padding: 2.5rem; width: 100%; max-width: 420px;
    }
    .portal-logo {
      width: 64px; height: 64px; border-radius: 50%;
      background: linear-gradient(135deg, #1a56db, #0e9f6e);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.25rem;
    }
  </style>
</head>
<body>
<div class="login-card">
  <div class="portal-logo">
    <i class="bi bi-heart-pulse text-white fs-3"></i>
  </div>
  <h1 class="h4 text-center fw-bold mb-1">Patient Portal</h1>
  <p class="text-center text-muted small mb-4">{{ hospital_name }}</p>

  {% if error %}
  <div class="alert alert-danger py-2 small">{{ error }}</div>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label fw-semibold">Patient ID</label>
      <input type="text" name="patient_id" class="form-control form-control-lg"
             placeholder="e.g. EHR-2024-00001" autocomplete="off" required />
      <div class="form-text">Your patient ID is on your registration card or receipt.</div>
    </div>
    <div class="mb-4">
      <label class="form-label fw-semibold">Date of Birth</label>
      <input type="date" name="date_of_birth" class="form-control form-control-lg" required />
    </div>
    <button type="submit" class="btn btn-primary w-100 btn-lg fw-semibold">
      <i class="bi bi-box-arrow-in-right me-2"></i>Access My Records
    </button>
  </form>

  <hr class="my-4" />
  <p class="text-center text-muted small mb-0">
    <i class="bi bi-shield-lock me-1"></i>
    Your health information is private and secure.
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
