<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Patient Portal{% endblock %} — {% block hospital %}{{ hospital_name|default:"EHR Africa" }}{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    body { background: #f0f4f8; font-family: 'Segoe UI', sans-serif; }
    .portal-nav {
      background: linear-gradient(135deg, #1a56db 0%, #0e9f6e 100%);
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .portal-nav .navbar-brand { color: #fff !important; font-weight: 700; font-size: 1.1rem; }
    .portal-nav .nav-link { color: rgba(255,255,255,0.85) !important; }
    .portal-nav .nav-link:hover, .portal-nav .nav-link.active { color: #fff !important; }
    .portal-card { border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    .stat-box { border-radius: 10px; padding: 1.25rem; text-align: center; }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>

<nav class="navbar navbar-expand-md portal-nav px-3 py-2">
  <a class="navbar-brand" href="{% url 'portal:dashboard' %}">
    <i class="bi bi-heart-pulse me-2"></i>Patient Portal
  </a>
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#portalNav">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="portalNav">
    <ul class="navbar-nav me-auto">
      <li class="nav-item">
        <a class="nav-link {% block nav_dashboard %}{% endblock %}" href="{% url 'portal:dashboard' %}">
          <i class="bi bi-house me-1"></i>Home
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link {% block nav_appts %}{% endblock %}" href="{% url 'portal:appointments' %}">
          <i class="bi bi-calendar-check me-1"></i>Appointments
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link {% block nav_invoices %}{% endblock %}" href="{% url 'portal:invoices' %}">
          <i class="bi bi-receipt me-1"></i>Invoices
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link {% block nav_prescriptions %}{% endblock %}" href="{% url 'portal:prescriptions' %}">
          <i class="bi bi-capsule me-1"></i>Prescriptions
        </a>
      </li>
    </ul>
    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link" href="{% url 'portal:logout' %}">
          <i class="bi bi-box-arrow-right me-1"></i>Logout
        </a>
      </li>
    </ul>
  </div>
</nav>

<div class="container py-4">
  {% if messages %}
  {% for msg in messages %}
  <div class="alert alert-{% if msg.tags == 'error' %}danger{% else %}{{ msg.tags }}{% endif %} alert-dismissible fade show" role="alert">
    {{ msg }}
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  {% endfor %}
  {% endif %}

  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
