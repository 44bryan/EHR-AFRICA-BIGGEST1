<!DOCTYPE html>
<html lang="en" class="{{ modules.system_theme|default:'theme-teal' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="EHR Africa — Ophthalmology Electronic Health Record">
  <title>{% block title %}{% if HOSPITAL_NAME %}{{ HOSPITAL_NAME }}{% else %}EHR Africa{% endif %}{% endblock %}</title>

  <!-- Bootstrap 5 CSS — served locally (works offline / on hospital LAN) -->
  {% load static %}
  <link href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
  <!-- Bootstrap Icons — local -->
  <link href="{% static 'vendor/bootstrap-icons/bootstrap-icons.min.css' %}" rel="stylesheet">
  <!-- Inter font — embedded fallback so it works without internet -->
  <style>
    @font-face {
      font-family: 'Inter';
      src: url("{% static 'vendor/inter/inter.woff2' %}") format('woff2');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
  </style>

  <!-- Override Bootstrap blue → Teal/Cyan -->
  <style>
    :root {
      --bs-primary: #0891b2;
      --bs-primary-rgb: 8,145,178;
      --bs-link-color: #0891b2;
      --bs-link-hover-color: #0e7490;
    }
  </style>

  <!-- Custom CSS -->
  <link href="{% static 'css/custom.css' %}?v=20260802a" rel="stylesheet">
  <link href="{% static 'css/themes.css' %}" rel="stylesheet">
  <!-- Interaction Standards: button placement, filter bars, letterhead, export -->
  <link href="{% static 'css/ehr-standards.css' %}?v=20261020" rel="stylesheet">

  <!-- Global Print Styles -->
  <style>
  @media print {
    @page { size: A4 portrait; margin: 12mm 14mm; }

    /* ── Hide UI chrome ── */
    #sidebar, #sidebar-backdrop, .topbar, .navbar,
    .btn-print, .no-print, .sidebar-link,
    .alert-dismissible .btn-close,
    nav, .pagination, footer,
    #page-content-wrapper > .topbar { display: none !important; }

    /* ── Hide page-header action buttons (keep title) ── */
    #ehr-page-header .btn,
    #ehr-page-header .btn-group,
    #ehr-page-header .dropdown,
    #ehr-page-header form,
    #ehr-page-header a.btn { display: none !important; }

    /* ── Hide filter/search forms inside content ── */
    form.filter-form,
    .filter-bar,
    main > form { display: none !important; }

    /* ── Remove sidebar space — content fills full width ── */
    #wrapper { display: block !important; }
    #page-content-wrapper { margin-left: 0 !important; width: 100% !important; padding: 0 !important; }
    body { background: white !important; font-size: 10pt; color: #000; }
    .container-fluid { padding: 0.5rem !important; }

    /* ── Show letterhead (hidden on screen) ── */
    .ehr-letterhead { display: block !important; }

    /* ── Clean cards and tables ── */
    .card { border: 1px solid #ccc !important; box-shadow: none !important; break-inside: avoid; }
    .card-header { background: #f0f4f8 !important; color: #000 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .badge { border: 1px solid #999; color: #000 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    a { color: #000 !important; text-decoration: none !important; }
    .table { font-size: 8.5pt; }
    .table th, .table td { padding: 3px 6px !important; }
    h1, h2, h3, h4, h5, h6 { color: #000 !important; }
    .shadow-sm, .shadow { box-shadow: none !important; }
    .text-muted { color: #555 !important; }
  }
  </style>

  <!-- ehr-page-css -->{% block extra_css %}{% endblock %}<!-- /ehr-page-css -->

  <!-- Preload critical font -->
  <link rel="preload" href="{% static 'vendor/inter/inter.woff2' %}" as="font" type="font/woff2" crossorigin>
  <!-- Chart.js — locally served (<5ms on LAN), needed by 34+ chart pages -->
  <script src="{% static 'js/vendor/chart.umd.min.js' %}"></script>

  <!-- ── Inline-style font-size fix for tablet readability ──
       custom.css handles class-based font sizes on tablet, but cannot override
       inline style="font-size:.65rem" etc. (inline styles win the cascade).
       These rules use !important to specifically lift tiny inline fonts
       on tablet/touch screens where < 0.75rem is unreadable. -->
  <style>
  @media screen and (max-width: 1366px) {
    [style*="font-size:.6"],   [style*="font-size: .6"],
    [style*="font-size:.70"],  [style*="font-size: .70"],
    [style*="font-size:.71"],  [style*="font-size: .71"],
    [style*="font-size:.72"],  [style*="font-size: .72"],
    [style*="font-size:.73"],  [style*="font-size: .73"],
    [style*="font-size:.74"],  [style*="font-size: .74"] {
      font-size: .82rem !important;
    }
  }
  </style>
</head>
<body class="{% block body_class %}{% endblock %}">

{% block body %}{% endblock %}

<!-- Bootstrap 5 JS — local -->
<script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}" defer></script>
<!-- HTMX — local -->
<script src="{% static 'vendor/htmx.min.js' %}" defer></script>
<!-- Custom JS -->
<script src="{% static 'js/main.js' %}?v=20260921a" defer></script>

<!-- HTMX navigation loading bar -->
<style>
#ehr-progress{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,#0891b2,#06b6d4);z-index:9999;transition:width .2s;display:none;width:0}
#ehr-progress.active{display:block}
</style>
<div id="ehr-progress"></div>
<script>
(function(){
  var bar=document.getElementById('ehr-progress');
  if(!bar)return;
  document.addEventListener('htmx:beforeSend',function(){bar.style.width='30%';bar.classList.add('active');});
  document.addEventListener('htmx:afterSettle',function(){bar.style.width='100%';setTimeout(function(){bar.classList.remove('active');bar.style.width='0';},200);});
  document.addEventListener('htmx:sendError',function(){bar.classList.remove('active');bar.style.width='0';});
})();
</script>

<!-- Chart.js print handler: resize all charts to full width before the print dialog opens -->
<script>
(function () {
  if (typeof window.matchMedia !== 'function') return;
  var mql = window.matchMedia('print');

  function resizeChartsForPrint() {
    if (typeof Chart === 'undefined') return;
    // Resize every registered Chart.js instance to fill its container
    Object.values(Chart.instances).forEach(function (chart) {
      var canvas = chart.canvas;
      var container = canvas.parentElement;
      if (!container) return;
      // Force canvas to fill the container at print width
      canvas.style.width  = '100%';
      canvas.style.height = '340px';
      chart.resize();
    });
  }

  // beforeprint fires in Chrome, Firefox, Edge before the print dialog
  window.addEventListener('beforeprint', resizeChartsForPrint);

  // matchMedia fallback for Safari
  if (mql.addListener) {
    mql.addListener(function (e) { if (e.matches) resizeChartsForPrint(); });
  }
})();
</script>

<!-- Re-initialize charts after HTMX content swap (safety net for HTMX navigation) -->
<script>
document.addEventListener('htmx:afterSettle', function () {
  if (typeof window.__ehrChartInit === 'function') {
    var fn = window.__ehrChartInit;
    window.__ehrChartInit = null;
    fn();
  }
});
</script>

<!-- Fix HTMX boost: extract page-specific CSS from response <head> on soft navigation -->
<script>
(function(){
  var START='<!-- ehr-page-css -->',END='<!-- /ehr-page-css -->';
  document.addEventListener('htmx:beforeSwap',function(evt){
    // Remove old page-specific styles
    document.querySelectorAll('[data-ehr-pagecss]').forEach(function(s){s.remove();});
    var xhr=evt.detail.xhr;
    if(!xhr||!xhr.responseText) return;
    var html=xhr.responseText;
    var si=html.indexOf(START);
    var ei=html.indexOf(END);
    if(si===-1||ei===-1) return;
    var fragment=html.substring(si+START.length,ei);
    if(!fragment.trim()) return;
    // Parse and inject page styles
    var tmp=document.createElement('div');
    tmp.innerHTML=fragment;
    tmp.querySelectorAll('style').forEach(function(s){
      var clone=s.cloneNode(true);
      clone.setAttribute('data-ehr-pagecss','1');
      document.head.appendChild(clone);
    });
  });
})();
</script>

<script>
window.addEventListener('pageshow',function(e){if(e.persisted)location.reload();});
</script>

</body>
</html>
