<!DOCTYPE html>
<html lang="en" class="{{ modules.system_theme|default:'theme-teal' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="EHR Africa — Ophthalmology Electronic Health Record">
  <title>{% block title %}{% if HOSPITAL_NAME %}{{ HOSPITAL_NAME }}{% else %}EHR Africa{% endif %}{% endblock %}</title>

  <!-- Bootstrap 5 CSS — served locally (works offline / on hospital LAN) -->
  {% load static %}
  <link href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
  <!-- Bootstrap Icons — local -->
  <link href="{% static 'vendor/bootstrap-icons/bootstrap-icons.min.css' %}" rel="stylesheet">
  <!-- Inter font — embedded fallback so it works without internet -->
  <style>
    @font-face {
      font-family: 'Inter';
      src: url("{% static 'vendor/inter/inter.woff2' %}") format('woff2');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
  </style>

  <!-- Override Bootstrap blue → Teal/Cyan -->
  <style>
    :root {
      --bs-primary: #0891b2;
      --bs-primary-rgb: 8,145,178;
      --bs-link-color: #0891b2;
      --bs-link-hover-color: #0e7490;
    }
  </style>

  <!-- Custom CSS -->
  <link href="{% static 'css/custom.css' %}?v=20260731b" rel="stylesheet">
  <link href="{% static 'css/themes.css' %}" rel="stylesheet">

  <!-- Global Print Styles -->
  <style>
  @media print {
    /* Hide everything that shouldn't print */
    #sidebar, #sidebar-backdrop, .topbar, .navbar,
    .btn-print, .no-print, .sidebar-link,
    .alert-dismissible .btn-close,
    nav, .pagination, footer,
    #page-content-wrapper > .topbar,
    .breadcrumb-item.active + .breadcrumb-item::before { display: none !important; }

    /* Remove sidebar space */
    #wrapper { display: block !important; }
    #page-content-wrapper { margin-left: 0 !important; width: 100% !important; padding: 0 !important; }
    body { background: white !important; font-size: 11pt; }
    .container-fluid { padding: 0 !important; }

    /* Print header with hospital branding */
    body::before {
      content: "";
      display: block;
      text-align: center;
      padding-bottom: 12px;
      margin-bottom: 16px;
      border-bottom: 2px solid #0891b2;
    }
    .print-header { display: block !important; }

    /* Clean cards for print */
    .card { border: 1px solid #ccc !important; box-shadow: none !important; break-inside: avoid; }
    .card-header { background: #f0f4f8 !important; color: #000 !important; }
    .badge { border: 1px solid #ccc; background: transparent !important; color: #000 !important; }
    a { color: #000 !important; text-decoration: none !important; }
    .table { font-size: 9pt; }
    h1, h2, h3, h4, h5, h6 { color: #000 !important; }
  }
  /* Hide print header on screen */
  .print-header { display: none; }
  </style>

  {% block extra_css %}{% endblock %}

  <!-- ── Inline-style font-size fix for tablet readability ──
       custom.css handles class-based font sizes on tablet, but cannot override
       inline style="font-size:.65rem" etc. (inline styles win the cascade).
       These rules use !important to specifically lift tiny inline fonts
       on tablet/touch screens where < 0.75rem is unreadable. -->
  <style>
  @media screen and (max-width: 1366px) {
    [style*="font-size:.6"],   [style*="font-size: .6"],
    [style*="font-size:.70"],  [style*="font-size: .70"],
    [style*="font-size:.71"],  [style*="font-size: .71"],
    [style*="font-size:.72"],  [style*="font-size: .72"],
    [style*="font-size:.73"],  [style*="font-size: .73"],
    [style*="font-size:.74"],  [style*="font-size: .74"] {
      font-size: .82rem !important;
    }
  }
  </style>
</head>
<body class="{% block body_class %}{% endblock %}">

{% block body %}{% endblock %}

<!-- Bootstrap 5 JS — local -->
<script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
<!-- HTMX — local -->
<script src="{% static 'vendor/htmx.min.js' %}"></script>
<!-- Chart.js — global so all stats/dashboard pages work without per-page script tag -->
<script src="{% static 'js/vendor/chart.umd.min.js' %}"></script>
<!-- Custom JS -->
<script src="{% static 'js/main.js' %}?v=20260731d"></script>

<!-- Chart.js print handler: resize all charts to full width before the print dialog opens -->
<script>
(function () {
  if (typeof window.matchMedia !== 'function') return;
  var mql = window.matchMedia('print');

  function resizeChartsForPrint() {
    if (typeof Chart === 'undefined') return;
    // Resize every registered Chart.js instance to fill its container
    Object.values(Chart.instances).forEach(function (chart) {
      var canvas = chart.canvas;
      var container = canvas.parentElement;
      if (!container) return;
      // Force canvas to fill the container at print width
      canvas.style.width  = '100%';
      canvas.style.height = '340px';
      chart.resize();
    });
  }

  // beforeprint fires in Chrome, Firefox, Edge before the print dialog
  window.addEventListener('beforeprint', resizeChartsForPrint);

  // matchMedia fallback for Safari
  if (mql.addListener) {
    mql.addListener(function (e) { if (e.matches) resizeChartsForPrint(); });
  }
})();
</script>

<!-- Re-initialize charts after HTMX content swap (safety net for HTMX navigation) -->
<script>
document.addEventListener('htmx:afterSettle', function () {
  if (typeof window.__ehrChartInit === 'function') {
    var fn = window.__ehrChartInit;
    window.__ehrChartInit = null;
    fn();
  }
});
</script>

</body>
</html>
