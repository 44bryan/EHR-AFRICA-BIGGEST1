<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="EHR Africa — Ophthalmology Electronic Health Record">
  <title>{% block title %}{% if HOSPITAL_NAME %}{{ HOSPITAL_NAME }}{% else %}EHR Africa{% endif %}{% endblock %}</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Override Bootstrap blue → Teal/Cyan -->
  <style>
    :root {
      --bs-primary: #0891b2;
      --bs-primary-rgb: 8,145,178;
      --bs-link-color: #0891b2;
      --bs-link-hover-color: #0e7490;
    }
  </style>

  <!-- Custom CSS -->
  {% load static %}
  <link href="{% static 'css/custom.css' %}" rel="stylesheet">

  <!-- Global Print Styles -->
  <style>
  @media print {
    /* Hide everything that shouldn't print */
    #sidebar, #sidebar-backdrop, .topbar, .navbar,
    .btn-print, .no-print, .sidebar-link,
    .alert-dismissible .btn-close,
    nav, .pagination, footer,
    #page-content-wrapper > .topbar,
    .breadcrumb-item.active + .breadcrumb-item::before { display: none !important; }

    /* Remove sidebar space */
    #wrapper { display: block !important; }
    #page-content-wrapper { margin-left: 0 !important; width: 100% !important; padding: 0 !important; }
    body { background: white !important; font-size: 11pt; }
    .container-fluid { padding: 0 !important; }

    /* Print header with hospital branding */
    body::before {
      content: "";
      display: block;
      text-align: center;
      padding-bottom: 12px;
      margin-bottom: 16px;
      border-bottom: 2px solid #0891b2;
    }
    .print-header { display: block !important; }

    /* Clean cards for print */
    .card { border: 1px solid #ccc !important; box-shadow: none !important; break-inside: avoid; }
    .card-header { background: #f0f4f8 !important; color: #000 !important; }
    .badge { border: 1px solid #ccc; background: transparent !important; color: #000 !important; }
    a { color: #000 !important; text-decoration: none !important; }
    .table { font-size: 9pt; }
    h1, h2, h3, h4, h5, h6 { color: #000 !important; }
  }
  /* Hide print header on screen */
  .print-header { display: none; }
  </style>

  {% block extra_css %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">

{% block body %}{% endblock %}

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- HTMX -->
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<!-- Custom JS -->
<script src="{% static 'js/main.js' %}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
