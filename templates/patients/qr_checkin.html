<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Self Check-In — Eye Clinic</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { background: linear-gradient(135deg,#6366f1 0%,#8b5cf6 100%); min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:'Segoe UI',sans-serif; }
    .card { border-radius:16px; max-width:480px; width:100%; }
    .tab-btn { border:none; background:transparent; padding:.5rem 1rem; border-radius:8px; font-weight:600; color:#6c757d; }
    .tab-btn.active { background:#6366f1; color:#fff; }
    .form-control { border-radius:10px; }
    .btn-primary { background:#6366f1; border-color:#6366f1; border-radius:10px; }
    .btn-primary:hover { background:#4f46e5; border-color:#4f46e5; }
  </style>
</head>
<body>
<div class="container py-4">
  <div class="card shadow-lg mx-auto">
    <div class="card-body p-4">

      <!-- Header -->
      <div class="text-center mb-4">
        <div class="rounded-circle d-inline-flex align-items-center justify-content-center mb-3"
             style="width:60px;height:60px;background:linear-gradient(135deg,#6366f1,#8b5cf6);">
          <i class="bi bi-camera-fill text-white fs-3"></i>
        </div>
        <h4 class="fw-bold mb-1">Self Check-In</h4>
        <p class="text-muted small mb-0">Welcome to the Eye Clinic. Please check in below.</p>
      </div>

      {% if error %}
      <div class="alert alert-danger border-0 rounded-3 small">
        <i class="bi bi-exclamation-triangle me-2"></i>{{ error }}
      </div>
      {% endif %}

      <!-- Tab switcher -->
      <div class="d-flex gap-1 mb-4 p-1 rounded-3" style="background:#f1f3f5;">
        <button class="tab-btn active flex-fill" id="tab-existing" onclick="switchTab('existing')">
          <i class="bi bi-person-check me-1"></i>Returning Patient
        </button>
        <button class="tab-btn flex-fill" id="tab-new" onclick="switchTab('new')">
          <i class="bi bi-person-plus me-1"></i>New Patient
        </button>
      </div>

      <!-- ── Returning patient form ─────────────────────────────────────── -->
      <div id="form-existing">
        {% if patient %}
        <!-- Pre-filled from QR -->
        <div class="alert alert-success border-0 rounded-3 mb-3 d-flex align-items-center gap-2">
          <i class="bi bi-person-check-fill fs-5"></i>
          <div>
            <strong>{{ patient.full_name }}</strong><br>
            <span class="small text-muted">ID: {{ patient.patient_id }}</span>
          </div>
        </div>
        <form method="post">
          {% csrf_token %}
          <input type="hidden" name="action" value="existing">
          <input type="hidden" name="lookup" value="{{ patient.patient_id }}">
          <div class="mb-3">
            <label class="form-label small fw-semibold">Chief Complaint / Reason for Visit</label>
            <textarea name="chief_complaint" class="form-control" rows="2"
                      placeholder="e.g. Blurry vision, eye pain…"></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold">Visit Type</label>
            <select name="visit_type" class="form-select">
              <option value="NEW">New Complaint</option>
              <option value="FOLLOW_UP">Follow-Up</option>
              <option value="REVIEW">Review</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
            <i class="bi bi-check-circle me-2"></i>Confirm Check-In
          </button>
        </form>
        {% else %}
        <form method="post">
          {% csrf_token %}
          <input type="hidden" name="action" value="existing">
          <div class="mb-3">
            <label class="form-label small fw-semibold">Patient ID or Phone Number</label>
            <input type="text" name="lookup" class="form-control form-control-lg"
                   placeholder="e.g. EYE-00123 or 0677…"
                   value="{{ lookup|default:'' }}" autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold">Chief Complaint</label>
            <textarea name="chief_complaint" class="form-control" rows="2"
                      placeholder="e.g. Blurry vision…"></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold">Visit Type</label>
            <select name="visit_type" class="form-select">
              <option value="NEW">New Complaint</option>
              <option value="FOLLOW_UP">Follow-Up</option>
              <option value="REVIEW">Review</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
            <i class="bi bi-check-circle me-2"></i>Check In
          </button>
        </form>
        {% endif %}
      </div>

      <!-- ── New patient form ───────────────────────────────────────────── -->
      <div id="form-new" style="display:none;">
        <form method="post">
          {% csrf_token %}
          <input type="hidden" name="action" value="new">
          <div class="row g-2 mb-2">
            <div class="col-6">
              <label class="form-label small fw-semibold">First Name *</label>
              <input type="text" name="first_name" class="form-control" required>
            </div>
            <div class="col-6">
              <label class="form-label small fw-semibold">Last Name *</label>
              <input type="text" name="last_name" class="form-control" required>
            </div>
          </div>
          <div class="mb-2">
            <label class="form-label small fw-semibold">Phone Number *</label>
            <input type="tel" name="phone_number" class="form-control" placeholder="06 / 07 / 23 / 22…" required>
          </div>
          <div class="row g-2 mb-2">
            <div class="col-6">
              <label class="form-label small fw-semibold">Date of Birth</label>
              <input type="date" name="date_of_birth" class="form-control">
            </div>
            <div class="col-6">
              <label class="form-label small fw-semibold">Gender</label>
              <select name="gender" class="form-select">
                <option value="M">Male</option>
                <option value="F">Female</option>
              </select>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold">Chief Complaint</label>
            <textarea name="chief_complaint" class="form-control" rows="2"
                      placeholder="Describe your eye problem…"></textarea>
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
            <i class="bi bi-person-plus me-2"></i>Register &amp; Check In
          </button>
        </form>
      </div>

      <div class="text-center mt-3 text-muted small">
        <i class="bi bi-lock-fill me-1"></i>Your data is private and secure.
      </div>
    </div>
  </div>
</div>

<script>
function switchTab(tab) {
  document.getElementById('form-existing').style.display = tab === 'existing' ? '' : 'none';
  document.getElementById('form-new').style.display = tab === 'new' ? '' : 'none';
  document.getElementById('tab-existing').classList.toggle('active', tab === 'existing');
  document.getElementById('tab-new').classList.toggle('active', tab === 'new');
}
{% if new_patient %}switchTab('new');{% endif %}
</script>
</body>
</html>
