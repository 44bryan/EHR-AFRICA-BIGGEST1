{% extends "layouts/base_authenticated.html" %}
{% block title %}Update Visit Status{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-5"><div class="card mb-3 border-0 shadow-sm"><div class="card-header bg-white"><h5 class="mb-0 fw-semibold">Update Visit Status: {{ visit.visit_number }}</h5></div><div class="card-body"><p class="text-muted">Patient: <strong>{{ visit.patient.full_name }}</strong><br>Current Status: <strong>{{ visit.get_status_display }}</strong></p><form method="post">{% csrf_token %}<div class="mb-4"><label class="form-label fw-semibold">New Status</label><select name="status" class="form-select">{% for code, label in statuses %}<option value="{{ code }}" {% if visit.status == code %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div><div class="d-grid"><button type="submit" class="btn btn-primary">Update</button></div></form></div></div><div class="text-center mt-3"><a href="{% url 'opd:visit_detail' visit.id %}" class="text-muted"><i class="bi bi-arrow-left me-1"></i>Back</a></div></div></div>
{% endblock %}
