{% extends "layouts/base_authenticated.html" %}
{% block title %}Update Order Status{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-5"><div class="card mb-3 border-0 shadow-sm"><div class="card-header bg-white"><h5 class="mb-0 fw-semibold">Update Order Status: {{ order.order_number }}</h5></div><div class="card-body"><form method="post">{% csrf_token %}<div class="mb-4"><label class="form-label fw-semibold">New Status</label><select name="status" class="form-select">{% for code, label in statuses %}<option value="{{ code }}" {% if order.status == code %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div><div class="d-grid"><button type="submit" class="btn btn-primary">Update Status</button></div></form></div></div><div class="text-center mt-3"><a href="{% url 'opticals:order_detail' order.id %}" class="text-muted"><i class="bi bi-arrow-left me-1"></i>Back</a></div></div></div>
{% endblock %}
