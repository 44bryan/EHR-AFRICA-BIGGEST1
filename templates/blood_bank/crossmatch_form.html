{% extends "layouts/base_authenticated.html" %}
{% block title %}Request Cross-Match{% endblock %}
{% block page_header %}<h5 class="mb-0 fw-bold">Request Cross-Match</h5>{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <form method="post" class="card border-0 shadow-sm">
      {% csrf_token %}
      <div class="card-body">
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label fw-semibold">Patient <span class="text-danger">*</span></label>
            <select name="patient" class="form-select" required>
              <option value="">— Select patient —</option>
              {% for p in patients %}<option value="{{ p.pk }}">{{ p.full_name }} ({{ p.patient_id }})</option>{% endfor %}
            </select>
          </div>
          <div class="col-12">
            <label class="form-label fw-semibold">Blood Unit (Available &amp; Screened) <span class="text-danger">*</span></label>
            <select name="blood_unit" class="form-select" required>
              <option value="">— Select unit —</option>
              {% for u in available_units %}
              <option value="{{ u.pk }}">{{ u.unit_number }} — {{ u.blood_group }} {{ u.get_product_display }} (exp: {{ u.expiry_date }})</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-12">
            <label class="form-label">Notes</label>
            <textarea name="notes" class="form-control" rows="2"></textarea>
          </div>
        </div>
      </div>
      <div class="card-footer bg-transparent d-flex gap-2">
        <button type="submit" class="btn btn-warning text-dark"><i class="bi bi-intersect me-1"></i>Submit Request</button>
        <a href="{% url 'blood_bank:crossmatch_list' %}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
