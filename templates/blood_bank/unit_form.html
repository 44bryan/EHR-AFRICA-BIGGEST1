{% extends "layouts/base_authenticated.html" %}
{% block title %}Add Blood Unit{% endblock %}
{% block page_header %}<h5 class="mb-0 fw-bold">Add Blood Unit to Inventory</h5>{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <form method="post" class="card border-0 shadow-sm">
      {% csrf_token %}
      <div class="card-header bg-light fw-semibold py-2">Unit Details</div>
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label fw-semibold">Blood Group <span class="text-danger">*</span></label>
            <select name="blood_group" class="form-select" required>
              <option value="">— Select —</option>
              {% for val, label in blood_groups %}<option value="{{ val }}">{{ label }}</option>{% endfor %}
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">Product <span class="text-danger">*</span></label>
            <select name="product" class="form-select" required>
              {% for val, label in products %}<option value="{{ val }}">{{ label }}</option>{% endfor %}
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Volume (mL)</label>
            <input type="number" name="volume_ml" class="form-control" value="450" min="1">
          </div>
          <div class="col-md-4">
            <label class="form-label">Donor (optional)</label>
            <select name="donor" class="form-select">
              <option value="">— Anonymous —</option>
              {% for d in donors %}<option value="{{ d.pk }}">{{ d.donor_id }} — {{ d.full_name }} ({{ d.blood_group }})</option>{% endfor %}
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Collection Date</label>
            <input type="date" name="collection_date" class="form-control" value="{{ today|date:'Y-m-d' }}">
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">Expiry Date <span class="text-danger">*</span></label>
            <input type="date" name="expiry_date" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Storage Location</label>
            <input type="text" name="storage_location" class="form-control" placeholder="e.g. Fridge A, Shelf 2">
          </div>
        </div>
        <hr>
        <div class="fw-semibold mb-2">Screening Tests</div>
        <div class="row g-2">
          {% for field, label in tests %}
          {% endfor %}
          <div class="col-md-4"><div class="form-check"><input type="checkbox" name="hiv_tested" class="form-check-input" id="hiv"><label class="form-check-label" for="hiv">HIV Tested</label></div></div>
          <div class="col-md-4"><div class="form-check"><input type="checkbox" name="hbsag_tested" class="form-check-input" id="hb"><label class="form-check-label" for="hb">HBsAg Tested</label></div></div>
          <div class="col-md-4"><div class="form-check"><input type="checkbox" name="hcv_tested" class="form-check-input" id="hcv"><label class="form-check-label" for="hcv">HCV Tested</label></div></div>
          <div class="col-md-4"><div class="form-check"><input type="checkbox" name="syphilis_tested" class="form-check-input" id="syph"><label class="form-check-label" for="syph">Syphilis Tested</label></div></div>
          <div class="col-md-4"><div class="form-check"><input type="checkbox" name="malaria_tested" class="form-check-input" id="mal"><label class="form-check-label" for="mal">Malaria Tested</label></div></div>
          <div class="col-md-4">
            <div class="form-check">
              <input type="checkbox" name="all_negative" class="form-check-input" id="neg">
              <label class="form-check-label text-success fw-semibold" for="neg">All Tests NEGATIVE — Unit Safe</label>
            </div>
          </div>
        </div>
        <div class="mt-3">
          <label class="form-label">Notes</label>
          <textarea name="notes" class="form-control" rows="2"></textarea>
        </div>
      </div>
      <div class="card-footer bg-transparent d-flex gap-2">
        <button type="submit" class="btn btn-danger">Add to Inventory</button>
        <a href="{% url 'blood_bank:unit_list' %}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
