{% extends "layouts/base_authenticated.html" %}
{% block title %}New Outreach Activity{% endblock %}
{% block content %}
<div class="d-flex align-items-center gap-3 mb-4">
  <a href="{% url 'outreach:dashboard' %}" class="btn btn-sm btn-outline-secondary">
    <i class="bi bi-arrow-left"></i>
  </a>
  <h5 class="fw-bold mb-0">New Outreach Activity</h5>
</div>

<form method="post">
{% csrf_token %}
<div class="row g-4">
  <div class="col-md-8">
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-white border-bottom py-2">
        <h6 class="mb-0 fw-bold small text-success"><i class="bi bi-info-circle me-1"></i>Activity Details</h6>
      </div>
      <div class="card-body">
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label fw-semibold small">Activity Title *</label>
            <input type="text" name="title" class="form-control form-control-sm" required
                   placeholder="e.g. Biyem-Assi Community Eye Camp 2026">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold small">Activity Type *</label>
            <select name="activity_type" class="form-select form-select-sm" required>
              {% for val,label in type_choices %}
              <option value="{{ val }}">{{ label }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label fw-semibold small">Date *</label>
            <input type="date" name="activity_date" class="form-control form-control-sm" required>
          </div>
          <div class="col-md-3">
            <label class="form-label fw-semibold small">End Date (multi-day)</label>
            <input type="date" name="end_date" class="form-control form-control-sm">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold small">Location Name *</label>
            <input type="text" name="location_name" class="form-control form-control-sm" required
                   placeholder="School / Village / Company name">
          </div>
          <div class="col-md-3">
            <label class="form-label fw-semibold small">Region</label>
            <input type="text" name="region" class="form-control form-control-sm" placeholder="e.g. Centre Region">
          </div>
          <div class="col-md-3">
            <label class="form-label fw-semibold small">Town</label>
            <input type="text" name="town" class="form-control form-control-sm">
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold small">Start Time</label>
            <input type="time" name="start_time" class="form-control form-control-sm">
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold small">End Time</label>
            <input type="time" name="end_time" class="form-control form-control-sm">
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold small">Team Leader</label>
            <select name="team_leader" class="form-select form-select-sm">
              <option value="">— Select —</option>
              {% for s in staff %}
              <option value="{{ s.pk }}">{{ s.get_full_name }} ({{ s.get_role_display }})</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-12">
            <label class="form-label fw-semibold small">Objectives</label>
            <textarea name="objectives" class="form-control form-control-sm" rows="3"
                      placeholder="What this activity aims to achieve..."></textarea>
          </div>
          <div class="col-12">
            <label class="form-label fw-semibold small">Equipment / Supplies Needed</label>
            <textarea name="equipment_notes" class="form-control form-control-sm" rows="2"
                      placeholder="Equipment to bring: slit lamp, VA charts, glasses, drugs..."></textarea>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="col-md-4">
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-transparent py-2">
        <h6 class="mb-0 fw-bold small"><i class="bi bi-building me-1"></i>Partner / Sponsor</h6>
      </div>
      <div class="card-body">
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label fw-semibold small">Partner Organisation</label>
            <input type="text" name="partner_org" class="form-control form-control-sm"
                   placeholder="NGO, Government, Church...">
          </div>
          <div class="col-12">
            <label class="form-label fw-semibold small">Sponsor</label>
            <input type="text" name="sponsor" class="form-control form-control-sm">
          </div>
          <div class="col-12">
            <label class="form-label fw-semibold small">Sponsor Amount (FCFA)</label>
            <input type="number" name="sponsor_amount" class="form-control form-control-sm"
                   min="0" value="0">
          </div>
          <div class="col-12">
            <label class="form-label fw-semibold small">Vehicle / Transport</label>
            <input type="text" name="vehicle_details" class="form-control form-control-sm"
                   placeholder="e.g. Hospital van — plate CE-123-YAO">
          </div>
        </div>
      </div>
    </div>
    <div class="d-grid gap-2 mt-3">
      <button type="submit" class="btn btn-success">
        <i class="bi bi-check-circle me-1"></i>Create Activity
      </button>
      <a href="{% url 'outreach:dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
    </div>
  </div>
</div>
</form>
{% endblock %}
