{% extends "layouts/base_authenticated.html" %}
{% block title %}Edit — {{ act.title }}{% endblock %}
{% block content %}
<div class="d-flex align-items-center gap-3 mb-4">
  <a href="{% url 'outreach:detail' pk=act.pk %}" class="btn btn-sm btn-outline-secondary">
    <i class="bi bi-arrow-left"></i>
  </a>
  <h5 class="fw-bold mb-0">Edit: {{ act.title }}</h5>
</div>
<form method="post">
{% csrf_token %}
<div class="card border-0 shadow-sm">
  <div class="card-body">
    <div class="row g-3">
      <div class="col-12">
        <label class="form-label fw-semibold small">Title *</label>
        <input type="text" name="title" class="form-control form-control-sm" value="{{ act.title }}" required>
      </div>
      <div class="col-md-4">
        <label class="form-label fw-semibold small">Type</label>
        <select name="activity_type" class="form-select form-select-sm">
          {% for val,label in type_choices %}
          <option value="{{ val }}" {% if act.activity_type == val %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label fw-semibold small">Status</label>
        <select name="status" class="form-select form-select-sm">
          {% for val,label in status_choices %}
          <option value="{{ val }}" {% if act.status == val %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label fw-semibold small">Date</label>
        <input type="date" name="activity_date" class="form-control form-control-sm" value="{{ act.activity_date }}">
      </div>
      <div class="col-md-4">
        <label class="form-label fw-semibold small">End Date</label>
        <input type="date" name="end_date" class="form-control form-control-sm" value="{{ act.end_date|default:'' }}">
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold small">Location Name</label>
        <input type="text" name="location_name" class="form-control form-control-sm" value="{{ act.location_name }}">
      </div>
      <div class="col-md-3">
        <label class="form-label fw-semibold small">Region</label>
        <input type="text" name="region" class="form-control form-control-sm" value="{{ act.region }}">
      </div>
      <div class="col-md-3">
        <label class="form-label fw-semibold small">Town</label>
        <input type="text" name="town" class="form-control form-control-sm" value="{{ act.town }}">
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold small">Partner Organisation</label>
        <input type="text" name="partner_org" class="form-control form-control-sm" value="{{ act.partner_org }}">
      </div>
      <div class="col-md-3">
        <label class="form-label fw-semibold small">Sponsor</label>
        <input type="text" name="sponsor" class="form-control form-control-sm" value="{{ act.sponsor }}">
      </div>
      <div class="col-md-3">
        <label class="form-label fw-semibold small">Sponsor Amount (FCFA)</label>
        <input type="number" name="sponsor_amount" class="form-control form-control-sm" value="{{ act.sponsor_amount }}">
      </div>
      <div class="col-12">
        <label class="form-label fw-semibold small">Objectives</label>
        <textarea name="objectives" class="form-control form-control-sm" rows="2">{{ act.objectives }}</textarea>
      </div>
      <div class="col-12">
        <label class="form-label fw-semibold small">Notes</label>
        <textarea name="notes" class="form-control form-control-sm" rows="3">{{ act.notes }}</textarea>
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold small">Challenges</label>
        <textarea name="challenges" class="form-control form-control-sm" rows="3">{{ act.challenges }}</textarea>
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold small">Recommendations</label>
        <textarea name="recommendations" class="form-control form-control-sm" rows="3">{{ act.recommendations }}</textarea>
      </div>
    </div>
  </div>
  <div class="card-footer bg-transparent d-flex gap-2 justify-content-end">
    <a href="{% url 'outreach:detail' pk=act.pk %}" class="btn btn-secondary btn-sm">Cancel</a>
    <button type="submit" class="btn btn-primary btn-sm">Save Changes</button>
  </div>
</div>
</form>
{% endblock %}
