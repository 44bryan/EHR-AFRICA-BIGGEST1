{% extends "layouts/base_authenticated.html" %}
{% block title %}Collect Sample{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-5">
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-white py-3">
        <h5 class="mb-0 fw-semibold">Collect Sample</h5>
        <div class="text-muted small">Patient: <strong>{{ order.patient.full_name }}</strong></div>
      </div>
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          {% for field in form %}<div class="mb-3"><label class="form-label fw-semibold">{{ field.label }}</label>{{ field }}</div>{% endfor %}
          <div class="d-flex gap-2 justify-content-end">
            <a href="{% url 'laboratory:detail' order.pk %}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-warning"><i class="bi bi-check-circle me-1"></i>Confirm Collection</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
