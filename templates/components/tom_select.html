{% load static %}
{# Include this in the extra_js block to enable searchable dropdowns.
   Add class="ts-select" to any select that needs search/filter. #}
<link rel="stylesheet" href="{% static 'vendor/tom-select/tom-select.bootstrap5.min.css' %}">
<script src="{% static 'vendor/tom-select/tom-select.complete.min.js' %}"></script>
<script>
document.querySelectorAll('select.ts-select').forEach(function(el){
  new TomSelect(el, {
    create: false,
    sortField: {field: 'text', direction: 'asc'},
    plugins: ['dropdown_input'],
    maxOptions: 500,
  });
});
</script>
