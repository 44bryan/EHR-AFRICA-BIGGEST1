{% if messages %}
<div id="ehr-alerts" style="position:fixed;top:16px;right:16px;z-index:9999;max-width:420px;width:100%;">
  {% for message in messages %}
  {% with tag=message.tags %}
  <div class="alert alert-dismissible fade show d-flex align-items-center gap-2 shadow-sm ehr-auto-alert"
       style="border-radius:10px;border:none;font-size:0.84rem;padding:12px 16px;margin-bottom:8px;
              {% if tag == 'success' %}background:#dcfce7;color:#15803d;{% elif tag == 'error' or tag == 'danger' %}background:#fee2e2;color:#b91c1c;{% elif tag == 'warning' %}background:#fef9c3;color:#92400e;{% else %}background:#ecfeff;color:#0e7490;{% endif %}"
       role="alert">
    <i class="bi {% if tag == 'success' %}bi-check-circle-fill{% elif tag == 'error' or tag == 'danger' %}bi-exclamation-triangle-fill{% elif tag == 'warning' %}bi-exclamation-circle-fill{% else %}bi-info-circle-fill{% endif %}" style="flex-shrink:0;"></i>
    <span class="flex-grow-1">{{ message }}</span>
    <button type="button" class="btn-close btn-close-sm ms-2" data-bs-dismiss="alert" style="font-size:0.65rem;"></button>
  </div>
  {% endwith %}
  {% endfor %}
</div>
<script>
(function(){
  var alerts=document.querySelectorAll('.ehr-auto-alert');
  alerts.forEach(function(el){
    setTimeout(function(){
      if(el&&el.parentNode){
        el.style.transition='opacity .4s ease';
        el.style.opacity='0';
        setTimeout(function(){try{el.remove();}catch(e){}},500);
      }
    },5000);
  });
})();
</script>
{% endif %}
