{% extends "layouts/base_authenticated.html" %}
{% block title %}New Payroll Run{% endblock %}
{% block content %}
<div class="row justify-content-center">
<div class="col-lg-5 col-md-7">
<div class="card mb-3 border-0 shadow-sm">
  <div class="card-header bg-white border-bottom">
    <h5 class="mb-0 fw-bold"><i class="bi bi-plus-circle me-2"></i>New Payroll Run</h5>
  </div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label fw-semibold">Month <span class="text-danger">*</span></label>
        <select name="month" class="form-select" required>
          {% for num, name in months %}
          <option value="{{ num }}" {% if num == current_month %}selected{% endif %}>{{ name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Year <span class="text-danger">*</span></label>
        <input type="number" name="year" class="form-control" value="{{ current_year }}" min="2020" max="2099" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Description</label>
        <input type="text" name="description" class="form-control" placeholder="e.g. October 2026 — Full Staff">
      </div>
      <div class="d-flex gap-2 justify-content-end">
        <a href="{% url 'payroll:run_list' %}" class="btn btn-outline-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i>Create Run</button>
      </div>
    </form>
  </div>
</div>
</div>
</div>
{% endblock %}
