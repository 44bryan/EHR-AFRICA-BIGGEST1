{% extends "layouts/base_authenticated.html" %}
{% block title %}{{ action }} Pay Component{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6 col-md-8">
<div class="card border-0 shadow-sm">
  <div class="card-header bg-white border-bottom">
    <h5 class="mb-0 fw-bold">{{ action }} Pay Component</h5>
  </div>
  <div class="card-body">
    <form method="post">{% csrf_token %}
      <div class="row g-3">
        <div class="col-md-7">
          <label class="form-label fw-semibold small">Name <span class="text-danger">*</span></label>
          <input type="text" name="name" class="form-control" required>
        </div>
        <div class="col-md-5">
          <label class="form-label fw-semibold small">Code <span class="text-danger">*</span></label>
          <input type="text" name="code" class="form-control text-uppercase" required placeholder="e.g. HOUSING_ALLOW">
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold small">Type <span class="text-danger">*</span></label>
          <select name="component_type" class="form-select" required>
            {% for value, label in component_types %}
            <option value="{{ value }}">{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold small">Default Amount</label>
          <input type="number" name="default_amount" class="form-control" value="0" step="1" min="0">
        </div>
        <div class="col-12">
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" name="is_percentage" id="isPercentage">
            <label class="form-check-label" for="isPercentage">Amount is % of Basic Salary</label>
          </div>
        </div>
        <div class="col-12">
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" name="is_taxable" id="isTaxable" checked>
            <label class="form-check-label" for="isTaxable">Taxable</label>
          </div>
        </div>
      </div>
      <div class="d-flex gap-2 justify-content-end mt-3">
        <a href="{% url 'payroll:component_list' %}" class="btn btn-outline-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary">Save Component</button>
      </div>
    </form>
  </div>
</div>
</div></div>
{% endblock %}
