{% extends "layouts/base_authenticated.html" %}
{% block title %}{{ action }} Salary Structure{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6 col-md-8">
<div class="card mb-3 border-0 shadow-sm">
  <div class="card-header bg-white border-bottom">
    <h5 class="mb-0 fw-bold">{{ action }} Salary Structure</h5>
  </div>
  <div class="card-body">
    <form method="post">{% csrf_token %}
      <input type="hidden" name="action" value="save_structure">
      <div class="mb-3">
        <label class="form-label fw-semibold">Name <span class="text-danger">*</span></label>
        <input type="text" name="name" class="form-control" value="{{ structure.name|default:'' }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Description</label>
        <textarea name="description" class="form-control" rows="2">{{ structure.description|default:'' }}</textarea>
      </div>
      <div class="d-flex gap-2 justify-content-end">
        <a href="{% url 'payroll:structure_list' %}" class="btn btn-outline-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>
</div></div>
{% endblock %}
