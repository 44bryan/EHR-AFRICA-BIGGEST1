<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Feedback - {{ modules.hospital_name|default:HOSPITAL_NAME }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7">
      <div class="text-center mb-4">
        <h2 class="fw-bold">Share Your Experience</h2>
        <p class="text-muted">Your feedback helps us improve our services</p>
      </div>
      <div class="card mb-3 border-0 shadow-sm">
        <div class="card-body p-4">
          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label fw-semibold">Your Name</label>
              <input type="text" name="name" class="form-control" placeholder="Optional">
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Feedback Type</label>
              <select name="feedback_type" class="form-select" required>
                {% for code, label in feedback_types %}<option value="{{ code }}">{{ label }}</option>{% endfor %}
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Overall Experience (1-5)</label>
              <div class="d-flex gap-3 fs-3">
                {% for i in "12345" %}
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="overall_rating" value="{{ i }}" id="r{{ i }}">
                  <label class="form-check-label" for="r{{ i }}">{{ i }}</label>
                </div>
                {% endfor %}
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">How likely are you to recommend us? (0-10)</label>
              <input type="range" name="nps_score" class="form-range" min="0" max="10" step="1" oninput="document.getElementById('nps_val').textContent = this.value">
              <div class="text-center"><span id="nps_val">5</span></div>
            </div>
            <div class="mb-4">
              <label class="form-label fw-semibold">Your Message <span class="text-danger">*</span></label>
              <textarea name="message" class="form-control" rows="4" required placeholder="Tell us about your experience..."></textarea>
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-primary btn-lg">Submit Feedback</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
