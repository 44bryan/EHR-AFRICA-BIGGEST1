{% extends "layouts/base_authenticated.html" %}
{% block title %}Add Schedule Slot{% endblock %}

{% block page_header %}
<div class="d-flex align-items-center justify-content-between flex-wrap gap-2 gap-3 mb-4">
  <a href="{% url 'appointments:schedule_list' %}" class="btn btn-sm btn-outline-secondary">
  </a>
  <div>
    <h4 class="fw-bold mb-0">Add Schedule Slot</h4>
    <p class="text-muted small mb-0">Define when a doctor holds their clinic</p>
  </div>
</div>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card border-0 shadow-sm">
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold">Doctor <span class="text-danger">*</span></label>
            <select name="doctor" class="form-select" required>
              <option value="">— Select Doctor —</option>
              {% for d in doctors %}
              <option value="{{ d.pk }}">{{ d.full_name }} ({{ d.get_role_display }})</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Department <span class="text-danger">*</span></label>
            <select name="department" class="form-select" required>
              <option value="">— Select Department —</option>
              {% for dept in departments %}
              <option value="{{ dept.pk }}">{{ dept.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Day of Week <span class="text-danger">*</span></label>
            <select name="day_of_week" class="form-select" required>
              {% for num, name in weekdays %}
              <option value="{{ num }}">{{ name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Start Time <span class="text-danger">*</span></label>
              <input type="time" name="start_time" class="form-control" value="08:00" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">End Time <span class="text-danger">*</span></label>
              <input type="time" name="end_time" class="form-control" value="17:00" required>
            </div>
          </div>
          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Slot Duration (minutes)</label>
              <input type="number" name="slot_duration_minutes" class="form-control" value="30" min="5" max="120">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Max Patients per Session</label>
              <input type="number" name="max_patients" class="form-control" value="20" min="1">
            </div>
          </div>
          <div class="d-flex gap-2 justify-content-end">
            <a href="{% url 'appointments:schedule_list' %}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-calendar-check me-1"></i>Save Schedule
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
