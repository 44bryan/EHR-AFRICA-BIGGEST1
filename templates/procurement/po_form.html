{% extends "layouts/base_authenticated.html" %}
{% block title %}New Purchase Order{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7 col-md-9">
<div class="card border-0 shadow-sm">
  <div class="card-header bg-white border-bottom">
    <h5 class="mb-0 fw-bold"><i class="bi bi-bag-plus me-2"></i>New Purchase Order</h5>
  </div>
  <div class="card-body">
    <form method="post">{% csrf_token %}
      <div class="mb-3">
        <label class="form-label fw-semibold">Vendor <span class="text-danger">*</span></label>
        <select name="vendor_id" class="form-select" required>
          <option value="">-- Select Vendor --</option>
          {% for v in vendors %}<option value="{{ v.pk }}">{{ v.name }}</option>{% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Linked Purchase Request</label>
        <select name="pr_id" class="form-select">
          <option value="">-- None (manual PO) --</option>
          {% for pr in approved_prs %}<option value="{{ pr.pk }}" {% if request.GET.pr == pr.pk|stringformat:'s' %}selected{% endif %}>{{ pr.pr_number }} — {{ pr.title }}</option>{% endfor %}
        </select>
        <div class="form-text text-muted">If selected, PO items will be auto-populated from the PR.</div>
      </div>
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold">Expected Delivery Date</label>
          <input type="date" name="expected_delivery_date" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Delivery Address</label>
          <input type="text" name="delivery_address" class="form-control" value="AEF/{{ modules.hospital_name|default:HOSPITAL_NAME }} — Yaoundé, Cameroon">
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Payment Terms</label>
        <input type="text" name="terms" class="form-control" value="Payment within 30 days of delivery.">
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Notes</label>
        <textarea name="notes" class="form-control" rows="2"></textarea>
      </div>
      <div class="d-flex gap-2 justify-content-end">
        <a href="{% url 'procurement:po_list' %}" class="btn btn-outline-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i>Create PO</button>
      </div>
    </form>
  </div>
</div>
</div></div>
{% endblock %}
