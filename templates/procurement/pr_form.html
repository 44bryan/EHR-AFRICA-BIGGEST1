{% extends "layouts/base_authenticated.html" %}
{% block title %}New Purchase Request{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7 col-md-9">
<div class="card border-0 shadow-sm">
  <div class="card-header bg-white border-bottom">
    <h5 class="mb-0 fw-bold"><i class="bi bi-file-earmark-plus me-2"></i>New Purchase Request</h5>
  </div>
  <div class="card-body">
    <form method="post">{% csrf_token %}
      <div class="mb-3">
        <label class="form-label fw-semibold">Title / Purpose <span class="text-danger">*</span></label>
        <input type="text" name="title" class="form-control" required placeholder="e.g. Monthly stationery supplies">
      </div>
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold">Department</label>
          <select name="department_id" class="form-select">
            <option value="">-- Select Department --</option>
            {% for dept in departments %}<option value="{{ dept.pk }}">{{ dept.name }}</option>{% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Category</label>
          <select name="category" class="form-select">
            {% for val, lbl in categories %}<option value="{{ val }}">{{ lbl }}</option>{% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Urgency</label>
          <select name="urgency" class="form-select">
            <option value="NORMAL" selected>Normal</option>
            <option value="LOW">Low</option>
            <option value="URGENT">Urgent</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Required By Date</label>
          <input type="date" name="required_by_date" class="form-control">
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Justification</label>
        <textarea name="justification" class="form-control" rows="2" placeholder="Why is this purchase needed?"></textarea>
      </div>
      <div class="d-flex gap-2 justify-content-end">
        <a href="{% url 'procurement:pr_list' %}" class="btn btn-outline-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary"><i class="bi bi-arrow-right me-1"></i>Create &amp; Add Items</button>
      </div>
    </form>
  </div>
</div>
</div></div>
{% endblock %}
