{% extends "layouts/base_authenticated.html" %}
{% block title %}Issue Outbreak Alert{% endblock %}
{% block page_header %}<h5 class="mb-0 fw-bold">Issue Outbreak / Infection Alert</h5>{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <form method="post" class="card border-0 shadow-sm">
      {% csrf_token %}
      <div class="card-body">
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label fw-semibold">Alert Title <span class="text-danger">*</span></label>
            <input type="text" name="title" class="form-control" required placeholder="e.g. MRSA cluster in Ward A">
          </div>
          <div class="col-md-6">
            <label class="form-label">Pathogen</label>
            <input type="text" name="pathogen" class="form-control" placeholder="e.g. MRSA, E. coli O157">
          </div>
          <div class="col-md-3">
            <label class="form-label">Alert Level</label>
            <select name="alert_level" class="form-select">
              {% for v, l in alert_levels %}<option value="{{ v }}">{{ l }}</option>{% endfor %}
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Case Count</label>
            <input type="number" name="case_count" class="form-control" value="1" min="1">
          </div>
          <div class="col-md-6">
            <label class="form-label">Affected Areas</label>
            <input type="text" name="affected_areas" class="form-control" placeholder="e.g. Ward A, ICU">
          </div>
          <div class="col-md-6">
            <label class="form-label">Onset Date</label>
            <input type="date" name="onset_date" class="form-control" value="{{ today|date:'Y-m-d' }}">
          </div>
          <div class="col-12">
            <label class="form-label fw-semibold">Description <span class="text-danger">*</span></label>
            <textarea name="description" class="form-control" rows="4" required></textarea>
          </div>
          <div class="col-12">
            <label class="form-label">Actions Taken</label>
            <textarea name="actions_taken" class="form-control" rows="3"></textarea>
          </div>
        </div>
      </div>
      <div class="card-footer bg-transparent d-flex gap-2">
        <button type="submit" class="btn btn-warning text-dark"><i class="bi bi-exclamation-triangle me-1"></i>Issue Alert</button>
        <a href="{% url 'infection_control:outbreak_list' %}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
