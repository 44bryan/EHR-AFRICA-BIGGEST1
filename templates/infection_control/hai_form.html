{% extends "layouts/base_authenticated.html" %}
{% block title %}Report HAI{% endblock %}
{% block page_header %}<h5 class="mb-0 fw-bold">Report Healthcare-Associated Infection</h5>{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <form method="post" class="card border-0 shadow-sm">
      {% csrf_token %}
      <div class="card-body">
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label fw-semibold">Patient <span class="text-danger">*</span></label>
            <select name="patient" class="form-select" required>
              <option value="">— Select patient —</option>
              {% for p in patients %}<option value="{{ p.pk }}">{{ p.full_name }} ({{ p.patient_id }})</option>{% endfor %}
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">HAI Type <span class="text-danger">*</span></label>
            <select name="hai_type" class="form-select" required>
              {% for v, l in hai_types %}<option value="{{ v }}">{{ l }}</option>{% endfor %}
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Causative Organism</label>
            <input type="text" name="organism" class="form-control" placeholder="e.g. E. coli, MRSA">
          </div>
          <div class="col-md-6">
            <label class="form-label">Onset Date</label>
            <input type="date" name="onset_date" class="form-control" value="{{ today|date:'Y-m-d' }}">
          </div>
          <div class="col-md-6">
            <label class="form-label">Ward</label>
            <select name="ward" class="form-select">
              <option value="">— Select ward —</option>
              {% for w in wards %}<option value="{{ w.pk }}">{{ w.name }}</option>{% endfor %}
            </select>
          </div>
          <div class="col-12">
            <label class="form-label">Clinical Details</label>
            <textarea name="clinical_details" class="form-control" rows="3"
                      placeholder="Signs, symptoms, investigation findings…"></textarea>
          </div>
          <div class="col-12">
            <label class="form-label">Notes</label>
            <textarea name="notes" class="form-control" rows="2"></textarea>
          </div>
        </div>
      </div>
      <div class="card-footer bg-transparent d-flex gap-2">
        <button type="submit" class="btn btn-danger">Submit Report</button>
        <a href="{% url 'infection_control:hai_list' %}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
