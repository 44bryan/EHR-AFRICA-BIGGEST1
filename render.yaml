services:
  - type: web
    name: ehr-africa
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn ehr_project.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: ehr_project.settings.production
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: ehr-africa-db
          property: connectionString

databases:
  - name: ehr-africa-db
    databaseName: ehr_africa
    user: ehr_user
    plan: free
