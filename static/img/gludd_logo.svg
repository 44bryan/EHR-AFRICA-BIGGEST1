<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">

  <!-- Dark background circle — self-contained, looks same everywhere -->
  <circle cx="100" cy="100" r="100" fill="#0f172a"/>

  <!-- Africa silhouette -->
  <path d="M 74,26 Q 102,19 130,26 Q 150,32 156,52 Q 162,68 158,84
           Q 164,94 158,108 Q 148,132 136,150 Q 118,170 98,178
           Q 80,172 66,156 Q 48,136 44,114 Q 38,98 44,84
           Q 42,70 46,56 Q 56,34 74,26 Z"
    fill="white" fill-opacity="0.08"
    stroke="white" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Eye upper lid -->
  <path d="M 52,100 Q 100,70 150,100"
        stroke="white" stroke-width="3" stroke-linecap="round"/>

  <!-- Eye lower lid -->
  <path d="M 52,100 Q 100,128 150,100"
        stroke="white" stroke-width="2" stroke-linecap="round"/>

  <!-- Iris ring -->
  <circle cx="100" cy="100" r="17"
          fill="none" stroke="white" stroke-width="2"/>

  <!-- Pupil dot -->
  <circle cx="100" cy="100" r="6" fill="white"/>

</svg>
